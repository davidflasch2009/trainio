<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d42"/><stop offset=".55" stop-color="#1f2125"/><stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9dce0"/><stop offset=".55" stop-color="#a6abb2"/><stop offset=".8" stop-color="#e3e6e9"/><stop offset="1" stop-color="#8d939b"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a7"/><stop offset=".3" stop-color="#f4f5f6"/><stop offset=".55" stop-color="#cfd3d7"/><stop offset="1" stop-color="#7f858c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d737a"/><stop offset=".35" stop-color="#e9ebee"/><stop offset=".6" stop-color="#b4b9bf"/><stop offset="1" stop-color="#5e646b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Kachel-Kante (Bevel) innerhalb der Safe-Zone -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <rect x="46" y="46" width="420" height="420" rx="90" fill="#000" fill-opacity=".12"/>
  <g filter="url(#sh)">
    <!-- Stange -->
    <rect x="96" y="179" width="320" height="22" rx="6" fill="url(#metal)"/>
    <!-- Scheiben links -->
    <rect x="120" y="131" width="30" height="118" rx="8" fill="url(#plate)"/>
    <rect x="96" y="147" width="26" height="86" rx="7" fill="url(#plate)"/>
    <rect x="80" y="173" width="18" height="34" rx="5" fill="url(#metal)"/>
    <!-- Scheiben rechts -->
    <rect x="362" y="131" width="30" height="118" rx="8" fill="url(#plate)"/>
    <rect x="390" y="147" width="26" height="86" rx="7" fill="url(#plate)"/>
    <rect x="414" y="173" width="18" height="34" rx="5" fill="url(#metal)"/>
    <!-- T -->
    <path d="M160 158h192a14 14 0 0 1 14 14v38a14 14 0 0 1-14 14h-62v160a14 14 0 0 1-14 14h-40a14 14 0 0 1-14-14V224h-62a14 14 0 0 1-14-14v-38a14 14 0 0 1 14-14z" fill="url(#metal)" stroke="#5b6168" stroke-width="3"/>
    <path d="M234 224h44v164h-44z" fill="url(#metalV)" opacity=".55"/>
    <path d="M164 164h184" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
