# Veröffentlicht Trainio auf GitHub Pages (…/trainio/) – erst nach grünen Tests, und zwar genau den getesteten Stand.
# Wirkt nur, wenn in den Repo-Einstellungen unter Pages die Quelle auf „GitHub Actions“ steht.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - name: Pages-Quelle prüfen
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unbekannt)
          echo "Pages-Quelle: $t"
          if [ "$t" = workflow ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::Pages-Quelle steht noch nicht auf „GitHub Actions“ – nichts veröffentlicht."; fi
      - name: App (main)
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: site
      - name: Ohne Entwicklungs-Dateien
        if: steps.mode.outputs.enabled == 'true'
        run: rm -rf site/tests site/tools site/node_modules site/docs site/.github
      - if: steps.mode.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
