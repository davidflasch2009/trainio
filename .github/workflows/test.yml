# Smoke-Test bei jedem Push: lädt die App im Browser und klickt die wichtigsten Wege durch (tests/smoke.js)
name: Test
on:
  push:
  pull_request:
  # Auch von der Pages-Action aufrufbar: veröffentlicht wird nur, wenn diese Tests grün sind
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Screenshots bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
