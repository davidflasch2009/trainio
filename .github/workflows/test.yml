# Tests bei jedem Push: prüft die Dateien und klickt die wichtigsten Wege der App im Browser durch (tests/run.js) –
# in Chromium und in WebKit (der Engine von Safari auf dem iPhone)
name: Test
on:
  push:
  pull_request:
  # Auch von der Pages-Action aufrufbar: veröffentlicht wird nur, wenn diese Tests grün sind
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Screenshots bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: tests/screenshots/
