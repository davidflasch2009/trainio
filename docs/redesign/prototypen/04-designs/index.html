<title>Trainio Design-Auswahl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;600&family=Sora:wght@600&family=Instrument+Serif:ital@0;1&family=Saira+Semi+Condensed:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@200;300;400&family=Caveat:wght@600;700&family=Audiowide&family=Jost:wght@500;700&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&family=Syne:wght@700;800&family=Alfa+Slab+One&family=Bangers&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Fredoka:wght@500;600&family=Shippori+Mincho:wght@500;700&family=Bitter:wght@600;700&family=Marcellus&display=swap">
<style>
/* WEGWERF-PROTOTYP zu Ticket 04 (docs/redesign/tickets/04-designs-auswahl.md): 24 neue Richtungen für Trainio.
   Davids Vorgabe: ganz neue Designs, eins davon „Premium, dunkel“. Jedes Design zeigt dieselben Bildschirme (Start,
   laufendes Workout, Fortschritt) mit eigener Schrift, Form, Material, Farbe, Score-Form und Tab-Leiste.
   Seite: neutraler Rahmen, Telefone als feste 390 × 844-Rahmen, skaliert. Fassungen davor: Git-Historie. */
:root {
  --bg: #EFEFF1; --surface: #FFFFFF; --fill: #E2E2E7; --line: rgba(17, 18, 28, .12);
  --text: #121318; --text-2: #50535D; --accent: #121318; --on-accent: #FFFFFF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0A0A0C; --surface: #17171A; --fill: #29292F; --line: rgba(255, 255, 255, .12); --text: #F2F2F5; --text-2: #A7A9B3; --accent: #F2F2F5; --on-accent: #0A0A0C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0A0A0C; --surface: #17171A; --fill: #29292F; --line: rgba(255, 255, 255, .12); --text: #F2F2F5; --text-2: #A7A9B3; --accent: #F2F2F5; --on-accent: #0A0A0C; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/20px var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 12px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.top h1 { font-size: 22px; line-height: 28px; font-weight: 700; flex: 1; letter-spacing: -.01em; }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 600; color: var(--text-2); position: relative; }
.seg button::after { content: ""; position: absolute; inset: -6px 0; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.pbtn { min-height: 36px; padding: 0 12px; border-radius: 10px; background: var(--fill); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pbtn .ic { width: 16px; height: 16px; }
.lead { color: var(--text-2); max-width: 62ch; margin-bottom: 8px; }
.grp { margin-top: 28px; }
.grp h2 { font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px 20px; } }
.card { display: flex; flex-direction: column; gap: 8px; cursor: pointer; border-radius: 22px; }
.mini, .phone { position: relative; overflow: hidden; aspect-ratio: 390 / 844; max-width: 100%; }
.mini { width: 100%; border-radius: 22px; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0, 0, 0, .1); }
.mini > .frame, .phone > .frame { position: absolute; left: 0; top: 0; transform: scale(var(--k, .4)); transform-origin: 0 0; }
.cap { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.cap b { font-size: 15px; }
.cap span { font-size: 12px; color: var(--text-2); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-weight: 600; color: var(--text-2); white-space: nowrap; position: relative; }
.chip::after { content: ""; position: absolute; inset: -5px 0; }
.chip.on { background: var(--text); color: var(--bg); }
.dhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
.dh-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 60ch; }
.dh-row { display: flex; align-items: center; gap: 10px; }
.dh-row h2 { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; }
.tag { font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--fill); color: var(--text-2); white-space: nowrap; }
.type { font-size: 17px; line-height: 23px; }
.mk { color: var(--text-2); }
.mk b { color: var(--text); }
.sw-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sw-row .lbl { font-weight: 600; color: var(--text-2); margin-right: 2px; }
.sw { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); position: relative; }
.sw::after { content: ""; position: absolute; inset: -5px; }
.sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.screens { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 12px; scrollbar-width: thin; }
.shot { flex: none; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: center; }
.shot p { font-weight: 600; color: var(--text-2); }
.phone { width: min(390px, calc(100vw - 64px)); border-radius: 34px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .16); }
.pager { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ==================== Telefon-Rahmen: Grundgerüst, gesteuert über --f-Variablen ==================== */
.frame { --f-r: 18px; --f-rb: 16px; position: relative; width: 390px; height: 844px; overflow: hidden; isolation: isolate; background: var(--f-bg); color: var(--f-text); font-family: var(--f-body); text-align: left; -webkit-font-smoothing: antialiased; }
.frame .ic { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: var(--f-sw, 1.8); stroke-linecap: round; stroke-linejoin: round; }
.f-bg { position: absolute; inset: 0; z-index: -1; background: var(--f-bgimg); }
.f-scr { padding: 22px 16px 120px; display: flex; flex-direction: column; gap: 16px; }
.f-date { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--f-text2); }
.f-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.f-title { font-family: var(--f-title); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.f-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--f-surface); border: 1px solid var(--f-border); color: var(--f-tt); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; flex: none; position: relative; }
.f-score { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.f-score svg { display: block; overflow: visible; }
.f-score-l { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--f-text2); }
.f-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f-tile { position: relative; background: var(--f-surface); border-radius: var(--f-r); padding: 14px 16px; min-height: 100px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; color: var(--f-tt); overflow: hidden; }
.f-tl { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--f-tl); display: flex; gap: 6px; align-items: center; }
.f-num { white-space: nowrap; }
.f-num b { font-family: var(--f-num); font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.f-num small { font-size: 13px; font-weight: 600; color: var(--f-tl); margin-left: 3px; }
.f-btn { position: relative; min-height: 54px; border-radius: var(--f-rb); background: var(--f-accent); color: var(--f-onacc); font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.f-sec { display: flex; flex-direction: column; gap: 8px; }
.f-sec h3 { font-family: var(--f-title); font-size: 20px; line-height: 1.25; font-weight: 600; }
.f-blk { position: relative; background: var(--f-surface); border-radius: var(--f-r); color: var(--f-tt); overflow: hidden; }
.f-goal { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.f-row { display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; }
.f-bar { display: block; height: 6px; border-radius: 3px; background: var(--f-fill); overflow: hidden; }
.f-bar i { display: block; height: 100%; width: var(--w); background: var(--f-accent); border-radius: inherit; }
.f-li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 13px 16px; font-size: 17px; }
.f-li + .f-li, .f-set + .f-set { border-top: 1px solid var(--f-border); }
.f-li b { font-weight: 600; }
.f-li span { color: var(--f-tl); font-size: 15px; }
.f-set { display: grid; grid-template-columns: 40px 1fr 1fr 36px; align-items: center; gap: 8px; padding: 8px 16px; font-size: 17px; font-variant-numeric: tabular-nums; }
.f-set.hd { font-size: 12px; font-weight: 700; color: var(--f-tl); padding-block: 10px 4px; }
.f-set.cur { background: color-mix(in srgb, var(--f-accent) 14%, transparent); font-weight: 700; }
.f-ck { width: 32px; height: 32px; border-radius: 10px; border: 1.5px solid var(--f-border); display: grid; place-items: center; justify-self: end; }
.f-ck.on { background: var(--f-accent); border-color: var(--f-accent); color: var(--f-onacc); }
.f-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f-step { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; min-height: 60px; text-align: center; padding: 0 4px; }
.f-step > span:first-child, .f-step > span:last-child { font-size: 22px; font-weight: 600; }
.frame .f-step .f-num b { font-size: var(--f-stepsize, 22px); }
.f-chart { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.f-chart svg { display: block; width: 100%; height: auto; }
.f-chart .cb { fill: var(--f-tl); opacity: .32; }
.f-chart .cb.on { fill: var(--f-accent); opacity: 1; }
.f-tb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; background: var(--f-tb); border-top: 1px solid var(--f-border); padding: 6px 4px 24px; color: var(--f-tbtext); }
.f-tb span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; line-height: 13px; font-weight: 500; padding: 4px 0; }
.f-tb span.on { color: var(--f-accent); }
.f-tb .ic { width: 21px; height: 21px; }
.f-float { left: 12px; right: 12px; bottom: 14px; padding: 6px 4px; border-radius: 999px; }

/* ---------- Premium dunkel ---------- */
/* Onyx: Schwarz, Champagner, Haarlinien, gesperrte Versalien */
.d-onyx { --f-r: 3px; --f-rb: 2px; --f-sw: 1.3; }
.d-onyx .f-date, .d-onyx .f-tl, .d-onyx .f-score-l, .d-onyx .f-tb span, .d-onyx .f-set.hd, .d-onyx .f-chip { text-transform: uppercase; letter-spacing: .16em; font-size: 11px; font-weight: 600; }
.d-onyx .f-tile, .d-onyx .f-blk { border: 1px solid var(--f-border); }
.d-onyx .f-num b { font-weight: 300; font-size: 36px; }
.d-onyx .f-num small { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }
.d-onyx .f-title, .d-onyx .f-sec h3 { font-weight: 300; }
.d-onyx .f-sec h3 { font-size: 24px; }
.d-onyx .f-btn { background: transparent; color: var(--f-accent); border: 1px solid var(--f-accent); text-transform: uppercase; letter-spacing: .22em; font-size: 13px; font-weight: 600; }
.d-onyx .f-bar { height: 2px; border-radius: 0; }
.d-onyx .f-ck, .d-onyx .f-chip { border-radius: 2px; background: transparent; }
.d-onyx .f-ck.on { background: transparent; color: var(--f-accent); }
/* Glut: warmer Lichtschein hinter dem Score */
.d-glut { --f-r: 20px; --f-accent2: color-mix(in srgb, var(--f-accent) 55%, #C4123F); }
.d-glut .f-bg { background: radial-gradient(80% 30% at 50% 15%, color-mix(in srgb, var(--f-accent) var(--f-glow), transparent) 0%, transparent 72%); }
.d-glut .f-tile, .d-glut .f-blk { border: 1px solid var(--f-border); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.d-glut .f-num b { font-weight: 600; font-size: 32px; letter-spacing: -.03em; }
.d-glut .f-title { font-weight: 600; }
.d-glut .f-btn { background: linear-gradient(135deg, var(--f-accent), var(--f-accent2)); color: #FFFFFF; box-shadow: 0 12px 30px color-mix(in srgb, var(--f-accent) 45%, transparent); }
.d-glut .f-bar i, .d-glut .f-ck.on { background: linear-gradient(90deg, var(--f-accent2), var(--f-accent)); border-color: transparent; color: #FFFFFF; }
/* Jade: Grün-Schwarz, elegante Serifen-Ziffern */
.d-jade { --f-r: 16px; --f-rb: 999px; }
.d-jade .f-tile, .d-jade .f-blk { border: 1px solid var(--f-border); }
.d-jade .f-num b { font-weight: 400; font-size: 44px; letter-spacing: -.01em; }
.d-jade .f-date, .d-jade .f-score-l { font-family: var(--f-num); font-style: italic; font-weight: 400; font-size: 19px; }
.d-jade .f-title, .d-jade .f-sec h3 { font-weight: 400; }
.d-jade .f-title { font-size: 36px; } .d-jade .f-sec h3 { font-size: 26px; }
/* Titan: gebürstetes Metall, Gravur-Versalien */
.d-titan { --f-r: 10px; --f-rb: 10px; }
.d-titan .f-tile, .d-titan .f-blk, .d-titan .f-chip { background: linear-gradient(140deg, rgba(255, 255, 255, .12), transparent 35%, rgba(255, 255, 255, .05) 60%, transparent 80%), var(--f-surface); border: 1px solid var(--f-border); }
.d-titan .f-date, .d-titan .f-tl, .d-titan .f-score-l, .d-titan .f-tb span, .d-titan .f-set.hd, .d-titan .f-btn, .d-titan .f-chip { text-transform: uppercase; letter-spacing: .12em; }
.d-titan .f-tl, .d-titan .f-date { font-size: 12px; }
.d-titan .f-num b { font-weight: 600; font-size: 38px; letter-spacing: 0; }
.d-titan .f-title, .d-titan .f-sec h3 { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.d-titan .f-btn { background: var(--f-metal); color: var(--f-metaltext); font-size: 15px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 2px 8px rgba(0, 0, 0, .25); }
.d-titan .f-bar { height: 4px; border-radius: 0; }
/* Velours: Samt, Roségold, klassische Serifen */
.d-velours { --f-r: 24px; --f-rb: 999px; }
.d-velours .f-tile, .d-velours .f-blk { background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .07), transparent 60%), var(--f-surface); }
.d-velours .f-num b { font-weight: 600; font-size: 42px; letter-spacing: -.01em; }
.d-velours .f-title, .d-velours .f-sec h3 { font-weight: 600; }
.d-velours .f-title { font-size: 36px; } .d-velours .f-sec h3 { font-size: 27px; }
.d-velours .f-date, .d-velours .f-score-l { font-family: var(--f-num); font-style: italic; font-size: 19px; font-weight: 500; }
.d-velours .f-btn { background: linear-gradient(135deg, var(--f-accent), color-mix(in srgb, var(--f-accent) 55%, #FFFFFF)); }

/* ---------- Edel ---------- */
/* Chronograph: Zifferblatt, Skalen, Kapitälchen */
.d-chrono { --f-r: 22px; --f-rb: 999px; }
.d-chrono .f-tile, .d-chrono .f-blk { border: 1px solid var(--f-border); }
.d-chrono .f-tile::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--f-tl) 0 1px, transparent 1px 7px); opacity: .45; }
.d-chrono .f-tl, .d-chrono .f-date, .d-chrono .f-score-l, .d-chrono .f-tb span { font-family: var(--f-num); font-variant: small-caps; text-transform: lowercase; letter-spacing: .1em; font-size: 15px; font-weight: 500; }
.d-chrono .f-num b { font-weight: 500; font-size: 38px; letter-spacing: -.01em; }
.d-chrono .f-title, .d-chrono .f-sec h3 { font-weight: 500; }
.d-chrono .f-sec h3 { font-size: 24px; }
.d-chrono .f-btn { background: var(--f-text); color: var(--f-bg); letter-spacing: .12em; text-transform: uppercase; font-size: 14px; }
.d-chrono .f-bar { height: 4px; }
/* Marmor: Stein, Gold, Doppellinien */
.d-marmor { --f-r: 2px; --f-rb: 2px; }
.d-marmor .f-bg { background: var(--f-marble) 0 0 / cover; }
.d-marmor .f-tile, .d-marmor .f-blk, .d-marmor .f-chip { background: var(--f-surface); border: 1px solid var(--f-accent); border-radius: 2px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.d-marmor .f-tile::after, .d-marmor .f-blk::after { content: ""; position: absolute; inset: 4px; border: 1px solid color-mix(in srgb, var(--f-accent) 40%, transparent); pointer-events: none; }
.d-marmor .f-num b { font-weight: 400; font-size: 38px; letter-spacing: .01em; }
.d-marmor .f-title, .d-marmor .f-sec h3 { font-weight: 400; letter-spacing: .04em; }
.d-marmor .f-tl, .d-marmor .f-date, .d-marmor .f-score-l, .d-marmor .f-tb span, .d-marmor .f-btn, .d-marmor .f-set.hd, .d-marmor .f-chip { text-transform: uppercase; letter-spacing: .18em; font-size: 11px; }
.d-marmor .f-btn { background: var(--f-text); color: var(--f-bg); font-size: 13px; }
.d-marmor .f-bar { height: 2px; }

/* ---------- Ruhig ---------- */
/* Kontur: nur Linien */
.d-kontur { --f-r: 14px; --f-rb: 999px; --f-sw: 1.4; }
.d-kontur .f-tile, .d-kontur .f-blk, .d-kontur .f-chip { background: transparent; border: 1.5px solid var(--f-text); }
.d-kontur .f-num b { font-weight: 300; font-size: 36px; }
.d-kontur .f-title, .d-kontur .f-sec h3 { font-weight: 400; }
.d-kontur .f-sec h3 { font-size: 22px; }
.d-kontur .f-bar { height: 10px; border: 1.5px solid var(--f-text); background: transparent; border-radius: 5px; }
.d-kontur .f-li + .f-li, .d-kontur .f-set + .f-set { border-top-color: var(--f-text); }
.d-kontur .f-tb { border-top: 1.5px solid var(--f-text); }
.d-kontur .f-ck { border-color: var(--f-text); }
/* Zen: Weißraum, Pinselkreis, roter Stempel */
.d-zen { --f-r: 0; --f-rb: 2px; }
.d-zen .f-scr { gap: 22px; padding-left: 24px; padding-right: 24px; }
.d-zen .f-tiles { gap: 0; }
.d-zen .f-tile { background: transparent; border-left: 1px solid var(--f-border); padding: 4px 16px 12px; min-height: 92px; }
.d-zen .f-tile:nth-child(odd) { border-left: 0; padding-left: 0; }
.d-zen .f-tile:nth-child(n+3) { border-top: 1px solid var(--f-border); padding-top: 14px; }
.d-zen .f-num b { font-weight: 500; font-size: 36px; letter-spacing: 0; }

.d-blau .f-li + .f-li, .d-blau .f-set + .f-set { border-top: 1px dashed var(--f-text); }
.d-blau .f-tb { border-top: 1.5px solid var(--f-text); }
.d-blau .f-tb span.on { color: var(--f-text); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Farb-Hilfen ---------- */
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const toHex = c => '#' + c.map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return toHex(x.map((v, i) => v + (y[i] - v) * t)); };
const rgba = (h, a) => `rgba(${hex(h).join(',')},${a})`;
const lum = h => { const c = hex(h).map(x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
/* Akzent so lange abdunkeln bzw. aufhellen, bis er sich vom Hintergrund abhebt */
const ensure = (c, bg, min) => { let x = c; for (let i = 0; i < 14 && contrast(x, bg) < min; i++) x = mix(x, lum(bg) > .35 ? '#000000' : '#FFFFFF', .12); return x; };
const svgUrl = s => `url('data:image/svg+xml,${encodeURIComponent(s).replace(/'/g, '%27')}')`;
const NOISE = op => svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(#n)' opacity='${op}'/></svg>`);
const MARBLE = (base, vein) => svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.005 .012' numOctaves='5' seed='11' result='t'/><feColorMatrix in='t' type='luminanceToAlpha' result='l'/><feComponentTransfer in='l' result='b'><feFuncA type='table' tableValues='0 0 .7 0 0 0 .5 0 0 .35 0 0'/></feComponentTransfer><feFlood flood-color='${vein}'/><feComposite in2='b' operator='in'/></filter><rect width='100%' height='100%' fill='${base}'/><rect width='100%' height='100%' filter='url(#m)'/></svg>`);
function CONTOURS(stroke) {
  let p = '';
  [[70, 170, 9, 0], [330, 560, 11, 1], [60, 780, 6, 2]].forEach(([cx, cy, n, ci]) => {
    for (let k = 1; k <= n; k++) {
      const r0 = k * 21; let d = '';
      for (let a = 0; a <= 360; a += 10) { const t = a * Math.PI / 180, r = r0 * (1 + .12 * Math.sin(3 * t + k * .7 + ci) + .06 * Math.sin(5 * t + k)); d += `${a ? 'L' : 'M'}${(cx + r * Math.cos(t)).toFixed(1)} ${(cy + r * .8 * Math.sin(t)).toFixed(1)}`; }
      p += `<path d='${d}Z'/>`;
    }
  });
  return svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844' fill='none' stroke='${stroke}' stroke-width='1'>${p}</svg>`);
}

/* ---------- Score-Bausteine (viewBox 100 × 100) ---------- */
const arc = (v, r, w, color, cap = 'round') => { const c = 2 * Math.PI * r; return `<circle cx="50" cy="50" r="${r}" style="fill:none;stroke:${color};stroke-width:${w};stroke-linecap:${cap}" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>`; };
const num = (v, font, color, size, extra = '') => `<text x="50" y="51" text-anchor="middle" dominant-baseline="central" style="font:${font};font-size:${size}px;fill:${color};font-variant-numeric:tabular-nums;${extra}">${v}</text>`;

}).join('');
const burst = (n, ro, ri, cx = 50, cy = 50) => Array.from({ length: n * 2 }, (_, k) => { const a = k * Math.PI / n - Math.PI / 2, r = k % 2 ? ri : ro; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(' ');
function pixelRing(v) {
  const N = 13, cs = 100 / N, cells = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const x = j - 6, y = i - 6, d = Math.hypot(x, y); if (d >= 4.6 && d <= 6.4) cells.push({ i, j, a: (Math.atan2(x, -y) + 2 * Math.PI) % (2 * Math.PI) }); }
  cells.sort((p, q) => p.a - q.a);
  const lit = Math.round(cells.length * v / 100);
  return cells.map((c, k) => `<rect x="${(c.j * cs).toFixed(2)}" y="${(c.i * cs).toFixed(2)}" width="${(cs - .8).toFixed(2)}" height="${(cs - .8).toFixed(2)}" style="fill:${k < lit ? 'var(--f-accent)' : 'var(--f-fill)'}"/>`).join('');
}

    score: v => `<circle cx="50" cy="50" r="42" style="fill:none;stroke:var(--f-text);stroke-width:1.2"/>${arc(v, 47, 2.5, 'var(--f-accent)', 'butt')}<line x1="0" y1="50" x2="100" y2="50" style="stroke:var(--f-text);stroke-width:.5;stroke-dasharray:6 2 1 2"/><line x1="50" y1="0" x2="50" y2="100" style="stroke:var(--f-text);stroke-width:.5;stroke-dasharray:6 2 1 2"/><rect x="30" y="40" width="40" height="20" style="fill:var(--f-bg)"/>${num(v, "700 26px 'Courier Prime', monospace", 'var(--f-text)', 26)}<text x="97" y="9" text-anchor="end" style="font:400 7px 'Courier Prime', monospace;fill:var(--f-text2)">Ø 100</text>` }
];
const GROUPS = [...new Set(DES.map(d => d.grp))];

/* ---------- Zustand ---------- */
const S = { view: 'alle', cur: 'onyx', theme: 'auto', acc: {} };
const mode = () => S.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme;

/* ---------- Telefon ---------- */
function frameVars(d) {
  const m = mode(), p = { ...d.pal[m] };
  let acc = S.acc[d.id] || p.accent;
  if (d.id === 'voll') p.bg = m === 'dark' ? mix(acc, '#000000', .55) : acc;
  else if (!d.fixedAcc) acc = ensure(acc, p.bg, 3);
  if (d.id === 'term') { p.text = ensure(acc, p.bg, 4.5); p.text2 = rgba(p.text, .66); p.border = rgba(p.text, .38); p.fill = rgba(p.text, .15); }
  if (d.id === 'bauhaus') p.t0 = acc;
  if (d.id === 'analog') p.accentdk = mix(acc, '#000000', .35);
  p.accent = acc;
  p.onacc = lum(acc) > .4 ? '#111111' : '#FFFFFF';
  const v = { bgimg: 'none', tbtext: p.text2, tl: p.text2, tt: p.text, ...p,
    body: d.font.body || 'var(--font)', num: d.font.num || d.font.body || 'var(--font)', title: d.font.title || d.font.num || d.font.body || 'var(--font)' };
  return Object.entries(v).map(([k, x]) => `--f-${k}:${x}`).join(';');
}
const FLOAT = new Set(['chrom', 'knete', 'synth']);
const TB = (d, on) => `<nav class="f-tb ${FLOAT.has(d.id) ? 'f-float' : ''}">${[['home', 'Start'], ['dumbbell', 'Training'], ['book', 'Übungen'], ['chart', 'Fortschritt'], ['grid', 'Mehr']].map(([i, l], k) => `<span class="${k === on ? 'on' : ''}">${ic(i)}${l}</span>`).join('')}</nav>`;
const scoreSvg = (d, size) => `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Trainio-Score 78">${d.score(78)}</svg>`;
const tile = ([i, l, v, u], k) => `<div class="f-tile t${k}"><span class="f-tl">${ic(i)}${l}</span><span class="f-num"><b>${v}</b>${u ? `<small>${u}</small>` : ''}</span></div>`;
const bars = () => { const v = [3, 4, 3, 3, 4, 3, 3, 4, 3, 4, 1], w = 300, h = 76, bw = 16, gap = (w - v.length * bw) / (v.length - 1);
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${v.map((x, i) => { const hh = x / 4 * (h - 4); return `<rect class="cb ${i === 9 ? 'on' : ''}" x="${(i * (bw + gap)).toFixed(1)}" y="${(h - hh).toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" rx="2"${i === 10 ? ' style="opacity:.14"' : ''}/>`; }).join('')}</svg>`; };
const SCREENS = {
  start: ['Start', d => `<div class="f-scr">
    <p class="f-date">Donnerstag, 12. November</p>
    <div class="f-score">${scoreSvg(d, 156)}<span class="f-score-l">Trainio-Score</span></div>
    <div class="f-tiles">${[['flame', 'Serie', '11', 'Wochen'], ['bolt', 'Volumen', '4.960', 'kg'], ['scale', 'Körpergewicht', '80,5', 'kg'], ['trophy', 'Neue Rekorde', '13', '']].map(tile).join('')}</div>
    <div class="f-btn">${ic('play')}<span>Workout starten</span></div>
    <div class="f-sec"><h3>Ziele</h3><div class="f-blk f-goal"><span class="f-row"><span>Bankdrücken</span><span>92 %</span></span><span class="f-bar"><i style="--w:92%"></i></span></div></div>
    <div class="f-sec"><h3>Letzte Workouts</h3><div class="f-blk"><div class="f-li"><b>Push</b><span>Mo, 9. Nov</span></div><div class="f-li"><b>Radfahren draußen</b><span>Sa, 7. Nov</span></div></div></div>
  </div>${TB(d, 0)}`],
  workout: ['Laufendes Workout', d => `<div class="f-scr">
    <div class="f-head"><div><p class="f-date">Pull · 14:21</p><h2 class="f-title">Kreuzheben</h2></div><span class="f-chip">Beenden</span></div>
    <span class="f-bar"><i style="--w:13%"></i></span>
    <div class="f-blk"><div class="f-set hd"><span>Satz</span><span>kg</span><span>Wdh.</span><span></span></div>
      ${[[1, 'done'], [2, 'done'], [3, 'cur']].map(([n, s]) => `<div class="f-set ${s}"><span>${n}</span><span>137,5</span><span>5</span><span class="f-ck ${s === 'done' ? 'on' : ''}">${s === 'done' ? ic('check') : ''}</span></div>`).join('')}</div>
    <div class="f-steps"><div class="f-blk f-step"><span>−</span><span class="f-num"><b>137,5</b><small>kg</small></span><span>+</span></div><div class="f-blk f-step"><span>−</span><span class="f-num"><b>5</b><small>Wdh.</small></span><span>+</span></div></div>
    <div class="f-btn">${ic('check')}<span>Satz erledigt</span></div>
    <div class="f-sec"><h3>Als Nächstes</h3><div class="f-blk"><div class="f-li"><b>Klimmzüge</b><span>3 × 8</span></div><div class="f-li"><b>Rudern vorgebeugt</b><span>3 × 10</span></div></div></div>
  </div>${TB(d, 1)}`],
  progress: ['Fortschritt', d => `<div class="f-scr">
    <div class="f-head"><h2 class="f-title">Fortschritt</h2><span class="f-chip">3 Monate</span></div>
    <div class="f-score">${scoreSvg(d, 124)}<span class="f-score-l">Trainio-Score</span></div>
    <div class="f-tiles">${[['calendar', 'Pro Woche', '3,2', ''], ['gauge', 'Workout-Score', '88', ''], ['trophy', 'Neue Rekorde', '13', ''], ['grid', 'Trainingstage', '36', '']].map(tile).join('')}</div>
    <div class="f-blk f-chart"><span class="f-tl">Workouts pro Woche</span>${bars()}</div>
    <div class="f-blk"><div class="f-li"><b>Mehr Statistiken</b><span>›</span></div></div>
  </div>${TB(d, 3)}`]
};
const frameHtml = (d, scr) => `<div class="frame d-${d.id}" style="${frameVars(d)}"><div class="f-bg"></div>${SCREENS[scr][1](d)}</div>`;

/* ---------- Ansichten ---------- */
function viewAlle() {
  return `<p class="lead">Dieselbe Startseite in 24 neuen Richtungen. Fokus und Liquid Glass bleiben gesetzt. Antippen zeigt Start, Workout und Fortschritt.</p>
  ${GROUPS.map(g => `<section class="grp"><h2>${g}</h2><div class="grid">${DES.filter(d => d.grp === g).map(d => `<div class="card" role="button" tabindex="0" data-open="${d.id}" aria-label="${d.name} ansehen"><div class="mini" aria-hidden="true" inert>${frameHtml(d, 'start')}</div><div class="cap"><b>${d.name}</b></div></div>`).join('')}</div></section>`).join('')}`;
}
function viewEinzeln() {
  const i = DES.findIndex(x => x.id === S.cur), d = DES[i], prev = DES[(i + DES.length - 1) % DES.length], next = DES[(i + 1) % DES.length];
  const cur = S.acc[d.id] || d.pal[mode()].accent;
  return `<div class="chips">${DES.map(x => `<button class="chip ${x.id === d.id ? 'on' : ''}" data-open="${x.id}">${x.name}</button>`).join('')}</div>
  <div class="dhead">
    <div class="dh-main"><div class="dh-row"><h2>${d.name}</h2><span class="tag">${d.grp}</span></div><p class="type">${d.idea}</p><p class="mk"><b>Markenzeichen:</b> ${d.mark}</p></div>
    <div class="sw-row"><span class="lbl">Akzent</span>${d.acc.map((c, k) => `<button class="sw ${cur.toLowerCase() === c.toLowerCase() || (!S.acc[d.id] && k === 0 && !d.acc.some(x => x.toLowerCase() === cur.toLowerCase())) ? 'on' : ''}" style="background:${c}" data-acc="${c}" aria-label="Akzentfarbe ${k + 1}"></button>`).join('')}</div>
  </div>
  <div class="screens">${Object.entries(SCREENS).map(([k, [label]]) => `<div class="shot"><div class="phone" role="img" aria-label="${d.name}: ${label}">${frameHtml(d, k)}</div><p>${label}</p></div>`).join('')}</div>
  <div class="pager"><button class="pbtn" data-open="${prev.id}">${ic('chevL')}${prev.name}</button><button class="pbtn" data-open="${next.id}">${next.name}${ic('chevR')}</button></div>`;
}
function fit() { document.querySelectorAll('.mini, .phone').forEach(m => m.style.setProperty('--k', m.clientWidth / 390)); }
function render() {
  $('#main').innerHTML = S.view === 'alle' ? viewAlle() : viewEinzeln();
  $('#v-alle').classList.toggle('on', S.view === 'alle');
  $('#v-einzeln').classList.toggle('on', S.view === 'einzeln');
  $('#theme').innerHTML = `${ic(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto')}${{ auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[S.theme]}`;
  fit();
}
function setHash() { const h = S.view === 'alle' ? '#alle' : `#d-${S.cur}`; try { history.replaceState(null, '', h); } catch (e) { /* Rahmen erlaubt es nicht */ } }
function readHash() { const m = /^#d-([a-z]+)$/.exec(location.hash); if (m && DES.some(d => d.id === m[1])) { S.view = 'einzeln'; S.cur = m[1]; } else if (location.hash === '#alle') S.view = 'alle'; }
function applyTheme() {
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  try { localStorage.setItem('trainio-24-theme', S.theme); } catch (e) { /* ohne Speicher */ }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open], [data-view], [data-acc], #theme');
  if (!t) return;
  if (t.id === 'theme') { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); render(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; setHash(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.open) { S.view = 'einzeln'; S.cur = t.dataset.open; setHash(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.acc) { S.acc[S.cur] = t.dataset.acc; render(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-open]')) { e.preventDefault(); e.target.click(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') render(); });
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => { readHash(); render(); });
try { S.theme = localStorage.getItem('trainio-24-theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
readHash();
applyTheme();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
