<title>Trainio Design-Auswahl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400..700&family=Sora:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400..700&family=IBM+Plex+Sans:wght@400;500;600&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* WEGWERF-PROTOTYP zu Ticket 04: 10 klare, ruhige Designs für Trainio (Davids Vorgabe: „klar, passend für die App,
   nicht zu viel los“). Alle mit demselben schlichten Aufbau wie Klarblau 2: Kacheln nur Titel und Zahl, Score als Kreis,
   keine Zierlinien oder Mini-Grafiken. Unterschiede nur über Schrift, Farbe, Ecken, Flächen und die Form des Kreises.
   Seite: neutraler Rahmen, Telefone als feste 390 × 844-Rahmen, skaliert. Frühere Fassungen: Git-Historie. */
:root {
  --bg: #EFEFF1; --surface: #FFFFFF; --fill: #E2E2E7; --line: rgba(17, 18, 28, .12);
  --text: #121318; --text-2: #50535D; --accent: #121318; --on-accent: #FFFFFF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0A0A0C; --surface: #17171A; --fill: #29292F; --line: rgba(255, 255, 255, .12); --text: #F2F2F5; --text-2: #A7A9B3; --accent: #F2F2F5; --on-accent: #0A0A0C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0A0A0C; --surface: #17171A; --fill: #29292F; --line: rgba(255, 255, 255, .12); --text: #F2F2F5; --text-2: #A7A9B3; --accent: #F2F2F5; --on-accent: #0A0A0C; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/20px var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 12px 0; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.top h1 { font-size: 22px; line-height: 28px; font-weight: 700; flex: 1; letter-spacing: -.01em; }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 600; color: var(--text-2); position: relative; }
.seg button::after { content: ""; position: absolute; inset: -6px 0; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.pbtn { min-height: 36px; padding: 0 12px; border-radius: 10px; background: var(--fill); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pbtn .ic { width: 16px; height: 16px; }
.top h1 { white-space: nowrap; }
@media (max-width: 420px) { #theme .tl { display: none; } #theme { padding: 0 10px; } }
.lead { color: var(--text-2); margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 32px 20px; } }
.card { display: flex; flex-direction: column; gap: 10px; cursor: pointer; border-radius: 22px; }
.mini, .phone { position: relative; overflow: hidden; aspect-ratio: 390 / 844; max-width: 100%; }
.mini { width: 100%; border-radius: 22px; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0, 0, 0, .1); }
.mini > .frame, .phone > .frame { position: absolute; left: 0; top: 0; transform: scale(var(--k, .4)); transform-origin: 0 0; }
.cap { display: flex; flex-direction: column; gap: 2px; }
.cap b { font-size: 16px; }
.cap span { font-size: 13px; color: var(--text-2); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-weight: 600; color: var(--text-2); white-space: nowrap; position: relative; }
.chip::after { content: ""; position: absolute; inset: -5px 0; }
.chip.on { background: var(--text); color: var(--bg); }
.dhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
.dhead h2 { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; }
.dhead p { font-size: 17px; line-height: 23px; color: var(--text-2); margin-top: 4px; }
.sw-row { display: flex; gap: 10px; align-items: center; }
.sw { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); position: relative; }
.sw::after { content: ""; position: absolute; inset: -6px; }
.sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.screens { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 12px; }
.shot { flex: none; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: center; }
.shot p { font-weight: 600; color: var(--text-2); }
.phone { width: min(390px, calc(100vw - 64px)); border-radius: 34px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .16); }
.pager { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.ic { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ==================== Telefon: ein schlichter Aufbau für alle Designs, gesteuert über --f-Variablen ==================== */
.frame { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--f-bg); color: var(--f-text); font-family: var(--f-font); text-align: left; -webkit-font-smoothing: antialiased; }
.f-scr { padding: 24px 20px 120px; display: flex; flex-direction: column; gap: 26px; }
.f-small { font-size: 15px; line-height: 20px; color: var(--f-text2); }
.f-title { font-size: 30px; line-height: 36px; font-weight: var(--f-tw); letter-spacing: var(--f-track); }
.f-head { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.f-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.f-score { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.f-score svg { display: block; }
.f-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f-tile { background: var(--f-card); border-radius: var(--f-r); box-shadow: var(--f-shadow); padding: 16px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.f-tile .f-small { font-weight: 500; }
.f-num { font-size: 32px; line-height: 1.1; font-weight: var(--f-nw); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.f-u { font-size: 15px; font-weight: 500; color: var(--f-text2); margin-left: 4px; letter-spacing: 0; }
.f-btn { min-height: 54px; border-radius: var(--f-rb); background: var(--f-accent); color: var(--f-onacc); font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.f-btn2 { min-height: 36px; padding: 0 14px; border-radius: var(--f-rb); background: var(--f-card); box-shadow: var(--f-shadow); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.f-sec { display: flex; flex-direction: column; gap: 12px; }
.f-link { color: var(--f-accent); font-size: 15px; font-weight: 600; }
.f-list { background: var(--f-card); border-radius: var(--f-r); box-shadow: var(--f-shadow); overflow: hidden; }
.f-li { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 14px 16px; position: relative; }
.f-li + .f-li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--f-sep); }
.f-li .grow { flex: 1; min-width: 0; }
.f-chev { color: var(--f-text2); opacity: .6; }
.f-goal { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.f-bar { height: 6px; border-radius: 3px; background: var(--f-sep); overflow: hidden; }
.f-bar i { display: block; height: 100%; width: var(--w); border-radius: 3px; background: var(--f-accent); }
.f-tabs { display: flex; gap: 24px; font-size: 16px; font-weight: 600; color: var(--f-text2); white-space: nowrap; overflow: hidden; }
.f-tabs .on { color: var(--f-text); }
.f-wtab { background: var(--f-card); border-radius: var(--f-r); box-shadow: var(--f-shadow); overflow: hidden; }
.f-set { display: grid; grid-template-columns: 44px 1fr 1fr 44px; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px 0 16px; font-size: 17px; font-variant-numeric: tabular-nums; position: relative; }
.f-set + .f-set::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--f-sep); }
.f-set.hd { min-height: 36px; font-size: 13px; font-weight: 500; color: var(--f-text2); }
.f-set .n { color: var(--f-text2); }
.f-set.cur { background: var(--f-soft); font-weight: 600; }
.f-ck { width: 30px; height: 30px; border-radius: calc(var(--f-r) / 2.5); display: grid; place-items: center; background: var(--f-bg); box-shadow: inset 0 0 0 1.5px var(--f-sep); justify-self: end; }
.f-ck.on { background: var(--f-accent); color: var(--f-onacc); box-shadow: none; }
.f-ck .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.f-edit { background: var(--f-soft); padding: 4px 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.f-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f-step { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; min-height: 52px; background: var(--f-bg); border-radius: var(--f-r); text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.f-step .f-u { font-size: 13px; margin-left: 3px; }
.f-tb { position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: var(--f-tb); border-top: 1px solid var(--f-sep); padding: 6px 4px 26px; }
.f-tb span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; line-height: 13px; font-weight: 500; color: var(--f-text2); }
.f-tb span.on { color: var(--f-accent); }
.f-tb .ic { width: 21px; height: 21px; }
</style>

<div class="wrap">
  <div class="top">
    <h1>10 Designs</h1>
    <div class="seg" aria-label="Ansicht"><button id="v-alle" data-view="alle">Alle</button><button id="v-einzeln" data-view="einzeln">Einzeln</button></div>
    <button class="pbtn" id="theme" aria-label="Hell, Dunkel oder automatisch">Auto</button>
  </div>
  <main id="main"></main>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const ICON = {
  play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>', check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
  dumbbell: '<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  book: '<path d="M5 19.5V5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2 2 2 0 0 0 2 2h12"/>',
  chart: '<path d="M4 4v16h16"/><path d="m7.5 15 3.5-4.5 3 2.5 5-6.5"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  chevR: '<path d="m9.5 6 6 6-6 6"/>', chevL: '<path d="m14.5 6-6 6 6 6"/>', chevD: '<path d="m6 9.5 6 6 6-6"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01" style="stroke-width:2.8"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  moon: '<path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/>',
  auto: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const lum = h => { const c = hex(h).map(x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };

/* ---------- Die 10 Designs: nur Schrift, Farbe, Ecken, Flächen und Kreisform unterscheiden sich ----------
   r = Ecken der Flächen, rb = Ecken der Knöpfe, ring = Strichstärke des Score-Kreises, kind: ring / disc / solid */
const DES = [
  { id: 'salbei', name: 'Salbei', idea: 'Ruhiges Grün, weiche Ecken.', font: "'Figtree', sans-serif", r: 16, rb: 14, ring: 6, kind: 'ring', tw: 700, nw: 600, track: '-.02em',
    acc: ['#3F7A62', '#3B6EA8', '#8A6A3B'],
    pal: { light: { bg: '#F4F6F3', card: '#FFFFFF', text: '#1B2420', text2: '#5E6B64', accent: '#3F7A62', tb: '#FFFFFF' },
           dark: { bg: '#0F1311', card: '#18201C', text: '#E8EEEA', text2: '#93A39A', accent: '#7CC3A4', tb: '#121815' } } },
  { id: 'marine', name: 'Marine', idea: 'Dunkles Blau, sachlich und klar.', font: "'Manrope', sans-serif", r: 10, rb: 10, ring: 4, kind: 'ring', tw: 700, nw: 700, track: '-.02em',
    acc: ['#1F3B66', '#2D5BA8', '#245E57'],
    pal: { light: { bg: '#FFFFFF', card: '#F2F4F8', text: '#0F1B2D', text2: '#5A6576', accent: '#1F3B66', tb: '#FFFFFF' },
           dark: { bg: '#0A0F18', card: '#131B28', text: '#E7ECF4', text2: '#8F9AAD', accent: '#8FB0E6', tb: '#0D131E' } } },
  { id: 'koralle', name: 'Koralle', idea: 'Warmes Korallenrot, freundlich, runde Knöpfe.', font: "'DM Sans', sans-serif", r: 18, rb: 999, ring: 0, kind: 'disc', tw: 700, nw: 600, track: '-.025em',
    acc: ['#D9503A', '#C2457A', '#D98A1E'],
    pal: { light: { bg: '#FFFFFF', card: '#FBF3F1', text: '#241816', text2: '#6E5A56', accent: '#D9503A', tb: '#FFFFFF' },
           dark: { bg: '#120D0C', card: '#1F1715', text: '#F4ECEA', text2: '#A8938F', accent: '#F07A64', tb: '#160F0E' } } },
  { id: 'nacht', name: 'Nacht', idea: 'Dunkel und edel, Champagner als Akzent.', font: "'Sora', sans-serif", r: 12, rb: 12, ring: 3, kind: 'ring', tw: 600, nw: 500, track: '-.03em', darkFirst: true,
    acc: ['#CBB07A', '#B9C3CF', '#D59A86'],
    pal: { light: { bg: '#F7F6F3', card: '#FFFFFF', text: '#17171A', text2: '#6B6862', accent: '#8E6F35', tb: '#FFFFFF' },
           dark: { bg: '#0D0E10', card: '#17181B', text: '#F2F0EC', text2: '#8F8C86', accent: '#CBB07A', tb: '#0D0E10' } } },
  { id: 'petrol', name: 'Petrol', idea: 'Kühles Petrol, kräftiger Kreis.', font: "'Plus Jakarta Sans', sans-serif", r: 14, rb: 14, ring: 8, kind: 'ring', tw: 700, nw: 700, track: '-.02em',
    acc: ['#0E6E78', '#2F6FB0', '#5C5BB5'],
    pal: { light: { bg: '#F3F7F7', card: '#FFFFFF', text: '#0F2224', text2: '#577073', accent: '#0E6E78', tb: '#FFFFFF' },
           dark: { bg: '#0A1416', card: '#132124', text: '#E4EFF0', text2: '#8BA5A8', accent: '#4FB8C2', tb: '#0D1A1C' } } },
  { id: 'oliv', name: 'Oliv', idea: 'Gedecktes Oliv, natürlich und ruhig.', font: "'Outfit', sans-serif", r: 12, rb: 12, ring: 0, kind: 'disc', tw: 600, nw: 500, track: '-.02em',
    acc: ['#5E6F2E', '#7A5A2E', '#2E6F5E'],
    pal: { light: { bg: '#F5F5F0', card: '#FFFFFF', text: '#22231C', text2: '#6B6C5E', accent: '#5E6F2E', tb: '#FFFFFF' },
           dark: { bg: '#12130F', card: '#1C1D17', text: '#EEEEE6', text2: '#9A9B8C', accent: '#A9BD6B', tb: '#15160F' } } },
  { id: 'kirsche', name: 'Kirsche', idea: 'Kräftiges Kirschrot, eckig und sportlich.', font: "'Inter Tight', sans-serif", r: 6, rb: 6, ring: 5, kind: 'ring', tw: 700, nw: 700, track: '-.03em',
    acc: ['#B3243B', '#1F4FA8', '#1D1D1F'],
    pal: { light: { bg: '#FFFFFF', card: '#F4F4F5', text: '#151517', text2: '#626268', accent: '#B3243B', tb: '#FFFFFF' },
           dark: { bg: '#0E0E10', card: '#1A1A1D', text: '#F1F1F3', text2: '#96969C', accent: '#E8576E', tb: '#111113' } } },
  { id: 'arktis', name: 'Arktis', idea: 'Helles Eisblau, sanfte Schatten, sehr rund.', font: "'Nunito Sans', sans-serif", r: 22, rb: 999, ring: 6, kind: 'ring', tw: 700, nw: 700, track: '-.015em', shadow: true,
    acc: ['#3A86C8', '#3AA39A', '#7A6FD0'],
    pal: { light: { bg: '#EEF3F7', card: '#FFFFFF', text: '#142233', text2: '#5C6B7C', accent: '#3A86C8', tb: '#FFFFFF' },
           dark: { bg: '#0C141C', card: '#152230', text: '#E6EEF5', text2: '#8EA0B2', accent: '#78B4E6', tb: '#101A24' } } },
  { id: 'schiefer', name: 'Schiefer', idea: 'Zurückhaltendes Schiefergrau, fast ohne Farbe.', font: "'IBM Plex Sans', sans-serif", r: 4, rb: 4, ring: 4, kind: 'ring', tw: 600, nw: 500, track: '-.01em',
    acc: ['#46566B', '#5A4F6B', '#3F5F55'],
    pal: { light: { bg: '#FFFFFF', card: '#F2F3F5', text: '#1C2128', text2: '#5F6670', accent: '#46566B', tb: '#FFFFFF' },
           dark: { bg: '#101317', card: '#1A1E24', text: '#E9ECF0', text2: '#959CA6', accent: '#A9B7CA', tb: '#13161B' } } },
  { id: 'orange', name: 'Orange', idea: 'Sportliches Orange, klare Zahlen.', font: "'Barlow', sans-serif", r: 10, rb: 10, ring: 0, kind: 'solid', tw: 700, nw: 600, track: '-.01em',
    acc: ['#E8601A', '#D9363E', '#1F7A6B'],
    pal: { light: { bg: '#FFFFFF', card: '#F6F4F2', text: '#1A1714', text2: '#6A635D', accent: '#E8601A', tb: '#FFFFFF' },
           dark: { bg: '#110F0D', card: '#1D1A17', text: '#F3EFEB', text2: '#A0978F', accent: '#FF8A3D', tb: '#14120F' } } }
];

/* ---------- Zustand ---------- */
const S = { view: 'alle', cur: 'salbei', theme: 'auto', acc: {} };
const mode = () => S.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme;

/* ---------- Telefon ---------- */
function frameVars(d) {
  const m = mode(), p = d.pal[m], chosen = S.acc[d.id], acc = chosen ? (m === 'dark' ? mixW(chosen, .25) : chosen) : p.accent;
  const v = {
    bg: p.bg, card: p.card, text: p.text, text2: p.text2, accent: acc, onacc: lum(acc) > .4 ? '#111111' : '#FFFFFF', tb: p.tb,
    sep: m === 'dark' ? 'rgba(255,255,255,.08)' : 'rgba(15,23,38,.08)', soft: `color-mix(in srgb, ${acc} 12%, ${p.card})`,
    shadow: d.shadow && m === 'light' ? '0 4px 16px rgba(20,34,51,.07)' : 'none',
    font: d.font, r: d.r + 'px', rb: d.rb + 'px', tw: d.tw, nw: d.nw, track: d.track
  };
  return Object.entries(v).map(([k, x]) => `--f-${k}:${x}`).join(';');
}
const mixW = (h, t) => { const c = hex(h).map(x => Math.round(x + (255 - x) * t)); return '#' + c.map(x => x.toString(16).padStart(2, '0')).join(''); };
/* Score: Ring (Spur + Bogen), Scheibe (zarte Fläche + dünner Bogen) oder volle Fläche – immer nur Kreis und Zahl */
function score(d, size) {
  const r = 45, c = 2 * Math.PI * r, v = 78, arc = w => `<circle cx="50" cy="50" r="${r}" style="fill:none;stroke:var(--f-accent);stroke-width:${w};stroke-linecap:round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>`;
  const txt = col => `<text x="50" y="51" text-anchor="middle" dominant-baseline="central" style="font-family:var(--f-font);font-size:32px;font-weight:var(--f-nw);letter-spacing:-1px;fill:${col};font-variant-numeric:tabular-nums">${v}</text>`;
  const body = d.kind === 'disc' ? `<circle cx="50" cy="50" r="45" style="fill:var(--f-soft)"/>${arc(3)}${txt('var(--f-text)')}`
    : d.kind === 'solid' ? `<circle cx="50" cy="50" r="45" style="fill:var(--f-accent)"/>${txt('var(--f-onacc)')}`
    : `<circle cx="50" cy="50" r="${r}" style="fill:none;stroke:var(--f-card);stroke-width:${d.ring}"/>${arc(d.ring)}${txt('var(--f-text)')}`;
  return `<div class="f-score"><svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Trainio-Score 78">${body}</svg><span class="f-small">Trainio-Score</span></div>`;
}
const U = (n, u) => `${n}${u ? `<span class="f-u">${u}</span>` : ''}`;
const tile = ([l, v]) => `<div class="f-tile"><span class="f-small">${l}</span><span class="f-num">${v}</span></div>`;
const TB = on => `<nav class="f-tb">${[['home', 'Start'], ['dumbbell', 'Training'], ['book', 'Übungen'], ['chart', 'Fortschritt'], ['grid', 'Mehr']].map(([i, l], k) => `<span class="${k === on ? 'on' : ''}">${ic(i)}${l}</span>`).join('')}</nav>`;
const SCREENS = {
  start: ['Start', d => `<div class="f-scr">
    <p class="f-small">Donnerstag, 12. November</p>
    ${score(d, 168)}
    <div class="f-tiles">${[['Serie', U('11', 'Wochen')], ['Volumen', U('4.960', 'kg')], ['Körpergewicht', U('80,5', 'kg')], ['Neue Rekorde', '13']].map(tile).join('')}</div>
    <div class="f-btn">${ic('play')}<span>Workout starten</span></div>
    <div class="f-sec"><div class="f-row"><h3 class="f-head">Ziele</h3><span class="f-link">Hinzufügen</span></div>
      <div class="f-list f-goal"><div class="f-row"><span>Bankdrücken</span><span>92 %</span></div><div class="f-bar"><i style="--w:92%"></i></div></div></div>
    <div class="f-sec"><h3 class="f-head">Letzte Workouts</h3>
      <div class="f-list">${[['Push', 'Mo, 9. Nov'], ['Radfahren draußen', 'Sa, 7. Nov']].map(([n, t]) => `<div class="f-li"><span class="grow">${n}</span><span class="f-small">${t}</span><span class="f-chev">${ic('chevR')}</span></div>`).join('')}</div></div>
  </div>${TB(0)}`],
  workout: ['Laufendes Workout', d => `<div class="f-scr">
    <div class="f-row" style="align-items:flex-start"><div><h2 class="f-title">Pull</h2><p class="f-small">14:21</p></div><span class="f-btn2">Beenden</span></div>
    <div class="f-bar"><i style="--w:13%"></i></div>
    <div class="f-sec"><div class="f-row"><h3 class="f-head">Kreuzheben</h3><span class="f-chev">${ic('more')}</span></div>
      <div class="f-wtab"><div class="f-set hd"><span>Satz</span><span>kg</span><span>Wdh.</span><span></span></div>
        ${[1, 2].map(n => `<div class="f-set"><span class="n">${n}</span><span>137,5</span><span>5</span><span class="f-ck on">${ic('check')}</span></div>`).join('')}
        <div class="f-set cur"><span class="n">3</span><span>137,5</span><span>5</span><span class="f-ck"></span></div>
        <div class="f-edit"><div class="f-steps"><div class="f-step"><span>−</span><span>137,5<span class="f-u">kg</span></span><span>+</span></div><div class="f-step"><span>−</span><span>5<span class="f-u">Wdh.</span></span><span>+</span></div></div>
          <p class="f-small">Letztes Mal 137,5 × 4</p><div class="f-btn" style="min-height:48px">${ic('check')}<span>Satz erledigt</span></div></div>
      </div></div>
    <div class="f-sec"><h3 class="f-head">Klimmzüge</h3></div>
  </div>${TB(1)}`],
  progress: ['Fortschritt', d => `<div class="f-scr">
    <div class="f-row"><h2 class="f-title">Fortschritt</h2><span class="f-btn2">3 Monate ${ic('chevD')}</span></div>
    <div class="f-tabs"><span class="on">Übersicht</span><span>Kraft</span><span>Volumen</span><span>Muskeln</span></div>
    ${score(d, 136)}
    <div class="f-tiles">${[['Pro Woche', U('3,2', 'Workouts')], ['Workout-Score', '88'], ['Neue Rekorde', '13'], ['Trainingstage', '36']].map(tile).join('')}</div>
    <div class="f-list"><div class="f-li"><span class="grow">Mehr Statistiken</span><span class="f-chev">${ic('chevR')}</span></div></div>
  </div>${TB(3)}`]
};
const frameHtml = (d, scr) => `<div class="frame" style="${frameVars(d)}">${SCREENS[scr][1](d)}</div>`;

/* ---------- Ansichten ---------- */
const viewAlle = () => `<p class="lead">Zehn ruhige Designs mit demselben schlichten Aufbau. Antippen zeigt Start, Workout und Fortschritt.</p>
  <div class="grid">${DES.map(d => `<div class="card" role="button" tabindex="0" data-open="${d.id}" aria-label="${d.name} ansehen"><div class="mini" aria-hidden="true" inert>${frameHtml(d, 'start')}</div><div class="cap"><b>${d.name}</b><span>${d.idea}</span></div></div>`).join('')}</div>`;
function viewEinzeln() {
  const i = DES.findIndex(x => x.id === S.cur), d = DES[i], prev = DES[(i + DES.length - 1) % DES.length], next = DES[(i + 1) % DES.length];
  const cur = S.acc[d.id] || d.acc[0];
  return `<div class="chips">${DES.map(x => `<button class="chip ${x.id === d.id ? 'on' : ''}" data-open="${x.id}">${x.name}</button>`).join('')}</div>
  <div class="dhead"><div><h2>${d.name}</h2><p>${d.idea}</p></div>
    <div class="sw-row">${d.acc.map((c, k) => `<button class="sw ${c === cur ? 'on' : ''}" style="background:${c}" data-acc="${c}" aria-label="Akzentfarbe ${k + 1}"></button>`).join('')}</div></div>
  <div class="screens">${Object.entries(SCREENS).map(([k, [label]]) => `<div class="shot"><div class="phone" role="img" aria-label="${d.name}: ${label}">${frameHtml(d, k)}</div><p>${label}</p></div>`).join('')}</div>
  <div class="pager"><button class="pbtn" data-open="${prev.id}">${ic('chevL')}${prev.name}</button><button class="pbtn" data-open="${next.id}">${next.name}${ic('chevR')}</button></div>`;
}
function fit() { document.querySelectorAll('.mini, .phone').forEach(m => m.style.setProperty('--k', m.clientWidth / 390)); }
function render() {
  $('#main').innerHTML = S.view === 'alle' ? viewAlle() : viewEinzeln();
  $('#v-alle').classList.toggle('on', S.view === 'alle');
  $('#v-einzeln').classList.toggle('on', S.view === 'einzeln');
  $('#theme').innerHTML = `${ic(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto')}<span class="tl">${{ auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[S.theme]}</span>`;
  fit();
}
function setHash() { const h = S.view === 'alle' ? '#alle' : `#d-${S.cur}`; try { history.replaceState(null, '', h); } catch (e) { /* Rahmen erlaubt es nicht */ } }
function readHash() { const m = /^#d-([a-z]+)$/.exec(location.hash); if (m && DES.some(d => d.id === m[1])) { S.view = 'einzeln'; S.cur = m[1]; } else if (location.hash === '#alle') S.view = 'alle'; }
function applyTheme() {
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  try { localStorage.setItem('trainio-10-theme', S.theme); } catch (e) { /* ohne Speicher */ }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open], [data-view], [data-acc], #theme');
  if (!t) return;
  if (t.id === 'theme') { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); render(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; setHash(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.open) { S.view = 'einzeln'; S.cur = t.dataset.open; setHash(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.acc) { S.acc[S.cur] = t.dataset.acc; render(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-open]')) { e.preventDefault(); e.target.click(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') render(); });
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => { readHash(); render(); });
try { S.theme = localStorage.getItem('trainio-10-theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
readHash();
applyTheme();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
