/* WEGWERF-PROTOTYP zu Ticket 04: Davids eigenes Design, Arbeitstitel „Klarblau“ – Fassung 2.

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 8px; --tap: 44px; --bar-h: 58px; --top: 64px;
}

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0E12; --card: #171A20; --card-press: #1E222A; --sheet-bg: #15181E; --sep: rgba(255, 255, 255, .08);
  --text: #EEF1F5; --text-2: #9AA2AF;
  --blue: #6E92F2; --on-blue: #0C0E12; --blue-soft: #1B2438;
  --warn: #F0B03A; --good: #3CC97D;

function nextOpen(w, from) {
  const all = [];
  w.ex.forEach((e, ei) => e.sets.forEach((s, si) => all.push([ei, si, s])));
  const start = from ? all.findIndex(([ei, si]) => ei === from.e && si === from.s) : 0;
  const hit = all.slice(Math.max(0, start)).find(x => !x[2].done) || all.find(x => !x[2].done);
  return hit ? { e: hit[0], s: hit[1] } : null;
}
const allFlat = () => W.ex.flatMap(e => e.sets);
const doneSets = () => allFlat().filter(s => s.done).length;
const allSets = () => allFlat().length;
const volume = () => allFlat().filter(s => s.done).reduce((b, s) => b + s.kg * s.r, 0);
const curSet = () => W.cur ? W.ex[W.cur.e].sets[W.cur.s] : null;
const elapsed = () => (Date.now() - W.t0) / 1000;
const prevTxt = s => `${w1(s.pkg)} × ${s.pr}`;

const S = { screen: 'start', theme: 'auto', layer: null, toast: null, layerI: null, period: '3M', unit: 'kg', area: 'Übersicht' };
let W = newWorkout(2);
let toastTimer = null;

/* ---------- Grafik: nur Kreis und ein schlichtes Diagramm ---------- */
const scoreCircle = (v, size) => { const r = 45, c = 2 * Math.PI * r; return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Trainio-Score ${v} von 100">
  <circle cx="50" cy="50" r="${r}" style="fill:none;stroke:var(--card);stroke-width:5"/>
  <circle cx="50" cy="50" r="${r}" style="fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
  <text x="50" y="51" text-anchor="middle" dominant-baseline="central" style="font:600 32px var(--font);letter-spacing:-1px;fill:var(--text);font-variant-numeric:tabular-nums">${v}</text></svg>`; };
function bars(vals, fmt = v => nf(v)) {
  const w = 350, h = 140, top = 6, bot = 4, axW = 30, cw = w - axW, ch = h - top - bot, n = vals.length, mx = Math.max(...vals);
  const step = mx > 10 ? 10 : 2, ymax = Math.ceil(mx / step) * step, y = v => top + ch * (1 - v / ymax), slot = cw / n, bw = Math.min(18, slot * .55);
  let s = '';
  for (let v = 0; v <= ymax; v += step) s += `<line class="gl" x1="0" x2="${cw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${w}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  vals.forEach((v, i) => { const hh = ch * v / ymax; s += `<rect class="${i === n - 1 ? 'b-cur' : 'b'}" x="${(i * slot + (slot - bw) / 2).toFixed(1)}" y="${(top + ch - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3"/>`; });
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Verlauf der letzten Wochen">${s}</svg>`;
}
function line(vals, lo, hi, step) {
  const w = 350, h = 130, top = 6, bot = 4, axW = 30, cw = w - axW - 6, ch = h - top - bot, n = vals.length;
  const x = i => 3 + i * cw / (n - 1), y = v => top + ch * (1 - (v - lo) / (hi - lo));
  let s = '';
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line class="gl" x1="0" x2="${cw + 6}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${w}" y="${y(v) + 4}" text-anchor="end">${nf(v)}</text>`;
  s += `<polyline class="ln" points="${vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Verlauf">${s}</svg>`;
}
const info = k => `<button class="ic-btn" data-act="info" data-k="${k}" aria-label="Erklärung">${ic('info')}</button>`;
const restLeft = () => W.rest ? Math.max(0, Math.ceil((W.rest.end - Date.now()) / 1000)) : 0;
const periodLbl = () => PERIODS.find(p => p[0] === S.period)[1];

/* ---------- Kacheln: Titel und Zahl ---------- */
const TILE = {
  streak: ['Serie', U('11', 'Wochen')], volume: ['Volumen', U('4.960', 'kg')], weight: ['Körpergewicht', U('80,5', 'kg')], prs: ['Neue Rekorde', '13'],
  wpw: ['Pro Woche', U('3,2', 'Workouts')], wscore: ['Workout-Score', '88'], attack: ['Nächster Rekord', U('150', 'kg')], days: ['Trainingstage', '36']
};
const tile = k => `<button class="tile" data-act="det" data-k="${k}"><span class="small">${TILE[k][0]}</span><span class="big-num">${TILE[k][1]}</span></button>`;

/* ---------- Bildschirme ---------- */
const startBtn = () => W.running
  ? `<button class="btn btn-primary btn-lg btn-block" data-act="nav" data-to="training">${ic('play')} Weiter: ${W.name}</button>`

const SCR = {};
SCR.start = () => `<main class="screen">
  <p class="small">Donnerstag, 12. November</p>
  <button class="score-btn" data-act="det" data-k="score" aria-label="Trainio-Score ${D.score}, Details öffnen">${scoreCircle(D.score, 172)}<span class="small">Trainio-Score</span></button>
  <div class="tiles">${['streak', 'volume', 'weight', 'prs'].map(tile).join('')}</div>

  <section class="sec"><div class="sec-h"><h2 class="head">Ziele</h2><button class="btn btn-text btn-sm" data-act="toast" data-k="Ziel hinzufügen">Hinzufügen</button></div>
    <div class="list"><button class="row" data-act="det" data-k="goal" style="flex-direction:column;align-items:stretch;gap:12px"><span style="display:flex;justify-content:space-between"><span>Bankdrücken</span><span class="num">92 %</span></span><span class="bar"><i style="width:92%"></i></span></button></div></section>

    <div class="list">${D.recent.map(([n, d], i) => `<button class="row" data-act="det" data-k="workout" data-i="${i}"><span class="row-main">${n}</span><span class="small">${d}</span><span class="chev">${ic('chevR')}</span></button>`).join('')}</div></section>

SCR.fortschritt = () => `<main class="screen">

SCR.training = () => {
  if (!W.running) return `<main class="screen"><h1 class="title">Training</h1>${startBtn()}</main>`;
  const cs = W.cur;
  return `<main class="screen" style="--pad-bottom:${W.rest ? 170 : 104}px">
  <div class="w-top"><div><h1 class="title">${W.name}</h1><p class="small num" data-clock>${mmss(elapsed())}</p></div><button class="btn btn-secondary btn-sm" data-act="finish">Beenden</button></div>
  <div class="bar"><i style="width:${doneSets() / allSets() * 100}%"></i></div>
  ${W.ex.map((ex, ei) => `<section class="sec">
    <div class="sec-h"><h2 class="head">${ex.name}</h2><button class="ic-btn" data-act="det" data-k="exercise" data-i="${ei}" aria-label="Details zu ${ex.name}">${ic('more')}</button></div>
    <div class="wtab">

          ${W.rpeOpen ? `<div class="rpe">${[null, 6, 7, 8, 9, 10].map(v => `<button class="${s.rpe === v || (v === null && !s.rpe) ? 'on' : ''}" data-act="rpe" data-val="${v ?? ''}">${v ?? '–'}</button>`).join('')}</div>` : ''}

</main>`;
};
const placeholder = () => `<main class="screen"><h1 class="title">${S.screen === 'mehr' ? 'Mehr' : 'Übungen'}</h1><p class="small">Gehört nicht zum Prototyp.</p></main>`;

/* ---------- Details: große Zahl, höchstens eine Grafik, wenige Werte ---------- */
const kv = rows => `<div class="list">${rows.map(([l, v, cls]) => `<div class="row"><span class="row-main">${l}</span><span class="row-val ${cls || ''}">${v}</span></div>`).join('')}</div>`;
const big = (v, u) => `<div class="hero-num">${U(v, u)}</div>`;
const DET = {
  score: ['Trainio-Score', () => `<div style="display:flex;justify-content:center">${scoreCircle(D.score, 150)}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span class="pill">${D.main}</span><span class="pill warn">${D.hint}</span></div>

  weight: ['Körpergewicht', () => `${big('80,5', 'kg')}${line(D.weight, 76, 82, 2)}${kv([['In 4 Wochen', '+1,2 kg'], ['Phase', 'Bulk Herbst']])}`],

  workout: ['Workout', () => { const r = D.recent[S.layerI ?? 0]; return `<p class="head">${r[0]}</p>${kv([['Datum', r[1]], ['Dauer', r[2]], ['Sätze', r[3]], [r[5] ? 'Volumen' : 'Strecke', r[4]]].concat(r[5] ? [['Workout-Score', String(r[5])]] : []))}`; }],
  wpw: ['Workouts pro Woche', () => `${big('3,2')}${bars(D.perWeek)}${kv([['Workouts im Zeitraum', '36'], ['Diese Woche', '1']])}`],
  wscore: ['Workout-Score', () => `${big('88')}${kv([['Bestes Workout', '93'], ['Letztes Workout', '88']])}`],

};

/* ---------- Ebenen ---------- */
function layerHtml() {
  const L = S.layer;
  if (!L) return '';
  if (L.type === 'pop') return `<div class="pop-scrim" data-act="close"></div><div class="pop" role="tooltip" style="left:${L.x}px;top:${L.y}px">${INFO[L.k]}</div>`;
  if (L.type === 'dialog') return `<div class="scrim" data-act="close"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 class="head" id="dlg-t">Workout beenden?</h2><p class="small">Noch ${allSets() - doneSets()} Sätze offen.</p>
    <div class="btns"><button class="btn btn-primary btn-block" data-act="finishOk">Beenden</button><button class="btn btn-secondary btn-block" data-act="close">Weiter trainieren</button></div></div>`;
  const sheet = (inner, label) => `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div>${inner}</div>`;
  const head = (t, k) => `<div class="det-h"><h2 class="head">${t}</h2>${k && INFO[k] ? info(k) : ''}<button class="ic-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>`;
  if (L.type === 'det') { const [t, f] = DET[L.k]; return sheet(`${head(t, L.k)}${f()}`, t); }
  if (L.k === 'start') return sheet(`${head('Workout starten')}
    <button class="btn btn-primary btn-lg btn-block" data-act="startW">${ic('play')} Pull</button>
    <div class="list">${['Push', 'Beine', 'Leeres Workout', 'Cardio'].map(n => `<button class="row" data-act="startW"><span class="row-main">${n}</span><span class="chev">${ic('chevR')}</span></button>`).join('')}</div>`, 'Workout starten');
  if (L.k === 'period') return sheet(`${head('Zeitraum')}
    <div class="list">${PERIODS.map(([k, l]) => `<button class="row" data-act="setPeriod" data-val="${k}"><span class="row-main">${l}</span>${S.period === k ? `<span style="color:var(--blue)">${ic('check')}</span>` : ''}</button>`).join('')}</div>
    <div class="sec-h"><span>Einheit</span><div class="seg" style="width:120px">${['kg', 'lb'].map(u => `<button class="${S.unit === u ? 'on' : ''}" data-act="unit" data-val="${u}">${u}</button>`).join('')}</div></div>`, 'Zeitraum');
  if (L.k === 'summary') { const sm = L.sum; return sheet(`<div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><p class="small">Gespeichert</p><h2 class="title">${W.name}</h2><div class="hero-num" style="color:var(--blue)">${sm.score}</div><p class="small">Workout-Score</p></div>
    ${kv([['Dauer', `${Math.max(1, Math.round(sm.secs / 60))} min`], ['Sätze', String(sm.sets)], ['Volumen', `${nf(sm.vol)} kg`]].concat(sm.prs.map(p => ['Neuer Rekord', p])))}
    <button class="btn btn-primary btn-block" data-act="summaryDone">Schließen</button>`, 'Workout gespeichert'); }
  return '';
}
function renderLayer() { $('#layer').innerHTML = layerHtml() + (S.toast ? `<div class="toast" role="status">${S.toast.i ? ic(S.toast.i) : ''}${S.toast.t}</div>` : ''); }
function toast(t, i) { S.toast = { t, i }; renderLayer(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderLayer(); }, 2600); }

/* ---------- Darstellung ---------- */
const TABS = [['start', 'home', 'Start'], ['training', 'dumbbell', 'Training'], ['uebungen', 'book', 'Übungen'], ['fortschritt', 'chart', 'Fortschritt'], ['mehr', 'grid', 'Mehr']];
const tabbar = () => `<nav class="tabbar" aria-label="Tabs">${TABS.map(([k, i, l]) => `<button class="tab ${S.screen === k ? 'on' : ''}" data-act="nav" data-to="${k}" ${S.screen === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span>${k === 'training' && W.running && S.screen !== 'training' ? '<i class="tdot"></i>' : ''}</button>`).join('')}</nav>`;
function render() { $('#app').innerHTML = (SCR[S.screen] || placeholder)() + tabbar(); renderLayer(); }
function go(screen) { S.screen = screen; S.layer = null; try { history.replaceState(null, '', `#${screen}`); } catch (e) { /* Rahmen erlaubt es nicht */ } render(); window.scrollTo(0, 0); }
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  $('#pt').innerHTML = `${ic(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto')}${{ auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[S.theme]}`;
  try { localStorage.setItem('trainio-klarblau-theme', S.theme); } catch (e) { /* ohne Speicher */ }
}

/* ---------- Aktionen ---------- */
function adjustSet(field, d) {
  const s = curSet(); if (!s) return;
  const ex = W.ex[W.cur.e];
  if (field === 'kg') { const old = s.kg; s.kg = Math.max(0, Math.round((s.kg + d * ex.step) * 100) / 100); ex.sets.forEach((x, i) => { if (i > W.cur.s && !x.done && x.kg === old) x.kg = s.kg; }); }
  else s.r = Math.max(0, s.r + d);
  render();
}
function complete(e, s) {
  const ex = W.ex[e], st = ex.sets[s];
  if (st.done) return;
  st.done = true; W.rpeOpen = false;
  const v = e1(st.kg, st.r);
  if (v > ex.best + .05) { ex.best = v; W.prs.push(`${ex.name} ${w1(st.kg)} kg × ${st.r}`); toast(`Neuer Rekord · ${ex.name}`, 'trophy'); }
  W.rest = { end: Date.now() + ex.rest * 1000, total: ex.rest };
  W.cur = nextOpen(W, { e, s });
  render();
}
const ACT = {
  nav: d => go(d.to),
  close: () => { S.layer = null; renderLayer(); },
  det: d => { S.layerI = d.i != null ? +d.i : null; S.layer = { type: 'det', k: d.k }; renderLayer(); },
  info: (d, el) => {
    const r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth, x = Math.min(Math.max(12, r.right - 264), vw - 276);
    S.layer = { type: 'pop', k: d.k, x, y: r.bottom + 120 < window.innerHeight ? r.bottom + 6 : Math.max(60, r.top - 100), back: S.layer && S.layer.type !== 'pop' ? S.layer : null };
    renderLayer();
  },
  sheet: d => { S.layer = { type: 'sheet', k: d.k }; renderLayer(); },
  toast: (d, el) => toast(d.k, el.dataset.i),
  startW: () => { W = newWorkout(0); go('training'); },
  sel: d => { const e = +d.e, s = +d.s; W.ex[e].sets[s].done = false; W.cur = { e, s }; render(); },
  tick: d => { const e = +d.e, s = +d.s, st = W.ex[e].sets[s]; W.cur = { e, s }; if (st.done) { st.done = false; render(); } else complete(e, s); },
  kg: d => adjustSet('kg', +d.d),
  reps: d => adjustSet('reps', +d.d),
  rpeToggle: () => { W.rpeOpen = !W.rpeOpen; render(); },
  rpe: d => { const s = curSet(); if (s) { s.rpe = d.val ? +d.val : null; W.rpeOpen = false; render(); } },
  done: () => { if (W.cur) complete(W.cur.e, W.cur.s); },
  restAdj: d => { if (W.rest) { W.rest.end = Math.max(Date.now() + 1000, W.rest.end + d.d * 1000); tick(); } },
  restSkip: () => { W.rest = null; render(); },
  finish: () => { S.layer = { type: 'dialog' }; renderLayer(); },
  finishOk: () => { const sets = doneSets(); W.rest = null; S.layer = { type: 'sheet', k: 'summary', sum: { score: Math.min(100, Math.round(62 + 22 * sets / allSets() + 4 * W.prs.length)), prs: W.prs.slice(), secs: elapsed(), sets, vol: volume() } }; render(); },
  summaryDone: () => { W.running = false; go('start'); toast('Workout gespeichert', 'check'); },
  setPeriod: d => { S.period = d.val; S.layer = null; render(); },
  unit: d => { S.unit = d.val; render(); },
  area: d => { S.area = d.val; render(); if (d.val !== 'Übersicht') toast(`${d.val}: gehört nicht zum Prototyp`); }
};
document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p) { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  e.stopPropagation();
  if (a.dataset.act === 'close' && S.layer && S.layer.type === 'pop' && S.layer.back) { S.layer = S.layer.back; renderLayer(); return; }
  (ACT[a.dataset.act] || (() => {}))(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.layer) { S.layer = S.layer.back || null; renderLayer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
function readHash() { const m = /^#(start|training|fortschritt|uebungen|mehr)$/.exec(location.hash); if (m) S.screen = m[1]; }
window.addEventListener('hashchange', () => { readHash(); S.layer = null; render(); });
function tick() {
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = mmss(elapsed()); });
  if (!W.rest) return;
  const left = restLeft();
  if (left <= 0) { W.rest = null; render(); return; }
  document.querySelectorAll('[data-rest]').forEach(el => { el.textContent = mmss(left); });
}
setInterval(tick, 1000);
try { S.theme = localStorage.getItem('trainio-klarblau-theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
readHash();
applyTheme();
render();
</script>
