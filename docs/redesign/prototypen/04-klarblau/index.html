<title>Trainio Klarblau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* WEGWERF-PROTOTYP zu Ticket 04: Davids eigenes Design, Arbeitstitel „Klarblau“.
   Vorgaben (David, 12.11.2026): clean und hell, schlichtes Blau, präzise und eckig, feine Linien und Details.
   Layout: weiße Fläche, Struktur nur über 1-px-Linien, Ecken 4 px, Zahlen tragen die Ansicht; feine Skalen an Score,
   Kacheln und Fortschritt; kleine Beschriftungen in Monospace. Übersichten nur Titel + Zahl, Details nach Antippen. */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F5F7FA; --fill: #EEF1F5; --sheet-bg: #FFFFFF;
  --line: #E2E6EC; --line-2: #C6CDD7;
  --text: #0E1624; --text-2: #4E5868; --text-3: #6B7484;
  --blue: #2457D6; --on-blue: #FFFFFF; --blue-soft: #EEF3FD; --blue-line: #9DB5EE;
  --good: #1D7F47; --warn: #9C6200; --bad: #C23A3A;
  --chart-muted: #CBD2DC; --grid: #EDF0F4;
  --proto-bg: #0E1624; --proto-fg: #FFFFFF; --scrim: rgba(14, 22, 36, .28); --shadow: 0 10px 30px rgba(14, 22, 36, .12);
  --font: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --fs-title: 28px; --lh-title: 34px; --fs-head: 20px; --lh-head: 26px; --fs-body: 17px; --lh-body: 22px;
  --fs-sub: 15px; --lh-sub: 20px; --fs-cap: 13px; --lh-cap: 18px;
  --r: 4px; --r-sheet: 8px; --tap: 44px; --bar-h: 58px; --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D13; --surface: #0E121A; --surface-2: #131824; --fill: #1A2030; --sheet-bg: #10141D;
    --line: #1F2533; --line-2: #333C50;
    --text: #E7EBF3; --text-2: #A3ABBA; --text-3: #848DA0;
    --blue: #6F94FF; --on-blue: #0A0D13; --blue-soft: #141D33; --blue-line: #3A5296;
    --good: #3CC97D; --warn: #F0B03A; --bad: #FF6B6B;
    --chart-muted: #2E3546; --grid: #161B26;
    --proto-bg: #E7EBF3; --proto-fg: #0E1624; --scrim: rgba(0, 0, 0, .55); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D13; --surface: #0E121A; --surface-2: #131824; --fill: #1A2030; --sheet-bg: #10141D;
  --line: #1F2533; --line-2: #333C50;
  --text: #E7EBF3; --text-2: #A3ABBA; --text-3: #848DA0;
  --blue: #6F94FF; --on-blue: #0A0D13; --blue-soft: #141D33; --blue-line: #3A5296;
  --good: #3CC97D; --warn: #F0B03A; --bad: #FF6B6B;
  --chart-muted: #2E3546; --grid: #161B26;
  --proto-bg: #E7EBF3; --proto-fg: #0E1624; --scrim: rgba(0, 0, 0, .55); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); overflow-x: clip; }
@media (min-width: 600px) { body { background: var(--surface-2); } .app { box-shadow: 0 0 0 1px var(--line); } }
.screen { display: flex; flex-direction: column; gap: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--top) var(--pad-bottom, 100px); }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }

/* Schrift: Geist für alles, Geist Mono für Beschriftungen, Einheiten und Skalen */
.t-title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; letter-spacing: -.025em; }
.t-head { font-size: var(--fs-head); line-height: var(--lh-head); font-weight: 600; letter-spacing: -.015em; }
.t-body { font-size: var(--fs-body); line-height: var(--lh-body); }
.t-sub { font-size: var(--fs-sub); line-height: var(--lh-sub); }
.lbl { font: 500 11px/14px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.n-num { font-size: 30px; line-height: 1.05; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-num { font-size: 56px; line-height: 1; font-weight: 300; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.u { font: 400 12px/1 var(--mono); color: var(--text-3); margin-left: 4px; letter-spacing: 0; }
.c2 { color: var(--text-2); } .c3 { color: var(--text-3); } .fw5 { font-weight: 500; } .fw6 { font-weight: 600; }
.good { color: var(--good); } .warn { color: var(--warn); }
.trend { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--mono); }
.trend .ic { width: 12px; height: 12px; vertical-align: 0; stroke-width: 2; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: var(--r); font-size: var(--fs-body); font-weight: 500; line-height: 1.2; position: relative; transition: background-color .15s, opacity .15s; }
.btn:active { opacity: .75; }
.btn-primary { background: var(--blue); color: var(--on-blue); }
.btn-secondary { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-text { color: var(--blue); padding: 0 8px; }
.btn-block { width: 100%; }
.btn-lg { min-height: 54px; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: var(--fs-sub); }
.btn-sm::after { content: ""; position: absolute; inset: -5px 0; }
.ic-btn { width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border-radius: var(--r); color: var(--text-2); font-size: 18px; flex: none; }
.ic-btn:active { background: var(--fill); }
.info { color: var(--text-3); font-size: 16px; }

/* Abschnitt: Überschrift + Haarlinie bis zum Rand */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.sec-h .rule { flex: 1; height: 1px; background: var(--line); }
.list { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 2px; position: relative; }
.row + .row { border-top: 1px solid var(--line); }
button.row:active { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; }
.row-val { text-align: right; white-space: nowrap; }
.chev { color: var(--text-3); font-size: 14px; }

/* Kachel: Linie statt Fläche, Ecke als Hinweis „antippbar“, feine Grafik unten */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 12px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; text-align: left; min-width: 0; width: 100%; transition: border-color .15s; }
.tile::after { content: ""; position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-top: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }
.tile:active { border-color: var(--blue-line); }
.tile-g { height: 16px; display: flex; align-items: flex-end; }
.tile .n-num { margin-top: auto; }

/* Feine Grafiken (ohne Achsen) */
.ticks { display: flex; gap: 5px; align-items: flex-end; height: 14px; }
.ticks i { width: 2px; height: 14px; background: var(--line-2); }
.ticks i.on { background: var(--blue); }
.ticks i.today { height: 8px; background: var(--text); }
.ticks.s { gap: 4px; } .ticks.s i { width: 2px; }
.hbars { display: flex; gap: 4px; align-items: flex-end; height: 16px; width: 100%; }
.hbars i { width: 2px; background: var(--line-2); min-height: 2px; }
.hbars i.on { background: var(--blue); }
.ruler { position: relative; width: 100%; height: 12px; }
.ruler::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: var(--line-2); }
.ruler::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--line-2) 1px, transparent 1px) 0 0 / 25% 100%; border-right: 1px solid var(--line-2); }
.ruler b { position: absolute; top: 1px; width: 2px; height: 10px; margin-left: -1px; background: var(--blue); z-index: 1; }
.ruler .fill { position: absolute; left: 0; top: 4px; height: 3px; background: var(--blue); z-index: 1; }

/* Score-Kreis: Skala mit 60 Strichen, dünner blauer Bogen, Marke bei 85 (erwartet) */
.score-btn { display: flex; flex-direction: column; align-items: center; gap: 10px; align-self: center; padding: 4px 16px; border-radius: var(--r); }
.score-btn:active { opacity: .8; }
.score-c { display: block; overflow: visible; }

/* Eingaben */
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); padding: 2px; gap: 2px; background: var(--surface-2); }
.seg button { flex: 1; min-height: 30px; padding: 0 8px; border-radius: 2px; font: 500 12px/1 var(--mono); letter-spacing: .04em; color: var(--text-2); position: relative; text-align: center; }
.seg button::after { content: ""; position: absolute; inset: -6px 0; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.stepper { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); align-items: center; border: 1px solid var(--line-2); border-radius: var(--r); min-height: 50px; background: var(--surface); }
.stepper > button { height: 48px; display: grid; place-items: center; font-size: 18px; color: var(--text); }
.stepper > button:active { background: var(--fill); }
.stepper .val { text-align: center; font-weight: 500; font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pt { position: relative; height: 8px; }
.pt::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: var(--line); }
.pt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--line-2) 1px, transparent 1px) 0 0 / 25% 100%; border-right: 1px solid var(--line-2); }
.pt > i { position: absolute; left: 0; top: 3px; height: 2px; background: var(--blue); z-index: 1; }
.segbar { display: flex; gap: 3px; height: 3px; }
.segbar i { flex: 1; background: var(--line); }
.segbar i.on { background: var(--blue); }
.utabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; border-bottom: 1px solid var(--line); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { min-height: 44px; font-size: var(--fs-sub); font-weight: 500; color: var(--text-3); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.utabs button.on { color: var(--text); border-color: var(--blue); }
.rpe { display: flex; gap: 6px; }
.rpe button { flex: 1; min-height: 36px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line-2); font: 500 13px/1 var(--mono); color: var(--text-2); position: relative; text-align: center; }
.rpe button::after { content: ""; position: absolute; inset: -4px 0; }
.rpe button.on { background: var(--blue); color: var(--on-blue); box-shadow: none; }

/* Tab-Leiste: Haarlinie oben, aktiver Tab mit blauer Linie */
.tabbar { position: fixed; z-index: 20; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 430px; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 0 max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; font: 500 10px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); position: relative; }
.tab .ic { font-size: 18px; vertical-align: 0; }
.tab.on { color: var(--blue); }
.tab.on::before { content: ""; position: absolute; top: -1px; left: 50%; width: 28px; margin-left: -14px; height: 2px; background: var(--blue); }
.tdot { position: absolute; top: 9px; left: calc(50% + 10px); width: 5px; height: 5px; background: var(--blue); }
.dock { position: fixed; z-index: 19; left: 0; right: 0; margin: 0 auto; max-width: 430px; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }

/* Prototyp-Leiste (nicht Teil des Designs) */
.proto-band { position: fixed; z-index: 55; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top, 0px) + 52px); background: var(--bg); pointer-events: none; }
.proto { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 16px); display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 12px; border-radius: 999px; background: var(--proto-bg); color: var(--proto-fg); font: 600 13px/1 var(--font); box-shadow: 0 6px 24px rgba(0, 0, 0, .22); white-space: nowrap; }
.proto .ptag { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-right: 6px; }
.proto button { min-height: 36px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.proto button:active { background: rgba(128, 128, 128, .3); }
.proto .ic { width: 16px; height: 16px; vertical-align: 0; }
.proto-note { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 10px 12px; font-size: 13px; line-height: 18px; color: var(--text-2); }

/* Fenster, Rückfrage, Meldung, Erklärung */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); animation: fade .2s; }
.sheet { position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 430px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; background: var(--sheet-bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; animation: up .26s cubic-bezier(.2, .8, .2, 1); }
.grab { width: 32px; height: 3px; background: var(--line-2); margin: 0 auto -6px; flex: none; }
.dialog { position: fixed; z-index: 71; left: 0; right: 0; top: 50%; margin: 0 auto; width: min(320px, calc(100% - 48px)); transform: translateY(-50%); background: var(--sheet-bg); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 8px; text-align: center; box-shadow: var(--shadow); animation: pop .18s; }
.dialog .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.toast { position: fixed; z-index: 90; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--r); background: var(--text); color: var(--bg); font-size: var(--fs-sub); line-height: var(--lh-sub); font-weight: 500; box-shadow: var(--shadow); animation: drop .22s; }
.toast .ic { color: var(--blue-line); }
.pop-scrim { position: fixed; inset: 0; z-index: 80; }
.pop { position: fixed; z-index: 81; width: 264px; padding: 12px 14px; border-radius: var(--r); background: var(--sheet-bg); border: 1px solid var(--line-2); color: var(--text); font-size: var(--fs-sub); line-height: var(--lh-sub); box-shadow: var(--shadow); animation: pop .15s; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(32px); opacity: 0; } }
@keyframes pop { from { opacity: 0; scale: .97; } }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Details: Titel mit Haarlinie, große Zahl, eine Grafik, wenige Werte */
.det { display: flex; flex-direction: column; gap: 18px; }
.det-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.det-h .t-head { flex: 1; min-width: 0; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--line-2); font-size: var(--fs-sub); font-weight: 500; }
.pill.warn { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); }
.areas { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 30px; align-items: center; gap: 12px 12px; }
.areas .num { text-align: right; font: 500 13px/1 var(--mono); }
.ar-bar { position: relative; display: block; height: 10px; }
.ar-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); }
.ar-bar .exp { position: absolute; left: 85%; top: 0; width: 1px; height: 10px; background: var(--line-2); }
.ar-bar > i { position: absolute; left: 0; top: 4px; height: 2px; background: var(--blue); }
.ar-bar > i.lo { background: var(--warn); }

/* Diagramme: Haarlinien-Raster, schmale eckige Balken, aktuell blau, laufende Woche als Umriss */
.ch { display: block; width: 100%; height: auto; overflow: visible; }
.ch .gl { stroke: var(--grid); stroke-width: 1; }
.ch .ax { fill: var(--text-3); font-size: 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ch .b { fill: var(--chart-muted); } .ch .b-cur { fill: var(--blue); } .ch .b-run { fill: none; stroke: var(--blue); stroke-width: 1; }
.ch .ln { fill: none; stroke: var(--blue); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.ch .ar { fill: var(--blue); opacity: .06; }
.ch .dot { fill: var(--chart-muted); }
.ch .end { fill: var(--blue); stroke: var(--surface); stroke-width: 2; }
.ch .ref { stroke: var(--blue-line); stroke-width: 1; stroke-dasharray: 3 3; }
.ch .refl { fill: var(--text-3); font-size: 10px; font-family: var(--mono); letter-spacing: .04em; }
.hm .h0 { fill: var(--fill); } .hm .h1 { fill: var(--blue); opacity: .3; } .hm .h2 { fill: var(--blue); opacity: .6; } .hm .h3 { fill: var(--blue); }

/* Laufendes Workout: Tabelle mit Haarlinien */
.w-top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 5; background: var(--bg); margin: 0 -16px; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
.w-top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.w-time { font: 400 13px/1 var(--mono); color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.wa-exh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wtab { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wa-grid { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.wa-hd { padding: 8px 2px 6px; }
.wa-row { position: relative; padding: 4px 2px; min-height: 52px; font-size: var(--fs-body); width: 100%; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
.wa-row .n { font: 500 12px/1 var(--mono); color: var(--text-3); }
.wa-row.open { color: var(--text-3); }
/* volle Breite ohne die Spalten zu verschieben */
.wa-row.cur { background: var(--blue-soft); box-shadow: 0 0 0 100vmax var(--blue-soft); clip-path: inset(0 -100vmax); color: var(--text); font-weight: 500; }
.wa-row.cur .n { color: var(--blue); }
.chk { width: 30px; height: 30px; border-radius: 2px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text-3); justify-self: end; position: relative; background: var(--surface); }
.chk::after { content: ""; position: absolute; inset: -7px; }

  const hit = all.slice(Math.max(0, start)).find(x => !x[2].done) || all.find(x => !x[2].done);
  return hit ? { e: hit[0], s: hit[1] } : null;
}

/* ---------- Diagramme ---------- */
function niceStep(range, n = 2) { const raw = range / n || 1, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart({ vals, labels = [], w = 358, h = 150, running = -1, fmt = v => nf(v), avg = null }) {
  const n = vals.length, axW = 30, top = 8, bot = labels.length ? 20 : 4, cw = w - axW, ch = h - top - bot;
  const mx = Math.max(...vals, avg || 0, 1), st = niceStep(mx), ymax = Math.ceil(mx / st) * st, y = v => top + ch * (1 - v / ymax);
  let s = '';
  for (let v = 0; v <= ymax + 1e-9; v += st) s += `<line class="gl" x1="0" x2="${cw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${w}" y="${y(v) + 3.5}" text-anchor="end">${fmt(v)}</text>`;
  const slot = cw / n, bw = 6, last = running === n - 1 ? n - 2 : n - 1;
  vals.forEach((v, i) => {
    const x = i * slot + (slot - bw) / 2, hh = v ? Math.max(2, ch * v / ymax) : 0;
    s += i === running ? `<rect class="b-run" x="${(x + .5).toFixed(1)}" y="${(top + ch - hh + .5).toFixed(1)}" width="${bw - 1}" height="${(hh - 1).toFixed(1)}"/>`
      : `<rect class="${i === last ? 'b-cur' : 'b'}" x="${x.toFixed(1)}" y="${(top + ch - hh).toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}"/>`;
    if (labels[i]) s += `<text class="ax" x="${(x + bw / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle">${labels[i]}</text>`;
  });
  if (avg != null) s += `<line class="ref" x1="0" x2="${cw}" y1="${y(avg)}" y2="${y(avg)}"/>`;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Balkendiagramm">${s}</svg>`;
}
function lineChart({ vals, w = 358, h = 140, yMin = 0, yMax = 100, step = 50, dots = null, ref = null, labels = null, fmt = v => nf(v) }) {
  const axW = 30, top = 8, bot = labels ? 20 : 4, cw = w - axW - 6, ch = h - top - bot, n = vals.length;
  const x = i => 3 + (n === 1 ? cw / 2 : i * cw / (n - 1)), y = v => top + ch * (1 - (v - yMin) / (yMax - yMin));
  let s = '';
  for (let v = yMin; v <= yMax + 1e-9; v += step) s += `<line class="gl" x1="0" x2="${cw + 6}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${w}" y="${y(v) + 3.5}" text-anchor="end">${fmt(v)}</text>`;
  if (ref) s += `<line class="ref" x1="0" x2="${cw + 6}" y1="${y(ref[0])}" y2="${y(ref[0])}"/><text class="refl" x="2" y="${y(ref[0]) - 5}">${ref[1]}</text>`;
  if (dots) dots.forEach((v, i) => { s += `<rect class="dot" x="${(x(i) - 1.5).toFixed(1)}" y="${(y(v) - 1.5).toFixed(1)}" width="3" height="3"/>`; });
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  s += `<polygon class="ar" points="${x(0).toFixed(1)},${y(yMin)} ${pts} ${x(n - 1).toFixed(1)},${y(yMin)}"/><polyline class="ln" points="${pts}"/><circle class="end" cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1]).toFixed(1)}" r="3.5"/>`;
  if (labels) s += `<text class="ax" x="${x(0)}" y="${h - 4}">${labels[0]}</text><text class="ax" x="${x(n - 1)}" y="${h - 4}" text-anchor="end">${labels[1]}</text>`;

const hline = (vals, w = 140, h = 16, lo = null, hi = null) => { const a = lo ?? Math.min(...vals), b = hi ?? Math.max(...vals), n = vals.length, x = i => 2 + i * (w - 4) / (n - 1), y = v => 2 + (h - 4) * (1 - (v - a) / ((b - a) || 1)); return `<svg class="ch" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline class="ln" style="stroke-width:1.25" points="${vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/><rect x="${(x(n - 1) - 2).toFixed(1)}" y="${(y(vals[n - 1]) - 2).toFixed(1)}" width="4" height="4" style="fill:var(--blue)"/></svg>`; };

  <button class="score-btn" data-act="det" data-k="score" aria-label="Trainio-Score ${D.score}, Details öffnen">${scoreCircle(D.score, 184)}<span class="lbl">Trainio-Score</span></button>

  ${startBtn()}
  <section class="sec">${secHead('Ziele', `<button class="ic-btn" data-act="toast" data-k="Ziel hinzufügen" aria-label="Ziel hinzufügen" style="color:var(--blue)">${ic('plus')}</button>`)}
    <div class="list"><button class="row" data-act="det" data-k="goal" style="flex-direction:column;align-items:stretch;gap:10px"><span style="display:flex;justify-content:space-between;align-items:baseline"><span class="t-body">Bankdrücken</span><span class="num fw5">92<span class="u">%</span></span></span><span class="pt"><i style="width:92%"></i></span></button></div></section>

    <div class="sec-h"><h1 class="t-title">Fortschritt</h1><span class="rule"></span><button class="btn btn-secondary btn-sm" data-act="sheet" data-k="period">${periodLbl()} ${ic('chevD')}</button></div>

SCR.training = () => {
  if (!W.running) return `<main class="screen"><h1 class="t-title">Training</h1><p class="proto-note">Prototyp: Pläne und Verlauf gehören nicht dazu.</p>${startBtn()}</main>`;
  const cs = W.cur;
  return `<main class="screen" style="--pad-bottom:${W.rest ? 170 : 100}px;gap:28px">
  <div class="w-top">
    <div class="w-top-row"><div><h1 class="t-title">${W.name}</h1><div class="w-time" data-clock>${mmss(elapsed())}</div></div><button class="btn btn-secondary btn-sm" data-act="finish">Beenden</button></div>
    <div class="segbar" aria-label="${doneSets()} von ${allSets()} Sätzen">${allFlat().map(s => `<i class="${s.done ? 'on' : ''}"></i>`).join('')}</div>
  </div>
  ${W.ex.map((ex, ei) => `<section class="sec">
    <div class="wa-exh"><h2 class="t-head">${ex.name}</h2><button class="ic-btn" data-act="det" data-k="exercise" data-i="${ei}" aria-label="Details zu ${ex.name}">${ic('more')}</button></div>
    <div class="wtab">
      <div class="wa-grid wa-hd"><span class="lbl">Satz</span><span class="lbl">kg</span><span class="lbl">Wdh.</span><span></span></div>
      ${ex.sets.map((s, si) => {
        const cur = cs && cs.e === ei && cs.s === si;
        const row = `<div class="wa-grid wa-row ${s.done ? 'done' : cur ? 'cur' : 'open'}" role="button" tabindex="0" data-act="sel" data-e="${ei}" data-s="${si}">
          <span class="n">${String(si + 1).padStart(2, '0')}</span><span>${w1(s.kg)}</span><span>${s.r}</span>
          <button class="chk ${s.done ? 'on' : ''}" data-act="tick" data-e="${ei}" data-s="${si}" aria-label="${s.done ? 'Satz wieder öffnen' : 'Satz erledigt'}">${ic('check')}</button></div>`;
        return cur ? row + `<div class="wa-edit">
          <div class="two">
            <div class="stepper"><button data-act="kg" data-d="-1" aria-label="Weniger Gewicht">${ic('minus')}</button><div class="val">${w1(s.kg)}<span class="u">kg</span></div><button data-act="kg" data-d="1" aria-label="Mehr Gewicht">${ic('plus')}</button></div>
            <div class="stepper"><button data-act="reps" data-d="-1" aria-label="Weniger Wiederholungen">${ic('minus')}</button><div class="val">${s.r}<span class="u">Wdh.</span></div><button data-act="reps" data-d="1" aria-label="Mehr Wiederholungen">${ic('plus')}</button></div>
          </div>
          <div class="last"><span class="lbl">Letztes Mal ${prevTxt(s)}</span><button class="btn btn-text btn-sm" data-act="rpeToggle">RPE${s.rpe ? ' ' + s.rpe : ''}</button></div>
          ${W.rpeOpen ? `<div class="rpe">${[null, 6, 7, 8, 9, 10].map(v => `<button class="${s.rpe === v || (v === null && !s.rpe) ? 'on' : ''}" data-act="rpe" data-val="${v ?? ''}">${v ?? '–'}</button>`).join('')}</div>` : ''}
          <button class="btn btn-primary btn-block" data-act="done">${ic('check')} Satz erledigt</button></div>` : row;
      }).join('')}
    </div></section>`).join('')}
  ${W.rest ? `<div class="dock"><div class="rest"><span class="bar" data-restbar style="width:${restLeft() / W.rest.total * 100}%"></span><div class="grow"><span class="lbl">Pause</span><span class="t" data-rest>${mmss(restLeft())}</span></div><button class="btn btn-secondary btn-sm" data-act="restAdj" data-d="-15">−15</button><button class="btn btn-secondary btn-sm" data-act="restAdj" data-d="15">+15</button><button class="btn btn-text btn-sm" data-act="restSkip">Weiter</button></div></div>` : ''}
</main>`;
};
const placeholder = () => `<main class="screen"><h1 class="t-title">${S.screen === 'mehr' ? 'Mehr' : 'Übungen'}</h1>
  <p class="proto-note">Prototyp: Dieser Tab gehört nicht dazu.</p></main>`;

/* ---------- Details ---------- */
const kv = rows => `<div class="list">${rows.map(([l, v]) => `<div class="row"><span class="row-main t-body">${l}</span><span class="row-val num fw5">${v}</span></div>`).join('')}</div>`;
const big = (v, u) => `<div class="hero-num">${U(v, u)}</div>`;
const smooth3 = a => a.map((v, i) => Math.round((a[i] + (a[i - 1] ?? v) + (a[i - 2] ?? v)) / 3));
const DET = {
  score: ['Trainio-Score', () => `<div style="display:flex;justify-content:center">${scoreCircle(D.score, 160)}</div>
    <div class="chips-row"><span class="pill">${D.main}</span><span class="pill warn">${D.hint}</span></div>
    ${secHead('<span class="lbl">Körperbereiche</span>')}
    <div class="areas">${D.areas.map(([n, v]) => `<span class="t-sub">${n}</span><span class="ar-bar"><i class="${v < 65 ? 'lo' : ''}" style="width:${v}%"></i><span class="exp"></span></span><b class="num">${v}</b>`).join('')}</div>
    ${secHead('<span class="lbl">Verlauf</span>')}${lineChart({ vals: D.trend, ref: [85, 'ERWARTET'], labels: ['VOR 8 WO.', 'HEUTE'] })}
    ${kv(D.parts)}`],
  streak: ['Serie', () => `${big('11', 'Wochen')}${weekTicks()}${kv([['Diese Woche', '1 von 3'], ['Längste Serie', '11 Wochen']])}`],
  volume: ['Volumen', () => `${big('4.960', 'kg')}<span>${trend('+15 % ZUR VORWOCHE')}</span>${barChart({ vals: D.volWeeks, labels: D.weekLbl, running: 10, fmt: v => nf(v) + ' t' })}${kv([['Vorwoche', '4.319 kg'], ['Ø pro Woche', '21,8 t']])}`],
  weight: ['Körpergewicht', () => `${big('80,5', 'kg')}<span>${trend('+1,2 KG IN 4 WO.')}</span>${lineChart({ vals: D.weight, yMin: 76, yMax: 82, step: 2, labels: ['KW 36', 'HEUTE'] })}${kv([['Phase', 'Bulk Herbst'], ['Tempo', '+0,4 % pro Woche']])}`],
  prs: ['Neue Rekorde', () => `${big('13', 'in 4 Wochen')}<div class="list">${D.prList.map(n => `<div class="row"><span class="row-main t-body">${n}</span></div>`).join('')}<div class="row"><span class="row-main t-body c3">und 5 weitere</span></div></div>`],
  goal: ['Bankdrücken 90 kg × 5', () => `${big('92', '%')}<div class="pt"><i style="width:92%"></i></div>${kv([['Bester Satz', '82,5 kg × 8'], ['Noch', '7,5 kg']])}`],
  workout: ['Workout', () => { const r = D.recent[S.layerI ?? 0]; return `<p class="t-head">${r[0]}</p>${r[5] ? `<div style="display:flex;justify-content:center">${ring(r[5])}</div>` : big(r[4])}${kv([['Datum', r[1]], ['Dauer', r[2]], ['Sätze', r[3]], [r[5] ? 'Volumen' : 'Strecke', r[4]]])}`; }],
  wpw: ['Workouts pro Woche', () => `${big('3,2', 'Ø')}${barChart({ vals: D.perWeek, labels: D.weekLbl, running: 10, avg: 3.2 })}${kv([['Workouts im Zeitraum', '36'], ['Diese Woche', '1']])}`],
  wscore: ['Workout-Score', () => `${big('88', 'Ø')}${lineChart({ vals: smooth3(D.wscore), dots: D.wscore, labels: ['2. SEP.', 'HEUTE'] })}${kv([['Bestes Workout', '93'], ['Letztes Workout', '88']])}`],
  attack: ['Nächster Rekord', () => `<p class="t-head">Kreuzheben</p>${big('150 × 3', 'kg')}${lineChart({ vals: [148, 150, 151, 151, 153, 155, 156, 158, 160.4], yMin: 140, yMax: 170, step: 10, labels: ['SEP.', 'HEUTE'] })}${kv([['Geschätztes 1RM', '160,4 kg'], ['Mit 150 × 3', '165 kg']])}`],
  balance: ['Pull : Push', () => `${big('0,95')}${ruler(47.5, false)}${balanceRows()}`],
  days: ['Trainingstage', () => `${big('36')}${heatmap()}${kv([['Ø pro Woche', '3,2'], ['Häufigster Tag', 'Montag']])}`],
  more: ['Mehr Statistiken', () => kv(D.more)],
  exercise: ['Übung', () => { const ex = W.ex[S.layerI ?? 0]; return `<p class="t-head">${ex.name}</p>${big(w1(Math.round(ex.best * 10) / 10), 'kg')}<span class="lbl">Geschätztes 1RM</span>${kv([['Gerät', ex.meta.split(' · ')[0]], ['Pause', mmss(ex.rest)], ['Letztes Mal', prevTxt(ex.sets[0])]])}`; }]
};

/* ---------- Regeln von Klarblau ---------- */
const RULES = [
  ['Weiß als Grund. Struktur entsteht nur durch 1-px-Linien, nicht durch Flächen oder Schatten.'],
  ['Ein schlichtes Blau, nur für Hauptknopf, aktuellen Wert, Auswahl und Fortschritt.'],
  ['Ecken 4 px, Häkchen und Markierungen eckig.'],
  ['Feine Skalen: 60 Striche am Score, Viertel-Striche an Balken, ein Strich pro Satz im Workout.'],

  ['Übersichten zeigen Titel, feine Grafik und Zahl. Alles Genauere nach Antippen.']
];
SCR.regeln = () => `<main class="screen">
  <h1 class="t-title">Klarblau</h1>
  <ol class="rules">${RULES.map(([t], i) => `<li><span class="lbl">${String(i + 1).padStart(2, '0')}</span><span>${t}</span></li>`).join('')}</ol>
  <section class="sec">${secHead('<span class="lbl">Schrift</span>')}<div>
    ${[['t-title', 'Seitentitel'], ['t-head', 'Abschnitt'], ['t-body', 'Text'], ['t-sub', 'Nebenzeile'], ['lbl', 'Beschriftung'], ['n-num', '4.960'], ['hero-num', '78']].map(([c, t]) => `<div class="ts-row"><span class="${c}">${t}</span><span class="m" data-m="${c}"></span></div>`).join('')}</div></section>
  <section class="sec">${secHead('<span class="lbl">Farben</span>')}<div class="sw-grid">
    ${[['--bg', 'Grund'], ['--line', 'Linie'], ['--line-2', 'Linie 2'], ['--text', 'Text'], ['--text-3', 'Text 3'], ['--blue', 'Blau'], ['--blue-soft', 'Blau hell'], ['--warn', 'Achtung']].map(([v, l]) => `<div class="sw"><i style="background:var(${v})"></i><span>${l}</span></div>`).join('')}</div></section>
</main>`;

/* ---------- Ebenen ---------- */
function layerHtml() {
  const L = S.layer;
  if (!L) return '';
  if (L.type === 'pop') return `<div class="pop-scrim" data-act="close"></div><div class="pop" role="tooltip" style="left:${L.x}px;top:${L.y}px">${INFO[L.k]}</div>`;
  if (L.type === 'dialog') return `<div class="scrim" data-act="close"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 class="t-head" id="dlg-t">Workout beenden?</h2><p class="lbl" style="margin-top:4px">Noch ${allSets() - doneSets()} Sätze offen</p>
    <div class="btns"><button class="btn btn-primary btn-block" data-act="finishOk">Beenden</button><button class="btn btn-secondary btn-block" data-act="close">Weiter trainieren</button></div></div>`;
  const sheet = (inner, label) => `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div>${inner}</div>`;
  const head = (t, k) => `<div class="det-h"><h2 class="t-head">${t}</h2>${k && INFO[k] ? info(k) : ''}<button class="ic-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>`;
  if (L.type === 'det') { const [t, f] = DET[L.k]; return sheet(`<div class="det">${head(t, L.k)}${f()}</div>`, t); }
  if (L.k === 'start') return sheet(`${head('Workout starten')}
    <button class="btn btn-primary btn-lg btn-block" data-act="startW">${ic('play')} Pull</button>
    <div class="list">${['Push', 'Beine', 'Leeres Workout', 'Cardio'].map(n => `<button class="row" data-act="startW"><span class="row-main t-body">${n}</span><span class="chev">${ic('chevR')}</span></button>`).join('')}</div>`, 'Workout starten');
  if (L.k === 'period') return sheet(`${head('Zeitraum')}
    <div class="list">${PERIODS.map(([k, l]) => `<button class="row" data-act="setPeriod" data-val="${k}"><span class="row-main t-body">${l}</span>${S.period === k ? `<span style="color:var(--blue)">${ic('check')}</span>` : ''}</button>`).join('')}</div>
    <div class="sec-h"><span class="lbl">Einheit</span><span class="rule"></span><div class="seg" style="width:110px">${['kg', 'lb'].map(u => `<button class="${S.unit === u ? 'on' : ''}" data-act="unit" data-val="${u}">${u}</button>`).join('')}</div></div>`, 'Zeitraum');
  if (L.k === 'summary') { const sm = L.sum; return sheet(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><span class="lbl">Gespeichert</span><h2 class="t-title">${W.name}</h2>${ring(sm.score)}<span class="lbl">Workout-Score</span></div>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr)">${[[`${Math.max(1, Math.round(sm.secs / 60))}`, 'min'], [`${sm.sets}`, 'Sätze'], [nf(sm.vol / 1000, 1), 't']].map(([v, u]) => `<div class="tile" style="min-height:0;align-items:center"><span class="n-num" style="font-size:24px">${U(v, u)}</span></div>`).join('')}</div>
    ${sm.prs.length ? `<div class="list">${sm.prs.map(p => `<div class="row"><span style="color:var(--blue)">${ic('trophy')}</span><span class="row-main t-body">${p}</span></div>`).join('')}</div>` : ''}
    <button class="btn btn-primary btn-block" data-act="summaryDone">Schließen</button>`, 'Workout gespeichert'); }
  return '';
}
function renderLayer() { $('#layer').innerHTML = layerHtml() + (S.toast ? `<div class="toast" role="status">${S.toast.i ? ic(S.toast.i) : ''}${S.toast.t}</div>` : ''); }
function toast(t, i) { S.toast = { t, i }; renderLayer(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderLayer(); }, 2600); }

/* ---------- Darstellung ---------- */
const TABS = [['start', 'home', 'Start'], ['training', 'dumbbell', 'Training'], ['uebungen', 'book', 'Übungen'], ['fortschritt', 'chart', 'Fortschritt'], ['mehr', 'grid', 'Mehr']];
const tabbar = () => `<nav class="tabbar" aria-label="Tabs">${TABS.map(([k, i, l]) => `<button class="tab ${S.screen === k ? 'on' : ''}" data-act="nav" data-to="${k}" ${S.screen === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span>${k === 'training' && W.running && S.screen !== 'training' ? '<i class="tdot"></i>' : ''}</button>`).join('')}</nav>`;
function render() {
  $('#app').innerHTML = (SCR[S.screen] || placeholder)() + tabbar();
  document.querySelectorAll('[data-m]').forEach(el => { const t = el.parentElement.querySelector('.' + el.dataset.m), cs = getComputedStyle(t); el.textContent = `${parseFloat(cs.fontSize)} px · ${cs.fontWeight}`; });
  renderLayer();
}
function go(screen) { S.screen = screen; S.layer = null; try { history.replaceState(null, '', `#${screen}`); } catch (e) { /* Rahmen erlaubt es nicht */ } render(); window.scrollTo(0, 0); }
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  $('#pt').innerHTML = `${ic(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto')}${{ auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[S.theme]}`;
  try { localStorage.setItem('trainio-klarblau-theme', S.theme); } catch (e) { /* ohne Speicher */ }
}

/* ---------- Aktionen ---------- */
function adjustSet(field, d) {
  const s = curSet(); if (!s) return;
  const ex = W.ex[W.cur.e];
  if (field === 'kg') { const old = s.kg; s.kg = Math.max(0, Math.round((s.kg + d * ex.step) * 100) / 100); ex.sets.forEach((x, i) => { if (i > W.cur.s && !x.done && x.kg === old) x.kg = s.kg; }); }
  else s.r = Math.max(0, s.r + d);
  render();
}
function complete(e, s) {
  const ex = W.ex[e], st = ex.sets[s];
  if (st.done) return;
  st.done = true; W.rpeOpen = false;
  const v = e1(st.kg, st.r);
  if (v > ex.best + .05) { ex.best = v; W.prs.push(`${ex.name} ${w1(st.kg)} kg × ${st.r}`); toast(`Neuer Rekord · ${ex.name}`, 'trophy'); }
  W.rest = { end: Date.now() + ex.rest * 1000, total: ex.rest };
  W.cur = nextOpen(W, { e, s });
  render();
}
const ACT = {
  nav: d => go(d.to),
  close: () => { S.layer = null; renderLayer(); },
  det: d => { S.layerI = d.i != null ? +d.i : null; S.layer = { type: 'det', k: d.k }; renderLayer(); },
  info: (d, el) => {
    const r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth, x = Math.min(Math.max(12, r.right - 264), vw - 276);
    S.layer = { type: 'pop', k: d.k, x, y: r.bottom + 120 < window.innerHeight ? r.bottom + 6 : Math.max(60, r.top - 100), back: S.layer && S.layer.type !== 'pop' ? S.layer : null };
    renderLayer();
  },
  sheet: d => { S.layer = { type: 'sheet', k: d.k }; renderLayer(); },
  toast: (d, el) => toast(d.k, el.dataset.i),
  startW: () => { W = newWorkout(0); go('training'); },
  sel: d => { const e = +d.e, s = +d.s; W.ex[e].sets[s].done = false; W.cur = { e, s }; render(); },
  tick: d => { const e = +d.e, s = +d.s, st = W.ex[e].sets[s]; W.cur = { e, s }; if (st.done) { st.done = false; render(); } else complete(e, s); },
  kg: d => adjustSet('kg', +d.d),
  reps: d => adjustSet('reps', +d.d),
  rpeToggle: () => { W.rpeOpen = !W.rpeOpen; render(); },
  rpe: d => { const s = curSet(); if (s) { s.rpe = d.val ? +d.val : null; W.rpeOpen = false; render(); } },
  done: () => { if (W.cur) complete(W.cur.e, W.cur.s); },
  restAdj: d => { if (W.rest) { W.rest.end = Math.max(Date.now() + 1000, W.rest.end + d.d * 1000); W.rest.total = Math.max(W.rest.total, restLeft()); tick(); } },
  restSkip: () => { W.rest = null; render(); },
  finish: () => { S.layer = { type: 'dialog' }; renderLayer(); },
  finishOk: () => { const sets = doneSets(); W.rest = null; S.layer = { type: 'sheet', k: 'summary', sum: { score: Math.min(100, Math.round(62 + 22 * sets / allSets() + 4 * W.prs.length)), prs: W.prs.slice(), secs: elapsed(), sets, vol: volume() } }; render(); },
  summaryDone: () => { W.running = false; go('start'); toast('Workout gespeichert', 'check'); },
  setPeriod: d => { S.period = d.val; S.layer = null; render(); },
  unit: d => { S.unit = d.val; render(); },
  area: d => { S.area = d.val; render(); if (d.val !== 'Übersicht') toast(`${d.val}: nicht Teil des Prototyps`); }
};
document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p) {
    if (p.dataset.p === 'theme') { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); }
    if (p.dataset.p === 'rules') go(S.screen === 'regeln' ? 'start' : 'regeln');
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  e.stopPropagation();
  if (a.dataset.act === 'close' && S.layer && S.layer.type === 'pop' && S.layer.back) { S.layer = S.layer.back; renderLayer(); return; }
  (ACT[a.dataset.act] || (() => {}))(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.layer) { S.layer = S.layer.back || null; renderLayer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
function readHash() { const m = /^#(start|training|fortschritt|uebungen|mehr|regeln)$/.exec(location.hash); if (m) S.screen = m[1]; }
window.addEventListener('hashchange', () => { readHash(); S.layer = null; render(); });
/* Uhr und Pause aktualisieren, ohne alles neu zu zeichnen */
function tick() {
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = mmss(elapsed()); });
  if (!W.rest) return;
  const left = restLeft();
  if (left <= 0) { W.rest = null; render(); return; }
  document.querySelectorAll('[data-rest]').forEach(el => { el.textContent = mmss(left); });
  const b = document.querySelector('[data-restbar]'); if (b) b.style.width = `${left / W.rest.total * 100}%`;
}
setInterval(tick, 1000);
try { S.theme = localStorage.getItem('trainio-klarblau-theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
readHash();
applyTheme();
render();
</script>
