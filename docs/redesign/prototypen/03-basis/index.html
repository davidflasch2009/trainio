/* WEGWERF-PROTOTYP zu Ticket 03 „Die neue Basis“ (docs/redesign/tickets/03-basis.md) – nie in die echte App übernehmen.

   Übersichten zeigen nur Titel und Zahl, alles Genauere erst nach Antippen, Score als großer Kreis oben.
   Zwei Varianten (Leiste oben): A „Nur Zahlen“ – Details als Fenster von unten; B „Mit Grafik“ – Kacheln mit kleiner
   Grafik, Details als eigene Seite. Fassung 1 (drei Varianten) liegt in der Git-Historie (Commit bb5af6d). */
:root {
  --bg: #F2F2F4; --desk: #E3E3E8; --surface: #FFFFFF; --surface-2: #F6F6F8; --fill: #E9E9ED; --seg-on: #FFFFFF;
  --line: rgba(17, 18, 28, .11); --sheet-bg: #FFFFFF;
  --text: #121318; --text-2: #4F525C; --text-3: #6E717C;
  --accent: #3D55D1; --on-accent: #FFFFFF; --accent-soft: rgba(61, 85, 209, .12);
  --good: #1D7F47; --warn: #9C6200; --bad: #C23A3A;
  --chart-muted: #CBCDD5; --grid: rgba(17, 18, 28, .09);
  --proto-bg: #121318; --proto-fg: #FFFFFF; --scrim: rgba(10, 10, 14, .32);
  --card-shadow: 0 1px 2px rgba(10, 10, 20, .04), 0 4px 14px rgba(10, 10, 20, .05);
  --sheet-shadow: 0 -10px 40px rgba(10, 10, 20, .16);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Eine Schriftskala: 28 · 20 · 17 · 15 · 13, Zahlen 30 und 64 */
  --fs-title: 28px; --lh-title: 34px; --fs-head: 20px; --lh-head: 25px; --fs-body: 17px; --lh-body: 22px;
  --fs-sub: 15px; --lh-sub: 20px; --fs-cap: 13px; --lh-cap: 18px; --fs-tab: 11px; --fs-num: 30px; --fs-hero: 64px;
  --r-card: 18px; --r-ctl: 12px; --r-btn: 14px; --r-sheet: 22px;
  --tap: 44px; --bar-h: 56px; --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0D; --desk: #000000; --surface: #17171A; --surface-2: #1D1D21; --fill: #2A2A30; --seg-on: #45454D;
    --line: rgba(255, 255, 255, .10); --sheet-bg: #1E1E22;
    --text: #F2F2F5; --text-2: #A7A9B3; --text-3: #82848F;
    --accent: #8597FF; --on-accent: #0B0B0D; --accent-soft: rgba(133, 151, 255, .17);
    --good: #3CC97D; --warn: #F0B03A; --bad: #FF6B6B;
    --chart-muted: #3B3C44; --grid: rgba(255, 255, 255, .08);
    --proto-bg: #F2F2F5; --proto-fg: #121318; --scrim: rgba(0, 0, 0, .55);
    --card-shadow: none; --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0D; --desk: #000000; --surface: #17171A; --surface-2: #1D1D21; --fill: #2A2A30; --seg-on: #45454D;
  --line: rgba(255, 255, 255, .10); --sheet-bg: #1E1E22;
  --text: #F2F2F5; --text-2: #A7A9B3; --text-3: #82848F;
  --accent: #8597FF; --on-accent: #0B0B0D; --accent-soft: rgba(133, 151, 255, .17);
  --good: #3CC97D; --warn: #F0B03A; --bad: #FF6B6B;
  --chart-muted: #3B3C44; --grid: rgba(255, 255, 255, .08);
  --proto-bg: #F2F2F5; --proto-fg: #121318; --scrim: rgba(0, 0, 0, .55);
  --card-shadow: none; --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.screen { display: flex; flex-direction: column; gap: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--top) var(--pad-bottom, 96px); }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }

/* Schrift */
.t-title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.t-head { font-size: var(--fs-head); line-height: var(--lh-head); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.t-body { font-size: var(--fs-body); line-height: var(--lh-body); }
.t-sub { font-size: var(--fs-sub); line-height: var(--lh-sub); }
.t-cap { font-size: var(--fs-cap); line-height: var(--lh-cap); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.n-num { font-family: var(--font-num); font-size: var(--fs-num); line-height: 1.1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-num { font-family: var(--font-num); font-size: var(--fs-hero); line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.u { font-size: max(var(--fs-cap), .42em); font-weight: 600; color: var(--text-2); margin-left: .2em; letter-spacing: 0; }
.c2 { color: var(--text-2); } .c3 { color: var(--text-3); } .fw6 { font-weight: 600; }
.good { color: var(--good); } .warn { color: var(--warn); }
.trend { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; white-space: nowrap; }
.trend .ic { width: 1em; height: 1em; vertical-align: 0; stroke-width: 2.2; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: var(--r-btn); font-size: var(--fs-body); font-weight: 600; line-height: 1.2; text-align: center; position: relative; transition: transform .12s, opacity .12s; }
.btn:active { transform: scale(.98); opacity: .8; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--fill); color: var(--text); }
.btn-text { color: var(--accent); padding: 0 8px; }
.btn-block { width: 100%; }
.btn-lg { min-height: 56px; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: var(--fs-sub); }
.btn-sm::after { content: ""; position: absolute; inset: -5px 0; }
.ic-btn { width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border-radius: 50%; color: var(--text-2); font-size: 18px; flex: none; }
.ic-btn:active { background: var(--fill); }
.info { color: var(--text-3); font-size: 16px; }

/* Liste */
.list { background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 12px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
button.row:active { background: var(--fill); }
.row-main { flex: 1; min-width: 0; }
.row-val { text-align: right; white-space: nowrap; }
.chev { color: var(--text-3); font-size: 15px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }

/* Kachel */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r-card); padding: 14px 16px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 96px; min-width: 0; width: 100%; text-align: left; transition: transform .12s; }
button.tile:active { transform: scale(.98); }
body[data-v="b"] .tile { min-height: 124px; }
.tile-h { display: flex; align-items: center; gap: 6px; font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 600; color: var(--text-2); }
.tile-h .ic { vertical-align: 0; }
.tile-g { height: 24px; display: flex; align-items: flex-end; overflow: hidden; }

/* Score-Kreis (Skizze David) */
.score-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; align-self: center; padding: 4px 16px; border-radius: 24px; transition: transform .12s; }
.score-btn:active { transform: scale(.98); }
.score-c text { fill: var(--text); font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }

/* Eingaben */
.seg { display: flex; background: var(--fill); border-radius: var(--r-ctl); padding: 2px; gap: 2px; }
.seg button { flex: 1; min-height: 32px; padding: 0 8px; border-radius: calc(var(--r-ctl) - 2px); font-size: var(--fs-sub); font-weight: 600; color: var(--text-2); position: relative; text-align: center; white-space: nowrap; }
.seg button::after { content: ""; position: absolute; inset: -6px 0; }
.seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.stepper { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); align-items: center; background: var(--fill); border-radius: var(--r-ctl); min-height: 48px; }
.stepper > button { height: 48px; display: grid; place-items: center; font-size: 18px; color: var(--text); }
.stepper > button:active { opacity: .5; }
.stepper .val { text-align: center; font-weight: 600; font-size: var(--fs-body); white-space: nowrap; }
.stepper .val small { font-size: var(--fs-cap); font-weight: 500; color: var(--text-2); margin-left: 3px; }
.pt { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.pt > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.utabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; border-bottom: 1px solid var(--line); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { min-height: 44px; font-size: var(--fs-sub); font-weight: 600; color: var(--text-2); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.utabs button.on { color: var(--text); border-color: var(--text); }
.rpe { display: flex; gap: 6px; }
.rpe button { flex: 1; min-height: 36px; border-radius: var(--r-ctl); background: var(--fill); font-size: var(--fs-sub); font-weight: 600; color: var(--text-2); position: relative; text-align: center; }
.rpe button::after { content: ""; position: absolute; inset: -4px 0; }
.rpe button.on { background: var(--text); color: var(--bg); }

/* Tab-Leiste und feste Leisten */
.tabbar { position: fixed; z-index: 20; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 430px; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; font-size: var(--fs-tab); line-height: 1.1; font-weight: 500; color: var(--text-3); position: relative; text-align: center; }
.tab .ic { font-size: 18px; vertical-align: 0; }
.tab.on { color: var(--accent); }
.tdot { position: absolute; top: 6px; left: calc(50% + 9px); width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.dock { position: fixed; z-index: 19; left: 0; right: 0; margin: 0 auto; max-width: 430px; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }

/* Prototyp-Leiste (nicht Teil des Designs) */
.proto-band { position: fixed; z-index: 55; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top, 0px) + 52px); background: var(--bg); pointer-events: none; }
.proto { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 16px); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--proto-bg); color: var(--proto-fg); font: 600 13px/1 var(--font); box-shadow: 0 6px 24px rgba(0, 0, 0, .22); white-space: nowrap; }
.proto button { min-height: 36px; min-width: 36px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.proto button:active { background: rgba(128, 128, 128, .3); }
.proto .ic { width: 16px; height: 16px; vertical-align: 0; }
.proto .ptag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; padding: 0 4px 0 10px; }
.proto .psep { width: 1px; height: 20px; background: currentColor; opacity: .2; margin: 0 2px; }
.proto .pv { min-width: 116px; }
@media (max-width: 400px) { .proto .ptag { display: none; } }
.proto-note { border: 1px dashed var(--text-3); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 18px; color: var(--text-2); }

/* Fenster, Rückfrage, Meldung, Erklärung */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); animation: fade .2s; }
.sheet { position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 430px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; background: var(--sheet-bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: var(--sheet-shadow); display: flex; flex-direction: column; gap: 16px; animation: up .28s cubic-bezier(.2, .8, .2, 1); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); margin: 0 auto -4px; flex: none; }
.sheet .list { background: var(--surface-2); }
.dialog { position: fixed; z-index: 71; left: 0; right: 0; top: 50%; margin: 0 auto; width: min(320px, calc(100% - 48px)); transform: translateY(-50%); background: var(--sheet-bg); border-radius: 18px; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 8px; text-align: center; animation: pop .2s; }
.dialog .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.toast { position: fixed; z-index: 90; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: var(--fs-sub); line-height: var(--lh-sub); font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); animation: drop .25s; }
.pop-scrim { position: fixed; inset: 0; z-index: 80; }
.pop { position: fixed; z-index: 81; width: 264px; padding: 12px 14px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: var(--fs-sub); line-height: var(--lh-sub); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); animation: pop .15s; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { opacity: 0; scale: .96; } }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Details: gleicher Aufbau überall – Titel, große Zahl, eine Grafik, wenige Werte */
.det { display: flex; flex-direction: column; gap: 16px; }
.det-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
.det-h .t-head, .det-h .t-title { flex: 1; min-width: 0; }
.det-sub { font-size: var(--fs-sub); line-height: var(--lh-sub); font-weight: 600; color: var(--text-2); margin-bottom: -8px; }
.page-back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; color: var(--accent); font-weight: 600; margin-left: -6px; align-self: flex-start; }
.page-back .ic { width: 22px; height: 22px; vertical-align: 0; }
body[data-v="b"] .det.page { animation: slide .22s ease-out; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pill { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 999px; background: var(--fill); font-size: var(--fs-sub); font-weight: 600; }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.areas { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 28px; align-items: center; gap: 10px 12px; }
.areas .num { text-align: right; }
.ar-bar { display: block; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.ar-bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.ar-bar > i.lo { background: var(--warn); }

/* Diagramme: ein Stil – Balken und Linie, Achse rechts, aktuell = Akzent, Rest grau, keine Glättung */
.ch { display: block; width: 100%; height: auto; overflow: visible; }
.ch .gl { stroke: var(--grid); stroke-width: 1; }
.ch .ax { fill: var(--text-3); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.ch .b { fill: var(--chart-muted); } .ch .b-cur { fill: var(--accent); } .ch .b-run { fill: var(--accent); opacity: .3; }
.ch .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch .ar { fill: var(--accent); opacity: .1; }
.ch .dot { fill: var(--chart-muted); }
.ch .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ch .ref { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.ch .refl { fill: var(--text-2); font-size: 11px; font-weight: 600; font-family: var(--font); }
.hm .h0 { fill: var(--fill); } .hm .h1 { fill: var(--accent); opacity: .3; } .hm .h2 { fill: var(--accent); opacity: .6; } .hm .h3 { fill: var(--accent); }
.mini-bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; width: 100%; }
.mini-bars i { flex: 1; border-radius: 2px; background: var(--chart-muted); min-height: 2px; }
.mini-bars i.on { background: var(--accent); }
.dots { display: flex; gap: 6px; align-items: center; height: 24px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--fill); flex: none; }
.dots.s { gap: 3px; } .dots.s i { width: 7px; height: 7px; border-radius: 2px; }
.dots i.on { background: var(--accent); }
.dots i.today { box-shadow: 0 0 0 1.5px var(--text-2) inset; }

/* Laufendes Workout */
.w-top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 5; background: var(--bg); margin: 0 -16px; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.w-top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wa-exh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 4px; }
.wa-grid { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.wa-hd { padding: 10px 12px 4px; color: var(--text-2); font-size: var(--fs-cap); font-weight: 600; }
.wa-row { position: relative; padding: 4px 12px; min-height: 52px; font-size: var(--fs-body); width: 100%; }
.wa-row + .wa-row::before, .wa-hd + .wa-row::before, .wa-edit + .wa-row::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--line); }
.wa-row.open { color: var(--text-3); }
.wa-row.cur { background: var(--surface-2); color: var(--text); font-weight: 600; }
.chk { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--text-3); justify-self: end; position: relative; }
.chk::after { content: ""; position: absolute; inset: -2px; }
.chk.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chk .ic { vertical-align: 0; stroke-width: 2.4; }

function niceStep(range, n = 2) { const raw = range / n || 1, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart({ vals, labels = [], w = 358, h = 150, running = -1, fmt = v => nf(v), avg = null }) {
  const n = vals.length, axW = 28, top = 8, bot = labels.length ? 20 : 4, cw = w - axW, ch = h - top - bot;

/* ---------- Bildschirme ---------- */

    <div class="list"><button class="row" data-act="det" data-k="goal" style="flex-direction:column;align-items:stretch;gap:10px"><span style="display:flex;justify-content:space-between"><span class="t-body fw6">Bankdrücken</span><span class="t-body fw6 num">92 %</span></span><span class="pt"><i style="width:92%"></i></span></button></div></section>

SCR.fortschritt = () => `<main class="screen">

</main>`;
/* Workout – A: Tabelle, B: eine Übung auf einmal; beide ohne Nebentexte */
SCR.training = () => {
  if (!W.running) return `<main class="screen"><h1 class="t-title">Training</h1><p class="proto-note">Prototyp: Pläne und Verlauf gehören nicht dazu.</p>${startBtn()}</main>`;
  const top = `<div class="w-top"><div class="w-top-row"><div><h1 class="t-head">${W.name}</h1><div class="t-sub c2 num" data-clock>${mmss(elapsed())}</div></div><button class="btn btn-secondary btn-sm" data-act="finish">Beenden</button></div>

};
const rpeBlock = s => W.rpeOpen

function workoutA(top, rest) {

  ${rest || `<div class="dock">${s ? `<button class="btn btn-primary btn-lg btn-block" data-act="done">${ic('check')} Satz erledigt</button>`
    : W.cur ? `<button class="btn btn-primary btn-lg btn-block" data-act="sel" data-e="${W.cur.e}" data-s="${W.cur.s}">Weiter: ${W.ex[W.cur.e].name}</button>`
    : `<button class="btn btn-primary btn-lg btn-block" data-act="finish">Beenden</button>`}</div>`}
</main>`;
}

    ${sm.prs.length ? `<div class="list">${sm.prs.map(p => `<div class="row"><span style="color:var(--accent)">${ic('trophy')}</span><span class="row-main t-body">${p}</span></div>`).join('')}</div>` : ''}

}
function renderLayer() {
  $('#layer').innerHTML = layerHtml() + (S.toast ? `<div class="toast" role="status">${S.toast.i ? ic(S.toast.i) : ''}${S.toast.t}</div>` : '');
}
function toast(t, i) {
  S.toast = { t, i }; renderLayer();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderLayer(); }, 2600);
}

/* ---------- Darstellung ---------- */
const TABS = [['start', 'home', 'Start'], ['training', 'dumbbell', 'Training'], ['uebungen', 'book', 'Übungen'], ['fortschritt', 'chart', 'Fortschritt'], ['mehr', 'grid', 'Mehr']];
const tabbar = () => `<nav class="tabbar" aria-label="Tabs">${TABS.map(([k, i, l]) => `<button class="tab ${S.screen === k ? 'on' : ''}" data-act="nav" data-to="${k}" ${S.screen === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span>${k === 'training' && W.running && S.screen !== 'training' ? '<i class="tdot"></i>' : ''}</button>`).join('')}</nav>`;
const pageDetail = () => { const d = detBody(S.detail), from = TABS.find(t => t[0] === S.screen); return `<main class="screen"><div class="det page">
  <button class="page-back" data-act="back">${ic('chevL')}${from ? from[2] : 'Zurück'}</button>
  <div class="det-h"><h1 class="t-title">${d.t}</h1>${INFO[S.detail] ? info(S.detail) : ''}</div>${d.html}</div></main>`; };
function render() {
  document.body.dataset.v = S.v;
  const fn = S.v === 'b' && S.detail ? pageDetail : SCR[S.screen] || placeholder;
  $('#app').innerHTML = fn() + tabbar();
  $('#pv').textContent = `${S.v.toUpperCase()} · ${VARS[S.v]}`;
  document.querySelectorAll('[data-m]').forEach(el => { const t = el.parentElement.querySelector('.' + el.dataset.m), cs = getComputedStyle(t); el.textContent = `${parseFloat(cs.fontSize)} px · ${cs.fontWeight}`; });
  renderLayer();
}
function go(screen) {
  S.screen = screen; S.layer = null; S.detail = null;
  try { history.replaceState(null, '', `#${S.v}-${S.screen}`); } catch (e) { /* Rahmen erlaubt es nicht */ }
  render(); window.scrollTo(0, 0);
}
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  $('#pt').innerHTML = `${ic(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto')}${{ auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[S.theme]}`;
  try { localStorage.setItem('trainio-proto-theme', S.theme); } catch (e) { /* ohne Speicher */ }
}

/* ---------- Aktionen ---------- */
function adjustSet(field, d) {
  const s = curSet(); if (!s) return;
  const ex = W.ex[W.cur.e];
  if (field === 'kg') {
    const old = s.kg; s.kg = Math.max(0, Math.round((s.kg + d * ex.step) * 100) / 100);
    ex.sets.forEach((x, i) => { if (i > W.cur.s && !x.done && x.kg === old) x.kg = s.kg; });   // folgende Sätze übernehmen
  } else s.r = Math.max(0, s.r + d);
  render();
}
function complete(e, s) {
  const ex = W.ex[e], st = ex.sets[s];
  if (st.done) return;
  st.done = true; W.rpeOpen = false;
  const v = e1(st.kg, st.r);
  if (v > ex.best + .05) { ex.best = v; W.prs.push(`${ex.name} ${w1(st.kg)} kg × ${st.r}`); toast(`Neuer Rekord · ${ex.name}`, 'trophy'); }
  W.rest = { end: Date.now() + ex.rest * 1000, total: ex.rest };
  W.cur = nextOpen(W, { e, s }); W.view = undefined;
  render();
}
const ACT = {
  nav: d => go(d.to),
  back: () => { S.detail = null; render(); window.scrollTo(0, 0); },
  close: () => { S.layer = null; renderLayer(); },
  det: d => {
    S.layerI = d.i != null ? +d.i : null;
    if (S.v === 'b') { S.detail = d.k; S.layer = null; render(); window.scrollTo(0, 0); }
    else { S.layer = { type: 'det', k: d.k }; renderLayer(); }
  },
  info: (d, el) => {
    const r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth, x = Math.min(Math.max(12, r.right - 264), vw - 276);
    S.layer = { type: 'pop', k: d.k, x, y: r.bottom + 120 < window.innerHeight ? r.bottom + 6 : Math.max(60, r.top - 96), back: S.layer && S.layer.type !== 'pop' ? S.layer : null };
    renderLayer();
  },
  sheet: d => { S.layer = { type: 'sheet', k: d.k }; renderLayer(); },
  toast: (d, el) => toast(d.k, el.dataset.i),
  startW: () => { W = newWorkout(0); go('training'); },
  sel: d => { const e = +d.e, s = +d.s; W.ex[e].sets[s].done = false; W.cur = { e, s }; W.view = undefined; render(); },
  tick: d => { const e = +d.e, s = +d.s, st = W.ex[e].sets[s]; W.cur = { e, s }; if (st.done) { st.done = false; render(); } else complete(e, s); },
  kg: d => adjustSet('kg', +d.d),
  reps: d => adjustSet('reps', +d.d),
  rpeToggle: () => { W.rpeOpen = !W.rpeOpen; render(); },
  rpe: d => { const s = curSet(); if (s) { s.rpe = d.val ? +d.val : null; W.rpeOpen = false; render(); } },
  done: () => { if (W.cur) complete(W.cur.e, W.cur.s); },
  restAdj: d => { if (W.rest) { W.rest.end = Math.max(Date.now() + 1000, W.rest.end + d.d * 1000); W.rest.total = Math.max(W.rest.total, restLeft()); tick(); } },
  restSkip: () => { W.rest = null; render(); },
  exGo: d => {
    const cur = W.view ?? (W.cur ? W.cur.e : 0), ne = Math.min(W.ex.length - 1, Math.max(0, cur + +d.d)), si = W.ex[ne].sets.findIndex(s => !s.done);
    if (si >= 0) { W.cur = { e: ne, s: si }; W.view = undefined; } else W.view = ne;
    render();
  },
  finish: () => { S.layer = { type: 'dialog' }; renderLayer(); },
  finishOk: () => { const sets = doneSets(); W.rest = null; S.layer = { type: 'sheet', k: 'summary', sum: { score: Math.min(100, Math.round(62 + 22 * sets / allSets() + 4 * W.prs.length)), prs: W.prs.slice(), secs: elapsed(), sets, vol: volume() } }; render(); },
  summaryDone: () => { W.running = false; go('start'); toast('Workout gespeichert', 'check'); },
  setPeriod: d => { S.period = d.val; S.layer = null; render(); },
  unit: d => { S.unit = d.val; render(); },
  area: d => { S.area = d.val; render(); if (d.val !== 'Übersicht') toast(`${d.val}: nicht Teil des Prototyps`); }
};
document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p) {
    if (p.dataset.p === 'prev' || p.dataset.p === 'next') { S.v = S.v === 'a' ? 'b' : 'a'; go(S.screen); }
    if (p.dataset.p === 'theme') { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); }
    if (p.dataset.p === 'parts') go(S.screen === 'regeln' ? 'start' : 'regeln');
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  e.stopPropagation();
  // Erklärung schließen: zurück zum Fenster, aus dem sie kam
  if (a.dataset.act === 'close' && S.layer && S.layer.type === 'pop' && S.layer.back) { S.layer = S.layer.back; renderLayer(); return; }
  (ACT[a.dataset.act] || (() => {}))(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.layer) { S.layer = S.layer.back || null; renderLayer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.closest('input, textarea, [contenteditable]')) { S.v = S.v === 'a' ? 'b' : 'a'; go(S.screen); }
});
function readHash() {
  const m = /^#([ab])-(start|training|fortschritt|uebungen|mehr|regeln)$/.exec(location.hash);
  if (m) { S.v = m[1]; S.screen = m[2]; }
}
window.addEventListener('hashchange', () => { readHash(); S.layer = null; S.detail = null; render(); });
/* Uhr und Pause aktualisieren, ohne alles neu zu zeichnen */
function tick() {
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = mmss(elapsed()); });
  if (!W.rest) return;
  const left = restLeft();
  if (left <= 0) { W.rest = null; render(); return; }
  document.querySelectorAll('[data-rest]').forEach(el => { el.textContent = mmss(left); });
}
setInterval(tick, 1000);
try { S.theme = localStorage.getItem('trainio-proto-theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
readHash();
applyTheme();
render();
</script>
