<style>
/* WEGWERF-PROTOTYP zu Ticket 03 „Die neue Basis“ (docs/redesign/tickets/03-basis.md) – nie in die echte App übernehmen.
   Drei Varianten der Basis in neutraler Haut, umschaltbar über die Leiste oben (#a-start, #b-training, #c-fortschritt …).
   Gleich in allen Varianten: Farbrollen (neutral, ein Platzhalter-Akzent, 3 Signalfarben), 4/8-Raster, Tap-Flächen ab 44 px,
   ein Symbolsatz, ein Diagramm-Stil. Je Variante anders: Schriftstufen, Ecken, Abstände und der Aufbau der Bildschirme. */
:root {
  --bg: #F2F2F4; --desk: #E3E3E8; --surface: #FFFFFF; --surface-2: #F6F6F8; --fill: #E9E9ED; --seg-on: #FFFFFF;
  --line: rgba(17, 18, 28, .11); --sheet-bg: #FFFFFF;
  --text: #121318; --text-2: #4F525C; --text-3: #6E717C;
  --accent: #3D55D1; --on-accent: #FFFFFF; --accent-soft: rgba(61, 85, 209, .12);
  --good: #1D7F47; --warn: #9C6200; --bad: #C23A3A;
  --chart-muted: #CBCDD5; --grid: rgba(17, 18, 28, .09);
  --proto-bg: #121318; --proto-fg: #FFFFFF; --scrim: rgba(10, 10, 14, .32);
  --card-shadow: 0 1px 2px rgba(10, 10, 20, .04), 0 4px 14px rgba(10, 10, 20, .05);
  --sheet-shadow: 0 -10px 40px rgba(10, 10, 20, .16);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --tap: 44px; --bar-h: 56px; --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0D; --desk: #000000; --surface: #17171A; --surface-2: #1D1D21; --fill: #2A2A30; --seg-on: #45454D;
    --line: rgba(255, 255, 255, .10); --sheet-bg: #1E1E22;
    --text: #F2F2F5; --text-2: #A7A9B3; --text-3: #82848F;
    --accent: #8597FF; --on-accent: #0B0B0D; --accent-soft: rgba(133, 151, 255, .17);
    --good: #3CC97D; --warn: #F0B03A; --bad: #FF6B6B;
    --chart-muted: #3B3C44; --grid: rgba(255, 255, 255, .08);
    --proto-bg: #F2F2F5; --proto-fg: #121318; --scrim: rgba(0, 0, 0, .55);
    --card-shadow: none; --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0D; --desk: #000000; --surface: #17171A; --surface-2: #1D1D21; --fill: #2A2A30; --seg-on: #45454D;
  --line: rgba(255, 255, 255, .10); --sheet-bg: #1E1E22;
  --text: #F2F2F5; --text-2: #A7A9B3; --text-3: #82848F;
  --accent: #8597FF; --on-accent: #0B0B0D; --accent-soft: rgba(133, 151, 255, .17);
  --good: #3CC97D; --warn: #F0B03A; --bad: #FF6B6B;
  --chart-muted: #3B3C44; --grid: rgba(255, 255, 255, .08);
  --proto-bg: #F2F2F5; --proto-fg: #121318; --scrim: rgba(0, 0, 0, .55);
  --card-shadow: none; --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- Varianten: Schriftstufen, Ecken, Abstände ---------- */
/* A „Listen“: Apple-nah. 34 · 22 · 17 · 15 · 13, Zahlen 28 / 56 */
body, body[data-v="a"] {
  --fs-title: 34px; --lh-title: 41px; --fw-title: 700; --fs-head: 22px; --lh-head: 28px;
  --fs-body: 17px; --lh-body: 22px; --fs-sub: 15px; --lh-sub: 20px; --fs-cap: 13px; --lh-cap: 18px; --fs-tab: 11px;
  --fs-num: 28px; --fs-hero: 56px; --num-track: -.01em;
  --r-card: 14px; --r-ctl: 10px; --r-btn: 12px; --r-sheet: 14px; --r-dialog: 14px; --gap-sec: 32px; --pad-card: 16px;
}
/* B „Kacheln“: kompakter Text, große Zahlen. 28 · 20 · 16 · 14 · 12, Zahlen 30 / 64 */
body[data-v="b"] {
  --fs-title: 28px; --lh-title: 34px; --fw-title: 700; --fs-head: 20px; --lh-head: 25px;
  --fs-body: 16px; --lh-body: 21px; --fs-sub: 14px; --lh-sub: 19px; --fs-cap: 12px; --lh-cap: 16px; --fs-tab: 12px;
  --fs-num: 30px; --fs-hero: 64px; --num-track: -.035em;
  --r-card: 22px; --r-ctl: 14px; --r-btn: 999px; --r-sheet: 28px; --r-dialog: 24px; --gap-sec: 16px; --pad-card: 16px;
}
/* C „Klartext“: Sätze statt Kacheln, ohne Kartenrahmen. 28 · 20 · 17 · 15 · 13, Zahlen 40 / 48 */
body[data-v="c"] {
  --fs-title: 28px; --lh-title: 34px; --fw-title: 600; --fs-head: 20px; --lh-head: 26px;
  --fs-body: 17px; --lh-body: 24px; --fs-sub: 15px; --lh-sub: 21px; --fs-cap: 13px; --lh-cap: 18px; --fs-tab: 13px;
  --fs-num: 40px; --fs-hero: 48px; --num-track: -.02em;
  --r-card: 0px; --r-ctl: 8px; --r-btn: 10px; --r-sheet: 12px; --r-dialog: 10px; --gap-sec: 24px; --pad-card: 0px;
}

/* ---------- Grundlagen ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }

.app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); }
@media (min-width: 600px) { body { background: var(--desk); } .app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, .14); } }
.screen { display: flex; flex-direction: column; gap: var(--gap-sec); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--top) var(--pad-bottom, 96px); }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }

/* Schrift */
.t-title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: var(--fw-title); letter-spacing: -.02em; text-wrap: balance; }
.t-head { font-size: var(--fs-head); line-height: var(--lh-head); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.t-body { font-size: var(--fs-body); line-height: var(--lh-body); }
.t-sub { font-size: var(--fs-sub); line-height: var(--lh-sub); }
.t-cap { font-size: var(--fs-cap); line-height: var(--lh-cap); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.n-num { font-family: var(--font-num); font-size: var(--fs-num); line-height: 1.1; font-weight: 700; letter-spacing: var(--num-track); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-num { font-family: var(--font-num); font-size: var(--fs-hero); line-height: 1; font-weight: 700; letter-spacing: var(--num-track); font-variant-numeric: tabular-nums; }
.u { font-size: max(var(--fs-cap), .4em); font-weight: 600; color: var(--text-2); margin-left: .25em; letter-spacing: 0; }
.c2 { color: var(--text-2); } .c3 { color: var(--text-3); } .fw6 { font-weight: 600; } .fw4 { font-weight: 400; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.trend { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; white-space: nowrap; }
.trend .ic { width: 1em; height: 1em; vertical-align: 0; stroke-width: 2.2; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: var(--r-btn); font-size: var(--fs-body); font-weight: 600; line-height: 1.2; text-align: center; position: relative; transition: transform .12s, opacity .12s; }
.btn:active { transform: scale(.98); opacity: .8; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--fill); color: var(--text); }
.btn-text { color: var(--accent); padding: 0 8px; }
.btn-danger { color: var(--bad); }
.btn-block { width: 100%; }
.btn-lg { min-height: 56px; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: var(--fs-sub); }
.btn-sm::after { content: ""; position: absolute; inset: -5px 0; }
.btn-col { flex-direction: column; gap: 2px; }
.btn-col small { font-size: var(--fs-cap); font-weight: 500; opacity: .85; }
.ic-btn { width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border-radius: 50%; color: var(--text-2); font-size: 18px; flex: none; }
.ic-btn:active { background: var(--fill); }
.info { color: var(--text-3); font-size: 16px; margin: -12px -12px -12px 0; }

/* Liste */
.list { background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--tap); padding: 11px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
button.row:active { background: var(--fill); }
.row-ic { color: var(--text-2); font-size: 17px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--fill); flex: none; }
.row-ic .ic { vertical-align: 0; }
.row-main { flex: 1; min-width: 0; }
.row-val { text-align: right; white-space: nowrap; }
.chev { color: var(--text-3); font-size: 15px; }
.sec { display: flex; flex-direction: column; gap: var(--s2); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }

/* Karte, Kachel */
.card { background: var(--surface); border-radius: var(--r-card); padding: var(--pad-card); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
[role="button"].card { cursor: pointer; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.lbl { font-size: var(--fs-sub); line-height: var(--lh-sub); font-weight: 600; }

/* Eingaben */
.seg { display: flex; background: var(--fill); border-radius: var(--r-ctl); padding: 2px; gap: 2px; }
.seg button { flex: 1; min-height: 32px; padding: 0 8px; border-radius: calc(var(--r-ctl) - 2px); font-size: var(--fs-sub); font-weight: 600; color: var(--text-2); position: relative; text-align: center; white-space: nowrap; }
.seg button::after { content: ""; position: absolute; inset: -6px 0; }
.seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.stepper { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); align-items: center; background: var(--fill); border-radius: var(--r-ctl); min-height: 48px; }
.stepper > button { height: 48px; display: grid; place-items: center; font-size: 18px; color: var(--text); }
.stepper > button:active { opacity: .5; }
.stepper .val { text-align: center; font-weight: 600; font-size: var(--fs-body); white-space: nowrap; }
.stepper .val small { font-size: var(--fs-cap); font-weight: 500; color: var(--text-2); margin-left: 3px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-size: var(--fs-sub); font-weight: 600; color: var(--text-2); position: relative; white-space: nowrap; }
.chip::after { content: ""; position: absolute; inset: -5px 0; }
.chip.on { background: var(--text); color: var(--bg); }
.pt { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.pt > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

/* Tab-Leiste */
.tabbar { position: fixed; z-index: 20; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 430px; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; font-size: var(--fs-tab); line-height: 1.1; font-weight: 500; color: var(--text-3); position: relative; text-align: center; }
.tab .ic { font-size: 18px; vertical-align: 0; }
.tab.on { color: var(--accent); }
.tdot { position: absolute; top: 6px; left: calc(50% + 9px); width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
body[data-v="b"] .tab .ic { box-sizing: content-box; padding: 3px 14px; border-radius: 999px; }
body[data-v="b"] .tab.on { color: var(--text); font-weight: 600; }
body[data-v="b"] .tab.on .ic { background: var(--accent-soft); color: var(--accent); }
body[data-v="c"] .tab { font-weight: 500; }
body[data-v="c"] .tab.on { color: var(--text); font-weight: 700; }
body[data-v="c"] .tab.on::after { content: ""; position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
body[data-v="c"] .tdot { top: 10px; left: calc(50% + 30px); }

/* Feste Leisten über der Tab-Leiste (Pause, Hauptknopf, Eingabe) */
.dock { position: fixed; z-index: 19; left: 0; right: 0; margin: 0 auto; max-width: 430px; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.dock-solid { background: var(--surface); border-top: 1px solid var(--line); }

/* Prototyp-Leiste (nicht Teil des Designs) */
.proto-band { position: fixed; z-index: 55; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top, 0px) + 52px); background: var(--bg); pointer-events: none; }
.proto { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 16px); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--proto-bg); color: var(--proto-fg); font: 600 13px/1 var(--font); box-shadow: 0 6px 24px rgba(0, 0, 0, .22); white-space: nowrap; }
.proto button { min-height: 36px; min-width: 36px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.proto button:active { background: rgba(128, 128, 128, .3); }
.proto .ic { width: 16px; height: 16px; vertical-align: 0; }
.proto .ptag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; padding: 0 4px 0 10px; }
.proto .psep { width: 1px; height: 20px; background: currentColor; opacity: .2; margin: 0 2px; }
.proto .pv { min-width: 108px; }
@media (max-width: 400px) { .proto .ptag { display: none; } }
.proto-note { border: 1px dashed var(--text-3); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 18px; color: var(--text-2); }

/* Fenster, Menü von unten, Rückfrage, Meldung, Erklärung */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); animation: fade .2s; }
.sheet { position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 430px; max-height: 88vh; overflow-y: auto; background: var(--sheet-bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: var(--sheet-shadow); display: flex; flex-direction: column; gap: 16px; animation: up .28s cubic-bezier(.2, .8, .2, 1); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); margin: 0 auto -4px; flex: none; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.sheet .list { background: var(--surface-2); }
.dialog { position: fixed; z-index: 71; left: 0; right: 0; top: 50%; margin: 0 auto; width: min(320px, calc(100% - 48px)); transform: translateY(-50%); background: var(--sheet-bg); border-radius: var(--r-dialog); padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 8px; text-align: center; animation: pop .2s; }
.dialog .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.toast { position: fixed; z-index: 90; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: var(--fs-sub); line-height: var(--lh-sub); font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); animation: drop .25s; }
.pop-scrim { position: fixed; inset: 0; z-index: 80; }
.pop { position: fixed; z-index: 81; width: 264px; padding: 12px 14px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: var(--fs-sub); line-height: var(--lh-sub); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); animation: pop .15s; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { opacity: 0; scale: .96; } }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Diagramme: ein Stil für alle – Balken und Linie, 3 Gitterlinien, Achse rechts, aktuell = Akzent, Rest grau */
.ch { display: block; width: 100%; height: auto; overflow: visible; }
.ch .gl { stroke: var(--grid); stroke-width: 1; }
.ch .ax { fill: var(--text-3); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.ch .b { fill: var(--chart-muted); }
.ch .b-cur { fill: var(--accent); }
.ch .b-run { fill: var(--accent); opacity: .3; }
.ch .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch .ln-m { fill: none; stroke: var(--chart-muted); stroke-width: 2; stroke-linejoin: round; }
.ch .ar { fill: var(--accent); opacity: .1; }
.ch .dot { fill: var(--chart-muted); }
.ch .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ch .ref { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.ch .refl { fill: var(--text-2); font-size: 11px; font-weight: 600; font-family: var(--font); }
.hm .h0 { fill: var(--fill); } .hm .h1 { fill: var(--accent); opacity: .3; } .hm .h2 { fill: var(--accent); opacity: .6; } .hm .h3 { fill: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Trainio-Score: Körperbereiche (Platzhalter, Gestaltung klärt Ticket 10) */
.ar-bar { display: block; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.ar-bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.ar-bar > i.lo { background: var(--warn); }

/* ===== A „Listen“ ===== */
.ph { display: flex; flex-direction: column; gap: 2px; }
.ph-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sc-a { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.sc-a-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 128px; flex: none; }
.areas-a { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 28px; align-items: center; gap: 8px 12px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.areas-a .num { text-align: right; }
.parts-a { display: grid; gap: 8px; }
.parts-a .prow { display: flex; justify-content: space-between; gap: 12px; }
.utabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; margin: 4px -16px 0; padding: 0 16px; border-bottom: 1px solid var(--line); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { min-height: 44px; font-size: var(--fs-sub); font-weight: 600; color: var(--text-2); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }

/* Regelmäßigkeit: 52 Wochen × 7 Tage, aktiv seit Anfang September (Mo/Mi/Fr, manchmal Sa Cardio) */
const HEAT = Array.from({ length: 52 }, (_, w) => Array.from({ length: 7 }, (_, d) => {
  if (w === 51) return d > 3 ? -1 : d === 0 ? 2 : 0;
  if (w < 41) return 0;
  if (d === 0 || d === 2 || d === 4) return 1 + ((w * 7 + d * 3) % 3);
  if (d === 5 && w % 2) return 1;
  return 0;
}));

/* ---------- Laufendes Workout ---------- */
const e1 = (kg, r) => kg * (1 + r / 30);
function newWorkout(done) {
  const mk = (name, meta, rest, step, best, rows) => ({ name, meta, rest, step, best, sets: rows.map(([kg, r, pkg, pr]) => ({ kg, r, rpe: null, pkg, pr, done: false })) });
  const w = { name: 'Pull', t0: Date.now() - (done ? 861000 : 0), running: true, rest: null, prs: [], ex: [
    mk('Kreuzheben', 'Langhantel · Unterer Rücken, Gesäß', 180, 2.5, 160.5, [[137.5, 5, 137.5, 5], [137.5, 5, 137.5, 5], [137.5, 5, 137.5, 4]]),
    mk('Klimmzüge', 'Zusatzgewicht · Rücken, Bizeps', 120, 2.5, 12.7, [[10, 8, 10, 8], [10, 8, 10, 8], [10, 7, 10, 7]]),
    mk('Rudern vorgebeugt', 'Langhantel · Rücken', 120, 2.5, 93.4, [[70, 10, 70, 10], [70, 10, 70, 10], [70, 10, 70, 9]]),
    mk('Latzug eng', 'Kabelzug · Rücken', 90, 2.5, 80.5, [[60, 12, 57.5, 12], [60, 12, 57.5, 12], [60, 12, 57.5, 11]]),
    mk('Bizepscurls', 'Kurzhanteln · Bizeps', 60, 1, 18.7, [[14, 12, 14, 10], [14, 12, 14, 10], [14, 12, 14, 10]])
  ] };
  let k = done;
  for (const e of w.ex) for (const s of e.sets) if (k > 0) { s.done = true; s.rpe = s === e.sets[0] ? 8 : 8.5; k--; }
  w.cur = nextOpen(w);
  return w;
}
function nextOpen(w, from) {
  const all = [];
  w.ex.forEach((e, ei) => e.sets.forEach((s, si) => all.push([ei, si, s])));
  const start = from ? all.findIndex(([ei, si]) => ei === from.e && si === from.s) : 0;
  const hit = all.slice(Math.max(0, start)).find(x => !x[2].done) || all.find(x => !x[2].done);
  return hit ? { e: hit[0], s: hit[1] } : null;
}
const doneSets = () => W.ex.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
const allSets = () => W.ex.reduce((a, e) => a + e.sets.length, 0);

const elapsed = () => (Date.now() - W.t0) / 1000;

/* ---------- Diagramme ---------- */
function niceStep(range, n = 2) { const raw = range / n || 1, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart({ vals, labels = [], w = 326, h = 140, running = -1, fmt = v => nf(v), avg = null }) {
  const n = vals.length, axW = 28, top = 8, bot = labels.length ? 20 : 4, cw = w - axW, ch = h - top - bot;
  const mx = Math.max(...vals, avg || 0, 1), st = niceStep(mx), ymax = Math.ceil(mx / st) * st;
  const y = v => top + ch * (1 - v / ymax);
  let s = '';
  for (let v = 0; v <= ymax + 1e-9; v += st) s += `<line class="gl" x1="0" x2="${cw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${w}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  const slot = cw / n, bw = Math.min(26, slot * .62), last = running === n - 1 ? n - 2 : n - 1;
  vals.forEach((v, i) => {
    const x = i * slot + (slot - bw) / 2, hh = v ? Math.max(2, ch * v / ymax) : 0;
    s += `<rect class="${i === running ? 'b-run' : i === last ? 'b-cur' : 'b'}" x="${x.toFixed(1)}" y="${(top + ch - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2"/>`;
    if (labels[i]) s += `<text class="ax" x="${(x + bw / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle">${labels[i]}</text>`;
  });
  if (avg != null) s += `<line class="ref" x1="0" x2="${cw}" y1="${y(avg)}" y2="${y(avg)}"/>`;   // Ø steht im Titel der Karte
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Balkendiagramm">${s}</svg>`;
}
function lineChart({ vals, w = 326, h = 130, yMin = 0, yMax = 100, step = 50, dots = null, ref = null, labels = null }) {
  const axW = 28, top = 8, bot = labels ? 20 : 4, cw = w - axW - 6, ch = h - top - bot, n = vals.length;
  const x = i => 3 + (n === 1 ? cw / 2 : i * cw / (n - 1)), y = v => top + ch * (1 - (v - yMin) / (yMax - yMin));
  let s = '';
  for (let v = yMin; v <= yMax + 1e-9; v += step) s += `<line class="gl" x1="0" x2="${cw + 6}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${w}" y="${y(v) + 4}" text-anchor="end">${nf(v)}</text>`;
  if (ref) s += `<line class="ref" x1="0" x2="${cw + 6}" y1="${y(ref[0])}" y2="${y(ref[0])}"/><text class="refl" x="2" y="${y(ref[0]) - 5}">${ref[1]}</text>`;
  if (dots) dots.forEach((v, i) => { s += `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5"/>`; });
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  s += `<polygon class="ar" points="${x(0).toFixed(1)},${y(yMin)} ${pts} ${x(n - 1).toFixed(1)},${y(yMin)}"/><polyline class="ln" points="${pts}"/><circle class="end" cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1]).toFixed(1)}" r="4"/>`;
  if (labels) s += `<text class="ax" x="${x(0)}" y="${h - 4}">${labels[0]}</text><text class="ax" x="${x(n - 1)}" y="${h - 4}" text-anchor="end">${labels[1]}</text>`;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Liniendiagramm">${s}</svg>`;
}
function spark(vals, w = 120, h = 40, yMin = null, yMax = null) {
  const lo = yMin ?? Math.min(...vals), hi = yMax ?? Math.max(...vals), n = vals.length;
  const x = i => 4 + i * (w - 8) / (n - 1), y = v => 4 + (h - 8) * (1 - (v - lo) / ((hi - lo) || 1));
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline class="ln" points="${pts}"/><circle class="end" cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1]).toFixed(1)}" r="3.5"/></svg>`;
}
function heatmap(w = 326) {
  const gap = 1.2, cell = (w - 51 * gap) / 52, h = 7 * cell + 6 * gap;
  let s = '';
  HEAT.forEach((col, wi) => col.forEach((lv, d) => { if (lv >= 0) s += `<rect class="h${lv}" x="${(wi * (cell + gap)).toFixed(2)}" y="${(d * (cell + gap)).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" rx="1.2"/>`; }));
  return `<svg class="ch hm" viewBox="0 0 ${w} ${h.toFixed(1)}" role="img" aria-label="Trainingstage der letzten 52 Wochen">${s}</svg>`;
}

    ${[['t-title', 'Seitentitel'], ['t-head', 'Abschnitt'], ['t-body', 'Text und Zeilen'], ['t-sub', 'Nebenzeile'], ['t-cap', 'Beschriftung'], ['n-num', '4.960 kg'], ['hero-num', '78']].map(([c, t]) => `<div class="ts-row"><span class="${c}">${t}</span><span class="m" data-m="${c}"></span></div>`).join('')}
  </div><p class="t-sub c2">Systemschrift (auf dem iPhone SF Pro). Gewichte nur 400, 600, 700. Rangfolge über Gewicht und Farbe, nicht über Zwischengrößen.</p></section>
  <section class="parts-sec"><h2 class="t-head">Raster und Ecken</h2><div class="card" style="gap:6px">${[4, 8, 12, 16, 24, 32, 48].map(v => `<div class="sp-row"><span class="num">${v} px</span><i style="width:${v * 4}px"></i></div>`).join('')}</div>
    <div class="rad-row">${[['Karte', 'var(--r-card)'], ['Eingabe', 'var(--r-ctl)'], ['Knopf', 'var(--r-btn)'], ['Fenster', 'var(--r-sheet) var(--r-sheet) 0 0']].map(([l, r]) => `<div style="border-radius:${r}">${l}</div>`).join('')}</div></section>
  <section class="parts-sec"><h2 class="t-head">Farben</h2><div class="sw-grid">
    ${[['--bg', 'Hintergrund'], ['--surface', 'Fläche'], ['--fill', 'Füllung'], ['--text', 'Text'], ['--text-2', 'Text 2'], ['--text-3', 'Text 3'], ['--accent', 'Akzent (Platzhalter)'], ['--good', 'Gut'], ['--warn', 'Achtung'], ['--bad', 'Schlecht']].map(([v, l]) => `<div class="sw"><i style="background:var(${v})"></i><span>${l}</span></div>`).join('')}
  </div><p class="t-sub c2">Der Akzent nur für Hauptaktion, aktuellen Wert und Auswahl. Gut, Achtung und Schlecht bedeuten in jedem Design dasselbe.</p></section>
  <section class="parts-sec"><h2 class="t-head">Knöpfe</h2><div class="demo-row">
    <button class="btn btn-primary" data-act="toast" data-k="Hauptaktion">Hauptaktion</button><button class="btn btn-secondary" data-act="toast" data-k="Zweitaktion">Zweitaktion</button><button class="btn btn-text" data-act="toast" data-k="Textknopf">Textknopf</button><button class="btn btn-danger" data-act="toast" data-k="Löschen">Löschen</button></div>
    <p class="t-sub c2">Höchstens ein Hauptknopf je Ansicht. Eine Aktion hat überall dasselbe Wort, z. B. immer „Beenden“.</p></section>
  <section class="parts-sec"><h2 class="t-head">Eingaben</h2>
    <div class="seg">${PERIODS.map(([k]) => `<button class="${S.period === k ? 'on' : ''}" data-act="period" data-val="${k}">${k}</button>`).join('')}</div>
    <div class="stepper" style="max-width:200px"><button data-act="toast" data-k="−2,5 kg" aria-label="Weniger">${ic('minus')}</button><div class="val num">82,5<small>kg</small></div><button data-act="toast" data-k="+2,5 kg" aria-label="Mehr">${ic('plus')}</button></div>
    <div class="chips">${AREAS.slice(0, 4).map((a, i) => `<button class="chip ${i === 0 ? 'on' : ''}">${a}</button>`).join('')}</div></section>
  <section class="parts-sec"><h2 class="t-head">Liste, Karte, Kachel</h2>
    <div class="list"><div class="row"><span class="row-ic">${ic('flame')}</span><div class="row-main t-body">Listenzeile</div><span class="row-val t-body fw6 num">11 Wochen</span></div><button class="row" data-act="toast" data-k="Zeile angetippt"><div class="row-main t-body">Zeile mit Pfeil</div><span class="chev">${ic('chevR')}</span></button></div>
    <div class="tiles">${tile('bolt', 'Kachel', U('4.960', 'kg'), `<span class="t-cap">${trend('up', '15 %')}</span>`)}<div class="card"><span class="lbl">Karte</span><span class="t-sub c2">In sich geschlossen, eine Aussage.</span></div></div>
    <p class="t-sub c2">Listen für Gleichartiges, Karten für eine abgeschlossene Aussage. Nie eine Karte in einer Karte.</p></section>
  <section class="parts-sec"><h2 class="t-head">Diagramme</h2><div class="card">
    <span class="lbl">Workouts pro Woche</span>${barChart({ vals: D.perWeek, labels: D.weekLbl, running: 10, avg: 3.2, h: 110 })}
    <span class="lbl">Trainio-Score</span>${lineChart({ vals: D.trend, h: 100, ref: [85, 'erwartet'] })}</div>
    <p class="t-sub c2">Aktueller Wert im Akzent, der Rest grau, die laufende Woche blass. Gerade Linien, keine Glättung. Achsen ehrlich, beim Score immer 0 bis 100.</p></section>
  <section class="parts-sec"><h2 class="t-head">Fenster und Meldungen</h2><div class="demo-row">
    <button class="btn btn-secondary btn-sm" data-act="sheet" data-k="start">Menü von unten</button><button class="btn btn-secondary btn-sm" data-act="finish">Rückfrage</button><button class="btn btn-secondary btn-sm" data-act="toast" data-k="Neuer Rekord · Latzug eng 60 kg × 12" data-i="trophy">Meldung</button><button class="btn btn-secondary btn-sm" data-act="sheet" data-k="detail">Fenster</button><button class="btn btn-secondary btn-sm" data-act="info" data-k="demo">Erklärung (i)</button></div></section>
</main>`;

/* ---------- Ebenen: Menü von unten, Fenster, Rückfrage, Meldung, Erklärung ---------- */
function layerHtml() {
  const L = S.layer;
  if (!L) return '';
  if (L.type === 'pop') return `<div class="pop-scrim" data-act="close"></div><div class="pop" role="tooltip" style="left:${L.x}px;top:${L.y}px">${INFO[L.k]}</div>`;
  if (L.type === 'dialog') return `<div class="scrim" data-act="close"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 class="t-head" id="dlg-t">Workout beenden?</h2><p class="t-sub c2">${W.running ? `Noch ${allSets() - doneSets()} Sätze offen. Gespeichert werden nur erledigte Sätze.` : 'So sieht eine Rückfrage aus.'}</p>
    <div class="btns"><button class="btn btn-primary btn-block" data-act="${W.running ? 'finishOk' : 'close'}">Beenden und speichern</button><button class="btn btn-secondary btn-block" data-act="close">Weiter trainieren</button></div></div>`;
  const sheet = (inner, label) => `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div>${inner}</div>`;
  if (L.k === 'start') return sheet(`<div class="sheet-h"><h2 class="t-head">Workout starten</h2><button class="ic-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>
    <button class="btn btn-primary btn-lg btn-block btn-col" data-act="startW"><span>Pull</span><small>Heute dran · 5 Übungen · etwa 55 min</small></button>
    <div class="list">${[['Push', 'Zuletzt Mo, 9. Nov'], ['Beine', 'Zuletzt Fr, 6. Nov'], ['Leeres Workout', 'Übungen selbst wählen'], ['Cardio', 'Laufen, Rad, Rudern …']].map(([n, m]) => `<button class="row" data-act="startW"><div class="row-main"><div class="t-body">${n}</div><div class="t-cap c2">${m}</div></div><span class="chev">${ic('chevR')}</span></button>`).join('')}</div>`, 'Workout starten');
  if (L.k === 'period') return sheet(`<div class="sheet-h"><h2 class="t-head">Zeitraum</h2><button class="ic-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>
    <div class="list">${PERIODS.map(([k, l]) => `<button class="row" data-act="setPeriod" data-val="${k}"><div class="row-main t-body">${l}</div>${S.period === k ? `<span style="color:var(--accent)">${ic('check')}</span>` : ''}</button>`).join('')}<button class="row" data-act="toast" data-k="Eigener Zeitraum: nicht Teil des Prototyps"><div class="row-main t-body">Eigener Zeitraum …</div><span class="chev">${ic('chevR')}</span></button></div>
    <div class="sheet-h"><span class="t-body fw6">Einheit</span><div class="seg" style="width:120px">${['kg', 'lb'].map(u => `<button class="${S.unit === u ? 'on' : ''}" data-act="unit" data-val="${u}">${u}</button>`).join('')}</div></div>`, 'Zeitraum');
  if (L.k === 'areas') return sheet(`<div class="sheet-h"><h2 class="t-head">Bereich</h2><button class="ic-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>
    <div class="list">${AREAS.map(a => `<button class="row" data-act="setArea" data-val="${a}"><div class="row-main t-body">${a}</div>${S.area === a ? `<span style="color:var(--accent)">${ic('check')}</span>` : ''}</button>`).join('')}</div>`, 'Bereich');
  if (L.k === 'detail') return sheet(`<div class="sheet-h"><h2 class="t-head">Kreuzheben</h2><button class="ic-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>
    <div class="n-num">${U('160,4', 'kg')}</div><p class="t-sub c2" style="margin-top:-10px">Geschätztes 1RM, bester Wert</p>
    ${lineChart({ vals: [148, 150, 151, 151, 153, 155, 156, 158, 160.4], yMin: 140, yMax: 170, step: 10, h: 110, labels: ['Sep.', 'heute'] })}
    <div class="list">${[['Bester Satz', '137,5 kg × 5'], ['Zuletzt', 'Mi, 4. Nov'], ['Sessions', '10']].map(([l, v]) => `<div class="row"><div class="row-main t-body">${l}</div><span class="row-val t-body c2 num">${v}</span></div>`).join('')}</div>
    <button class="btn btn-secondary btn-block" data-act="close">Schließen</button>`, 'Übung');
  if (L.k === 'summary') { const sm = L.sum; return sheet(`<div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
      <p class="t-sub c2 fw6">Workout gespeichert</p><h2 class="t-title">${W.name}</h2>${ring(sm.score)}<p class="t-cap c2 fw6">Workout-Score</p>
      <p class="t-body">${sm.prs.length ? 'Neue Rekorde und mehr Wiederholungen als letztes Mal.' : 'Fast genau wie letztes Mal.'}</p></div>
    <div class="list">${[['Dauer', `${Math.max(1, Math.round(sm.secs / 60))} min`], ['Sätze', `${sm.sets} von ${allSets()}`], ['Volumen', `${nf(sm.vol)} kg`]].map(([l, v]) => `<div class="row"><div class="row-main t-body">${l}</div><span class="row-val t-body fw6 num">${v}</span></div>`).join('')}</div>
    ${sm.prs.length ? `<div class="list">${sm.prs.map(p => `<div class="row"><span class="row-ic">${ic('trophy')}</span><div class="row-main t-body">${p}</div></div>`).join('')}</div>` : ''}
    <button class="btn btn-primary btn-block" data-act="summaryDone">Schließen</button>`, 'Workout gespeichert'); }
  return '';
}
function renderLayer() {
  $('#layer').innerHTML = layerHtml() + (S.toast ? `<div class="toast" role="status">${S.toast.i ? ic(S.toast.i) : ''}${S.toast.t}</div>` : '');
}
function toast(t, i) {
  S.toast = { t, i }; renderLayer();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderLayer(); }, 2600);
}

/* ---------- Darstellung ---------- */
const TABS = [['start', 'home', 'Start'], ['training', 'dumbbell', 'Training'], ['uebungen', 'book', 'Übungen'], ['fortschritt', 'chart', 'Fortschritt'], ['mehr', 'grid', 'Mehr']];
const tabbar = () => `<nav class="tabbar" aria-label="Tabs">${TABS.map(([k, i, l]) => `<button class="tab ${S.screen === k ? 'on' : ''}" data-act="nav" data-to="${k}" ${S.screen === k ? 'aria-current="page"' : ''}>${S.v === 'c' ? '' : ic(i)}<span>${l}</span>${k === 'training' && W.running && S.screen !== 'training' ? '<i class="tdot"></i>' : ''}</button>`).join('')}</nav>`;
const V = { a: A, b: B, c: C };
function render() {
  document.body.dataset.v = S.v;
  const fn = S.screen === 'bausteine' ? parts : V[S.v][S.screen] || placeholder;
  $('#app').innerHTML = fn() + tabbar();
  $('#pv').textContent = `${S.v.toUpperCase()} · ${VARS[S.v]}`;
  $('#pp').style.opacity = S.screen === 'bausteine' ? '1' : '.75';
  document.querySelectorAll('[data-m]').forEach(el => { const t = el.parentElement.querySelector('.' + el.dataset.m), cs = getComputedStyle(t); el.textContent = `${parseFloat(cs.fontSize)} px · ${cs.fontWeight}`; });
  renderLayer();
}
function go(screen) {
  S.screen = screen; S.layer = null;
  const h = `#${S.v}-${S.screen}`;
  try { history.replaceState(null, '', h); } catch (e) { /* Rahmen erlaubt es nicht – egal */ }
  render(); window.scrollTo(0, 0);
}
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  $('#pt').innerHTML = `${ic(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto')}${{ auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[S.theme]}`;
  try { localStorage.setItem('trainio-proto-theme', S.theme); } catch (e) { /* ohne Speicher */ }
}

/* ---------- Aktionen ---------- */
function adjustSet(field, d) {
  const s = curSet(); if (!s) return;
  const ex = W.ex[W.cur.e];
  if (field === 'kg') {
    const old = s.kg; s.kg = Math.max(0, Math.round((s.kg + d * ex.step) * 100) / 100);
    ex.sets.forEach((x, i) => { if (i > W.cur.s && !x.done && x.kg === old) x.kg = s.kg; });   // folgende Sätze übernehmen
  } else s.r = Math.max(0, s.r + d);
  render();
}
function complete(e, s) {
  const ex = W.ex[e], st = ex.sets[s];
  if (st.done) return;
  st.done = true;
  const v = e1(st.kg, st.r);
  if (v > ex.best + .05) { ex.best = v; W.prs.push(`${ex.name} ${w1(st.kg)} kg × ${st.r}`); toast(`Neuer Rekord · ${ex.name} ${w1(st.kg)} kg × ${st.r}`, 'trophy'); }
  W.rest = { end: Date.now() + ex.rest * 1000, total: ex.rest, ex: ex.name };
  W.cur = nextOpen(W, { e, s });
  W.view = undefined;
  render();
}
const ACT = {
  nav: d => go(d.to),
  close: () => { S.layer = null; renderLayer(); },
  info: (d, el) => {
    const r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth, x = Math.min(Math.max(12, r.right - 264), vw - 276);
    const below = r.bottom + 120 < window.innerHeight;
    S.layer = { type: 'pop', k: d.k, x, y: below ? r.bottom + 6 : Math.max(60, r.top - 96) }; renderLayer();
  },
  sheet: d => { S.layer = { type: 'sheet', k: d.k }; renderLayer(); },
  toast: (d, el) => toast(d.k, el.dataset.i),
  startW: () => { W = newWorkout(0); S.layer = null; go('training'); },
  sel: d => {
    const e = +d.e, s = +d.s, st = W.ex[e].sets[s];
    if (st.done) { st.done = false; }
    W.cur = { e, s }; W.view = undefined; render();
  },
  tick: d => { const e = +d.e, s = +d.s, st = W.ex[e].sets[s]; if (st.done) { st.done = false; W.cur = { e, s }; render(); } else { W.cur = { e, s }; complete(e, s); } },
  kg: d => adjustSet('kg', +d.d),
  reps: d => adjustSet('reps', +d.d),
  rpe: d => { const s = curSet(); if (s) { s.rpe = d.val ? +d.val : null; render(); } },
  done: () => { if (W.cur) complete(W.cur.e, W.cur.s); },
  restAdj: d => { if (W.rest) { W.rest.end = Math.max(Date.now() + 1000, W.rest.end + d.d * 1000); W.rest.total = Math.max(W.rest.total, restLeft()); tick(); } },
  restSkip: () => { W.rest = null; render(); },
  exGo: d => {
    const cur = W.view ?? (W.cur ? W.cur.e : 0), ne = Math.min(W.ex.length - 1, Math.max(0, cur + +d.d)), si = W.ex[ne].sets.findIndex(s => !s.done);
    if (si >= 0) { W.cur = { e: ne, s: si }; W.view = undefined; } else W.view = ne;
    render(); window.scrollTo(0, 0);
  },
  finish: () => { S.layer = { type: 'dialog' }; renderLayer(); },
  finishOk: () => {
    const sets = doneSets(), sum = { score: Math.min(100, Math.round(62 + 22 * sets / allSets() + 4 * W.prs.length)), prs: W.prs.slice(), secs: elapsed(), sets, vol: volume() };
    W.rest = null; S.layer = { type: 'sheet', k: 'summary', sum }; render();
  },
  summaryDone: () => { W.running = false; S.layer = null; go('start'); toast('Workout gespeichert', 'check'); },
  period: d => { S.period = d.val; render(); },
  setPeriod: d => { S.period = d.val; S.layer = null; render(); },
  unit: d => { S.unit = d.val; render(); },
  area: d => { S.area = d.val; render(); if (d.val !== 'Übersicht') toast(`${d.val}: nicht Teil des Prototyps`); },
  setArea: d => { S.area = d.val; S.layer = null; render(); if (d.val !== 'Übersicht') toast(`${d.val}: nicht Teil des Prototyps`); }
};
document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p) {
    const ks = Object.keys(VARS), i = ks.indexOf(S.v);
    if (p.dataset.p === 'prev' || p.dataset.p === 'next') { S.v = ks[(i + (p.dataset.p === 'next' ? 1 : ks.length - 1)) % ks.length]; go(S.screen); }
    if (p.dataset.p === 'theme') { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); }
    if (p.dataset.p === 'parts') go(S.screen === 'bausteine' ? 'start' : 'bausteine');
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  e.stopPropagation();
  (ACT[a.dataset.act] || (() => {}))(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.layer) { S.layer = null; renderLayer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  const ks = Object.keys(VARS), i = ks.indexOf(S.v);
  S.v = ks[(i + (e.key === 'ArrowRight' ? 1 : ks.length - 1)) % ks.length]; go(S.screen);
});
function readHash() {
  const m = /^#([abc])-(start|training|fortschritt|uebungen|mehr|bausteine)$/.exec(location.hash);
  if (m) { S.v = m[1]; S.screen = m[2]; return true; }
  return false;
}
window.addEventListener('hashchange', () => { if (readHash()) { S.layer = null; render(); } });
/* Uhr und Pause aktualisieren, ohne alles neu zu zeichnen */
function tick() {
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = mmss(elapsed()); });
  if (!W.rest) return;
  const left = restLeft();
  if (left <= 0) { W.rest = null; render(); return; }
  document.querySelectorAll('[data-rest]').forEach(el => { el.textContent = mmss(left); });
  const r = document.querySelector('[data-restring]');
  if (r) { const c = 2 * Math.PI * 16; r.setAttribute('stroke-dasharray', `${(c * left / W.rest.total).toFixed(1)} ${c.toFixed(1)}`); }
  const b = document.querySelector('[data-restbar]');
  if (b) b.style.width = `${left / W.rest.total * 100}%`;
}
setInterval(tick, 1000);
try { S.theme = localStorage.getItem('trainio-proto-theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
readHash();
applyTheme();
render();
</script>
