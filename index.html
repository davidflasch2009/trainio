function exChartKey(t, id) {
  const k = UI.exChart;
  if (t === 'cardio') { const info = cardioInfo(Ex.get(id)); const ok = ['cdur', ...(info.mode === 'dist' ? ['ckm', 'ckmh'] : []), ...(info.lvl ? ['clvl'] : [])]; return ok.includes(k) ? k : 'cdur'; }
  if (t === 'kg') return ['e1rm', 'vol', 'maxw'].includes(k) ? k : 'e1rm';
  return ['reps', 'sets'].includes(k) ? k : 'reps';
}
/** 1RM-, Volumen- und Max-Gewicht-Verlauf einer Übung (§8.3) */
function exerciseChart(id, key) {
  const ss = Analytics.sessionsOf(id);
  if (ss.length < 1) return null;
  const t = Ex.type(Ex.get(id));
  const map = {
    e1rm: ['Geschätztes 1RM', s => toU(s.best), v => fmtW(fromU(v))],
    vol: ['Volumen', s => toU(s.vol), v => fmtTon(fromU(v))],
    maxw: ['Max-Gewicht', s => toU(s.maxW), v => fmtW(fromU(v))],
    reps: [t === 'sec' ? 'Längster Satz (s)' : 'Max Wdh.', s => t === 'sec' ? maxOf(s.list, x => x.sec) : maxOf(s.list, x => x.r), v => t === 'sec' ? fmtClock(v) : nf(v, 0)],
    sets: ['Sätze', s => s.sets, v => nf(v, 0)],
    cdur: ['Dauer (min)', s => round(s.secs / 60, 1), v => nf(v, 0) + ' min'],
    ckm: ['Distanz (km)', s => round(s.km, 2), v => fmtKm(v)],
    ckmh: ['Tempo (km/h)', s => cardioKmhValid(s.km, s.secs) ? round(s.kmh, 2) : 0, v => fmtKmh(v)],
    clvl: [(cardioInfo(Ex.get(id)).lvl || 'Stufe') + ' (max)', s => s.lvl || 0, v => nf(v, 1)]
  };
  const [label, f, fmt] = map[key] || map.e1rm;
  const data = ss.map(s => ({ x: s.dn, y: f(s) })).filter(p => p.y > 0);
  if (!data.length) return null;
  return timeLine([lineDS(label, data, chartColors().accent)], { tooltipFmt: v => fmt(v) });
}

/* ---------- Übung anlegen / bearbeiten ---------- */
function openExerciseForm(ex, preset = {}) {
  return new Promise(resolve => {
    const d = ex ? JSON.parse(JSON.stringify(ex)) : { name: preset.name || '', category: 'Push', muscleGroups: [], equipment: 'Langhantel', defaultUnit: 'kg', notes: '', aliases: [] };
    let result = null;
    const m = Modal.open({
      title: ex ? 'Übung bearbeiten' : 'Neue Übung', size: 'lg',
      foot: `<button class="btn btn-secondary" data-x="cancel">Abbrechen</button><button class="btn btn-primary" data-x="save">Speichern</button>`,
      onClose: () => resolve(result)
    });
    const draw = () => m.setBody(`
      <div class="stack">
        <label class="field"><span>Name *</span><input class="input" data-f="name" value="${esc(d.name)}" placeholder="z. B. Schrägbank-Butterfly" autocomplete="off"></label>
        <div class="form-grid">
          <label class="field"><span>Kategorie</span><select class="select" data-f="category">${CATEGORIES.map(c => `<option ${d.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
          <label class="field"><span>Equipment</span><select class="select" data-f="equipment">${uniq([...EQUIPMENT, d.equipment]).map(c => `<option ${d.equipment === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
        </div>
        <div class="field"><span>Erfassung</span>
          <div class="seg">${Object.entries({ kg: 'Gewicht × Wdh.', reps: 'Nur Wdh.', sec: 'Zeit', cardio: 'Cardio' }).map(([k, l]) => `<button data-u="${k}" class="${Ex.type(d) === k ? 'active' : ''}">${l}</button>`).join('')}</div></div>
        ${Ex.type(d) === 'cardio' ? `<div class="field"><span>Cardio-Felder</span>
          <div class="seg">${Object.entries({ dist: 'Dauer + Distanz', level: 'Dauer + Stufe', time: 'Nur Dauer' }).map(([k, l]) => `<button data-cm="${k}" class="${cardioInfo(d).mode === k ? 'active' : ''}">${l}</button>`).join('')}</div></div>` : ''}
        <div class="list"><div class="set-line"><div class="sl-main"><div class="sl-title">Einseitig (links & rechts)</div><div class="sl-sub">Wdh. für jede Seite getrennt erfassen – z. B. Bulgarian Split Squat, einarmiges Rudern</div></div>
          <label class="switch"><input type="checkbox" data-uni ${Ex.isUni(d) ? 'checked' : ''} aria-label="Einseitig"><span></span></label></div></div>
        <div class="field"><span>Muskelgruppen</span>
          <div class="muscle-pick">${[...MUSCLES, 'Ausdauer'].map(mg => `<button class="chip soft ${d.muscleGroups.includes(mg) ? 'active' : ''}" data-m="${esc(mg)}">${esc(mg)}</button>`).join('')}</div></div>
        <label class="field"><span>Technik-Notiz</span><textarea class="textarea" data-f="notes" placeholder="1 Satz Technik-Tipp">${esc(d.notes || '')}</textarea></label>
        <label class="field"><span>Alternative Namen (Komma-getrennt)</span><input class="input" data-f="aliases" value="${esc((d.aliases || []).join(', '))}" placeholder="z. B. englischer Name aus Arrow"></label>
      </div>`);
    draw();
    m.body.addEventListener('input', e => {
      const f = e.target.dataset.f;
      if (!f) return;
      if (f === 'aliases') d.aliases = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
      else d[f] = e.target.value;
    });
    m.body.addEventListener('change', e => { if (e.target.matches('[data-uni]')) { d.unilateral = e.target.checked; return; } const f = e.target.dataset.f; if (f) d[f] = e.target.value; });
    m.el.addEventListener('click', e => {
      const u = e.target.closest('[data-u]');
      if (u) { d.defaultUnit = u.dataset.u; if (u.dataset.u === 'cardio') d.category = 'Cardio'; else if (d.category === 'Cardio' && Ex.type(d) === 'cardio') d.category = 'Full Body'; draw(); return; }
      const cm = e.target.closest('[data-cm]');
      if (cm) { d.cardioMode = cm.dataset.cm; draw(); return; }
      const mg = e.target.closest('[data-m]');
      if (mg) {
        const v = mg.dataset.m;
        d.muscleGroups = d.muscleGroups.includes(v) ? d.muscleGroups.filter(x => x !== v) : [...d.muscleGroups, v];
        mg.classList.toggle('active');
        return;
      }
      const b = e.target.closest('[data-x]');
      if (!b) return;
      if (b.dataset.x === 'cancel') return m.close();
      const name = d.name.trim();
      if (!name) return toast('Bitte einen Namen eingeben', 'warn');
      const dup = Store.all('exercises').find(x => x.id !== (ex && ex.id) && norm(x.name) === norm(name));
      if (dup) return toast(`„${dup.name}" gibt es schon`, 'warn');
      const id = ex ? ex.id : autoId();
      Store.put('exercises', id, {
        name, category: d.category, muscleGroups: d.muscleGroups, equipment: d.equipment, defaultUnit: d.defaultUnit || 'kg', ...(d.cardioMode ? { cardioMode: d.cardioMode } : {}), ...(d.myNote ? { myNote: d.myNote } : {}),
        notes: (d.notes || '').trim(), aliases: d.aliases || [], isCustom: ex ? !!ex.isCustom : true, unilateral: Ex.isUni(d),
        createdAt: ex ? ex.createdAt || Date.now() : Date.now(), updatedAt: Date.now()
      }, { replace: true });
      result = id;
      toast(ex ? 'Übung gespeichert' : `„${name}" angelegt`, 'success');
      m.close();
    });
  });
}

   13. Charts (Chart.js v4, lazy geladen)

function chartColors() {
  return {
    accent: cssVar('--accent'), text: cssVar('--text'), dim: cssVar('--text-dim'), faint: cssVar('--text-faint'),
    grid: cssVar('--grid'), surface: cssVar('--surface'), danger: cssVar('--danger'), warning: cssVar('--warning'),

const Charts = (() => {

    C.defaults.font.family = getComputedStyle(document.body).fontFamily;
    C.defaults.font.size = 11.5;
    C.defaults.color = c.dim;
    C.defaults.borderColor = c.grid;
    C.defaults.maintainAspectRatio = false;
    C.defaults.responsive = true;
    C.defaults.animation.duration = S().motion === 'full' ? 350 : 0;
    const tt = C.defaults.plugins.tooltip;
    Object.assign(tt, { backgroundColor: cssVar('--surface-3'), titleColor: c.text, bodyColor: c.text, borderColor: cssVar('--border-strong'), borderWidth: 1, padding: 10, cornerRadius: 10, boxPadding: 4, usePointStyle: true });
    Object.assign(C.defaults.plugins.legend.labels, { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 14, color: c.dim });
    Object.assign(C.defaults.elements.point, { radius: 0, hoverRadius: 6, hitRadius: 14 });
    C.defaults.elements.line.borderWidth = 2;
    C.defaults.elements.bar.borderRadius = 4;
    // Re-Theme laufender Charts (Kopie der Liste – mount() entfernt und ergänzt Einträge, sonst Endlosschleife)
    for (const [id, x] of [...inst]) if (x.chart) mount(id, x.factory);
  }
  function mount(id, factory) {
    const cv = document.getElementById('cv-' + id);
    if (!cv) return;
    destroy(id);
    const box = cv.parentElement;
    $$('.chart-empty', box).forEach(n => n.remove());
    if (!window.Chart) {
      box.insertAdjacentHTML('beforeend', `<div class="chart-empty">Diagramme brauchen beim ersten Mal eine Internetverbindung.</div>`);
      return;
    }
    let cfg = null;
    try { cfg = factory(); } catch (e) { console.error('Chart', id, e); }
    if (!cfg) {
      cv.style.display = 'none';
      box.insertAdjacentHTML('beforeend', `<div class="chart-empty">Noch nicht genug Daten im gewählten Zeitraum</div>`);
      inst.set(id, { factory, canvas: cv });
      return;
    }
    cv.style.display = '';
    const chart = new window.Chart(cv.getContext('2d'), cfg);
    inst.set(id, { chart, canvas: cv, factory });
  }
  function destroy(id) { const x = inst.get(id); if (x && x.chart) x.chart.destroy(); inst.delete(id); }
  function destroyIn(root) {
    for (const [id, x] of [...inst]) if (!x.canvas || !x.canvas.isConnected || (root && root.contains(x.canvas))) destroy(id);
  }
  function get(id) { return inst.get(id); }
  return { ensure, applyDefaults, mount, destroy, destroyIn, get };
})();

/* Hilfslinien (MEV/MAV/MRV, Benchmarks) als kleines Inline-Plugin */
const thresholdPlugin = {
  id: 'thresholds',
  afterDatasetsDraw(chart, args, opts) {
    const lines = (opts && opts.lines) || [];
    if (!lines.length) return;
    const { ctx, chartArea: a, scales } = chart;
    const ax = opts.axis === 'x' ? scales.x : scales.y;
    ctx.save();
    ctx.font = '600 10.5px ' + getComputedStyle(document.body).fontFamily;
    for (const l of lines) {
      const p = ax.getPixelForValue(l.value);
      if (!Number.isFinite(p) || (opts.axis === 'x' ? p < a.left || p > a.right : p < a.top || p > a.bottom)) continue;
      ctx.strokeStyle = l.color; ctx.fillStyle = l.color; ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      if (opts.axis === 'x') { ctx.moveTo(p, a.top); ctx.lineTo(p, a.bottom); } else { ctx.moveTo(a.left, p); ctx.lineTo(a.right, p); }
      ctx.stroke();
      ctx.setLineDash([]);
      if (opts.axis === 'x') { ctx.textAlign = 'center'; ctx.fillText(l.label, p, a.top - 5); }
      else { ctx.textAlign = 'left'; ctx.fillText(l.label, a.left + 4, p - 4); }
    }
    ctx.restore();
  }
};

const dnTick = function (v) {
  const span = (this.max - this.min) || 0;
  return span > 420 ? fmtDN(v, { month: 'short', year: '2-digit' }) : fmtDN(v, { day: '2-digit', month: '2-digit' });
};
function lineDS(label, data, color, opts = {}) {
  const c = chartColors();

    label, data, borderColor: color, backgroundColor: alpha(color, .12), fill: true, tension: .3,
    pointRadius: data.length <= 40 ? 4 : 0, pointHoverRadius: 6, pointBackgroundColor: color,
    pointBorderColor: c.surface, pointBorderWidth: 2, borderWidth: 2, spanGaps: true, ...opts
  };
}
/** Achsen-Ticks mit so vielen Nachkommastellen wie die Schrittweite braucht (82,5 statt 83/83/83) */
const yAuto = (suffix = '') => function (v, i, ticks) {
  const step = ticks && ticks.length > 1 ? Math.abs(ticks[1].value - ticks[0].value) : 1;
  return nf(v, step >= 1 ? 0 : step >= 0.1 ? 1 : 2) + suffix;
};
/** Zeitreihe mit linearer X-Achse (Tag-Nummern) – kein Datums-Adapter nötig */
function timeLine(datasets, { tooltipFmt = v => nf(v, 1), yFmt = yAuto(), legend = false, yMin, yMax, thresholds, xMax } = {}) {

function barChart(labels, datasets, { yFmt = v => nf(v, 0), tooltipFmt, horizontal = false, stacked = false, legend = false, thresholds, xMax } = {}) {

const barDS = (label, data, color, opts = {}) => ({ label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 26, categoryPercentage: .8, barPercentage: .9, ...opts });
function donut(labels, data, colors, { tooltipFmt = v => nf(v, 0) } = {}) {

}

ProgressViews.overview = body => {
  const ix = Analytics.cur();

  const cw = weekStartDN(t);
  const volNow = Analytics.volumeBetween(cw, t), volPrev = Analytics.volumeBetween(cw - 7, cw - 7 + (t - cw));
  // 12-Wochen-Minibars
  const weeks12 = Array.from({ length: 12 }, (_, i) => cw - (11 - i) * 7);
  const wCounts = weeks12.map(w => ix.rows.filter(r => r.dn >= w && r.dn < w + 7).length);
  const mxW = Math.max(1, ...wCounts);
  // Trainingstage im Monat
  const now = new Date();
  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
  const daysInMonth = key => new Set(ix.rows.filter(r => r.date.startsWith(key) && !r.cardioOnly).map(r => r.date)).size;
  const curMonth = daysInMonth(monthKey(now.getFullYear(), now.getMonth()));
  const prev6 = Array.from({ length: 6 }, (_, i) => { const d = new Date(now.getFullYear(), now.getMonth() - 1 - i, 1); return daysInMonth(monthKey(d.getFullYear(), d.getMonth())); });
  const avg6 = avg(prev6);
  const monthFrac = now.getDate() / new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const expected = avg6 * monthFrac;
  // Konsistenz
  const goal = weeklyTarget();
  const last28 = ix.rows.filter(r => r.dn > t - 28 && !r.cardioOnly).length;
  const consistency = Math.min(100, last28 / (goal * 4) * 100);
  // Big 3
  const big3 = BIG3.map(b => {
    const ss = b.ids.flatMap(id => ix.sessions[id] || []).sort((a, z) => a.dn - z.dn);
    const recent = ss.filter(s => s.dn > t - 90);
    const val = recent.length ? maxOf(recent, s => s.best) : (ss.length ? maxOf(ss, s => s.best) : null);
    return { ...b, val, old: !recent.length && ss.length, spark: recent.map(s => toU(s.best)) };
  });
  // P/P/L letzte 4 Wochen
  const r4 = ix.rows.filter(r => r.dn > t - 28);
  const catSum = k => sum(r4.map(r => r.cats[k] || 0));
  const ppl = [catSum('Push'), catSum('Pull'), catSum('Legs'), catSum('Core') + catSum('Cardio') + catSum('Full Body')];
  // PRs

function nextPRAttack(ix) {
  const t = todayDN();
  let best = null;
  for (const [exId, ss] of Object.entries(ix.sessions)) {
    if (ss.length < 3 || Ex.type(Ex.get(exId)) !== 'kg') continue;
    const pr = maxOf(ss, s => s.best);
    if (!(pr > 0)) continue;
    const last = ss[ss.length - 1];
    const days = t - last.dn;
    if (days < 1 || days > 120) continue;
    const recent = maxOf(ss.filter(s => s.dn > last.dn - 28), s => s.best);
    const close = recent / pr;
    const score = Math.pow(close, 5) * (Math.min(days, 21) + 2) / 23;
    if (!best || score > best.score) best = { exId, pr, score, lastDn: last.dn };
  }
  if (!best) return null;
  const reps = 3;
  const step = fromU(S().weightSteps);
  const target = best.pr * 1.015;
  const weight = Math.ceil(target / (1 + reps / 30) / step) * step;
  return { ...best, reps, weight };
}
function ghHeatmap(ix) {
  const t = todayDN();
  const ws = weekStartDN(t);
  const start = ws - 52 * 7;
  const byDn = {};
  for (const r of ix.rows) if (r.dn >= start) (byDn[r.dn] || (byDn[r.dn] = [])).push(r);
  const tons = Object.values(byDn).map(rs => sum(rs.map(r => r.ton))).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => tons.length ? tons[Math.min(tons.length - 1, Math.floor(p * tons.length))] : 0;
  const q1 = q(.25), q2 = q(.5), q3 = q(.75);
  const level = v => !v ? 1 : v <= q1 ? 1 : v <= q2 ? 2 : v <= q3 ? 3 : 4;
  const cs = 12, gap = 3, left = 22, top = 16;
  let cells = '', months = '';
  let lastMonth = -1;
  for (let wi = 0; wi <= 52; wi++) {
    const w0 = start + wi * 7;
    const d0 = new Date(w0 * 864e5);
    if (d0.getUTCMonth() !== lastMonth && d0.getUTCDate() <= 7) { months += `<text x="${left + wi * (cs + gap)}" y="10" style="text-anchor:start;font-size:10px" fill="var(--text-faint)">${MONTHS[d0.getUTCMonth()]}</text>`; lastMonth = d0.getUTCMonth(); }
    for (let di = 0; di < 7; di++) {
      const dn = w0 + di;
      if (dn > t) continue;
      const rs = byDn[dn];
      const ton = rs ? sum(rs.map(r => r.ton)) : 0;
      const lv = rs ? level(ton) : 0;
      cells += `<rect x="${left + wi * (cs + gap)}" y="${top + di * (cs + gap)}" width="${cs}" height="${cs}" rx="3" fill="${heatColor(lv)}" ${rs ? `data-act="openWorkout" data-id="${esc(rs[rs.length - 1].id)}" style="cursor:pointer"` : ''}><title>${fmtDN(dn)}${rs ? ': ' + esc(rs.map(r => r.name).join(', ')) + ' · ' + fmtTon(ton) : ''}</title></rect>`;
    }
  }
  const lbl = S().weekStart === 'sunday' ? ['', 'Mo', '', 'Mi', '', 'Fr', ''] : ['Mo', '', 'Mi', '', 'Fr', '', 'So'];
  const W = left + 53 * (cs + gap), H = top + 7 * (cs + gap);
  return `<div class="gh-heat" id="ghHeat"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trainingstage der letzten 52 Wochen">${months}${lbl.map((l, i) => l ? `<text x="0" y="${top + i * (cs + gap) + 10}" style="text-anchor:start;font-size:10px" fill="var(--text-faint)">${l}</text>` : '').join('')}${cells}</svg></div>
    <div class="gh-legend">weniger ${[0, 1, 2, 3, 4].map(l => `<i style="background:${heatColor(l)}"></i>`).join('')} mehr</div>`;
}

const TIERS = [['Bronze', '#cd7f32'], ['Silber', '#b8c0cc'], ['Gold', '#f5c542'], ['Platin', '#6ee7d8'], ['Diamant', '#a78bfa']];
function milestoneList(ix) {
  const rows = ix.rows, strength = rows.filter(r => !r.cardioOnly);
  const st = Analytics.streak();
  const bestOf = ids => maxOf(ids.flatMap(id => ix.sessions[id] || []), s => s.best) || 0;
  const big3 = BIG3.map(b => bestOf(b.ids));
  const months = {};

function wilksCoef(bw, sex) {
  const m = [-216.0475144, 16.2606339, -0.002388645, -0.00113732, 7.01863e-6, -1.291e-8];
  const f = [594.31747775582, -27.23842536447, 0.82112226871, -0.00930733913, 4.731582e-5, -9.054e-8];
  const c = sex === 'f' ? f : m;
  const x = sex === 'f' ? clamp(bw, 26.51, 154.53) : clamp(bw, 40, 201.9);
  return 500 / (c[0] + c[1] * x + c[2] * x ** 2 + c[3] * x ** 3 + c[4] * x ** 4 + c[5] * x ** 5);
}

function big3TotalSeries(ix) {

  const dns = uniq(lifts.flat().map(s => s.dn)).sort((a, b) => a - b);
  const out = [];
  for (const dn of dns) {
    const vals = lifts.map(ss => { const w = ss.filter(s => s.dn <= dn && s.dn > dn - 90); return w.length ? maxOf(w, s => s.best) : 0; });
    if (vals.every(v => v > 0)) out.push({ dn, total: sum(vals), parts: vals });
  }
  return out;
}

  if (!exOpts.includes(UI.volEx) && exOpts.length) UI.volEx = exOpts.find(id => Ex.type(Ex.get(id)) === 'kg') || exOpts[0];
  const items = scopeItems(ix, scope);
  const inR = items.filter(x => x.dn >= r.from && x.dn <= r.to);
  const inP = prv ? items.filter(x => x.dn >= prv.from && x.dn <= prv.to) : null;
  const weeks = Analytics.weeksOf(r);
  const wk = f => weeks.map(w => sum(inR.filter(x => x.dn >= w && x.dn < w + 7).map(f)));
  const wLabels = weeks.map(w => 'KW ' + isoWeek(w).week);
  const tonW = wk(x => x.ton), setsW = wk(x => x.sets), repsW = wk(x => x.reps);
  const tot = f => sum(inR.map(f)), totP = f => inP ? sum(inP.map(f)) : null;
  const avgLine = (vals, label = 'Ø') => ({ type: 'line', label, data: vals.map(() => avg(vals)), borderColor: c.dim, borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, fill: false });
  // Wochentage
  const wd = [0, 0, 0, 0, 0, 0, 0];
  for (const x of inR) wd[(dowOfDN(x.dn) + 6) % 7] += x.ton;
  // Top 10
  const exVol = {};
  for (const w of ix.rows) if (w.dn >= r.from && w.dn <= r.to) for (const [id, v] of Object.entries(w.exVol)) {
    if (scope === 'muscle' && !((Ex.get(id) || {}).muscleGroups || []).includes(UI.volMuscle)) continue;
    exVol[id] = (exVol[id] || 0) + v;
  }
  const top10 = Object.entries(exVol).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 10);
  // Jahresvergleich (kumuliert nach KW)
  const y = new Date().getFullYear();
  const cum = yr => { const per = new Array(53).fill(0); for (const x of items) { const iw = isoWeek(x.dn); if (iw.year === yr) per[iw.week - 1] += x.ton; } let s = 0; return per.map(v => (s += v)); };
  const curW = isoWeek(todayDN()).week;
  const thisY = cum(y).map((v, i) => i < curW ? toU(v) : null), lastY = cum(y - 1).map(v => toU(v));
  const restItems = scope === 'total' ? inR.filter(x => x.restAvg) : [];
  const cb = chartBuilder();
  const scopeName = scope === 'exercise' ? Ex.name(UI.volEx) : scope === 'muscle' ? UI.volMuscle : 'alle Übungen';
  body.innerHTML = `
    <div class="card mt-12">
      <div class="seg">${[['total', 'Gesamt'], ['exercise', 'Pro Übung'], ['muscle', 'Pro Muskelgruppe']].map(([k, l]) => `<button class="${scope === k ? 'active' : ''}" data-act="volScope" data-v="${k}">${l}</button>`).join('')}</div>
      ${scope === 'exercise' ? `<select class="select mt-12" data-ch="volEx" aria-label="Übung">${exOpts.map(id => `<option value="${esc(id)}" ${id === UI.volEx ? 'selected' : ''}>${esc(Ex.name(id))}</option>`).join('')}</select>` : ''}
      ${scope === 'muscle' ? `<select class="select mt-12" data-ch="volMuscle" aria-label="Muskelgruppe">${MUSCLES.map(m => `<option ${m === UI.volMuscle ? 'selected' : ''}>${m}</option>`).join('')}</select>` : ''}
    </div>
    <div class="charts-grid">
      ${cb.card({ id: 'v1', wide: true, title: 'Tonnage pro Woche', info: `Σ Wiederholungen × Gewicht pro Kalenderwoche (${scopeName}). Gestrichelt: Durchschnitt im Zeitraum.`,
        big: fmtTon(tot(x => x.ton)), small: 'im Zeitraum', delta: deltaHtml(tot(x => x.ton), totP(x => x.ton)), sub: prv ? prevLabel : '',
        factory: () => inR.length ? barChart(wLabels, [barDS('Tonnage', tonW.map(toU), c.accent), avgLine(tonW.map(toU))], { tooltipFmt: v => fmtTon(fromU(v)), yFmt: v => nf(v / (unit() === 'kg' && v >= 1000 ? 1000 : 1), 1) + (unit() === 'kg' && v >= 1000 ? ' t' : '') }) : null })}
      ${cb.card({ id: 'v2', title: 'Sätze pro Woche', info: 'Anzahl erledigter Arbeitssätze pro Woche.', big: nf(tot(x => x.sets), 0), small: 'Sätze', delta: deltaHtml(tot(x => x.sets), totP(x => x.sets)),
        factory: () => inR.length ? barChart(wLabels, [barDS('Sätze', setsW, c.series[0]), avgLine(setsW)], { tooltipFmt: v => nf(v, 0) }) : null })}
      ${cb.card({ id: 'v3', title: 'Wiederholungen pro Woche', info: 'Summe aller Wiederholungen pro Woche.', big: nf(tot(x => x.reps), 0), small: 'Wdh.', delta: deltaHtml(tot(x => x.reps), totP(x => x.reps)),
        factory: () => inR.length ? barChart(wLabels, [barDS('Wiederholungen', repsW, c.series[0]), avgLine(repsW)], { tooltipFmt: v => nf(v, 0) }) : null })}
      ${cb.card({ id: 'v4', title: scope === 'total' ? 'Ø Volumen pro Workout' : 'Volumen pro Session', info: 'Zeigt die Dichte: Wird jedes Training „voller"?',
        big: inR.length ? fmtTon(avg(inR.map(x => x.ton))) : '–', small: 'Ø', delta: inP && inP.length ? deltaHtml(avg(inR.map(x => x.ton)), avg(inP.map(x => x.ton))) : '',
        factory: () => inR.length > 1 ? timeLine([lineDS('Volumen', inR.map(x => ({ x: x.dn, y: toU(x.ton) })), c.accent)], { tooltipFmt: v => fmtTon(fromU(v)) }) : null })}
      ${cb.card({ id: 'v5', title: 'Volumen nach Wochentag', info: 'An welchen Wochentagen passiert die meiste Arbeit? Tonnage im Zeitraum je Wochentag.',
        factory: () => sum(wd) ? { type: 'radar', data: { labels: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], datasets: [{ label: 'Tonnage', data: wd.map(toU), borderColor: c.accent, backgroundColor: alpha(c.accent, .18), pointBackgroundColor: c.accent, pointRadius: 3, borderWidth: 2 }] },
          options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => fmtTon(fromU(ctx.parsed.r)) } } }, scales: { r: { beginAtZero: true, grid: { color: c.grid }, angleLines: { color: c.grid }, pointLabels: { color: c.dim, font: { size: 12, weight: '600' } }, ticks: { display: false } } } } } : null })}
      ${cb.card({ id: 'v6', title: scope === 'muscle' ? `Top-Übungen ${UI.volMuscle}` : 'Volumen pro Übung (Top 10)', info: 'Deine meist-trainierten Übungen im Zeitraum nach Tonnage.', size: 'lg',
        factory: () => top10.length ? barChart(top10.map(([id]) => Ex.name(id)), [barDS('Tonnage', top10.map(([, v]) => toU(v)), c.accent)], { horizontal: true, tooltipFmt: v => fmtTon(fromU(v)), yFmt: v => unit() === 'kg' && v >= 1000 ? nf(v / 1000, 0) + ' t' : nf(v, 0) }) : null })}
      ${cb.card({ id: 'v7', title: 'Volumen-Trend pro Übung', info: 'Volumen je Session für die gewählte Übung mit Trendlinie.',
        top: scope !== 'exercise' ? `<select class="select mt-8" data-ch="volEx" style="min-height:38px;padding-top:4px;padding-bottom:4px" aria-label="Übung">${exOpts.map(id => `<option value="${esc(id)}" ${id === UI.volEx ? 'selected' : ''}>${esc(Ex.name(id))}</option>`).join('')}</select>` : '',
        factory: () => {
          const ss = (ix.sessions[UI.volEx] || []).filter(s => s.dn >= r.from && s.dn <= r.to && s.vol > 0);
          if (!ss.length) return null;
          const pts = ss.map(s => ({ x: s.dn, y: toU(s.vol) }));
          const lr = pts.length >= 3 ? linReg(pts) : null;
          const ds = [lineDS(Ex.name(UI.volEx), pts, c.accent)];
          if (lr) ds.push({ label: 'Trend', data: [{ x: pts[0].x, y: lr.slope * pts[0].x + lr.intercept }, { x: pts[pts.length - 1].x, y: lr.slope * pts[pts.length - 1].x + lr.intercept }], borderColor: c.dim, borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0 });
          return timeLine(ds, { tooltipFmt: v => fmtTon(fromU(v)) });
        } })}
      ${cb.card({ id: 'v8', wide: true, title: 'Set-Intensitäts-Mix', info: 'Anteil deiner Sätze je Wiederholungsbereich pro Woche: 1–5 = Kraft, 6–10 = Hypertrophie/Kraft, 11–15 = Hypertrophie, 16+ = Kraftausdauer.',
        factory: () => {
          const bw = weeks.map(w => inR.filter(x => x.dn >= w && x.dn < w + 7).reduce((b, x) => x.bins.map((v, i) => v + b[i]), [0, 0, 0, 0]));
          if (!sum(bw.map(sum))) return null;
          const pctOf = i => bw.map(b => sum(b) ? round(b[i] / sum(b) * 100, 1) : 0);
          return barChart(wLabels, ['1–5', '6–10', '11–15', '16+'].map((l, i) => barDS(`${l} Wdh.`, pctOf(i), c.series[i], { borderRadius: 0, borderColor: c.surface, borderWidth: { top: 2 } })), { stacked: true, legend: true, xMax: 100, yFmt: v => v + ' %', tooltipFmt: v => nf(v, 0) + ' %' });
        } })}
      ${cb.card({ id: 'v9', wide: true, title: `Tonnage ${y} vs. ${y - 1}`, info: 'Kumulierte Tonnage nach Kalenderwoche – dieses Jahr gegen das Vorjahr. Unabhängig vom Zeitraum-Filter.',
        big: fmtTon(fromU(thisY[curW - 1] || 0)), small: `bis KW ${curW}`, delta: deltaHtml(thisY[curW - 1] || 0, lastY[curW - 1] || 0), sub: `vs. ${y - 1} bis KW ${curW}`,
        factory: () => (sum(lastY.map(v => v || 0)) || (thisY[curW - 1] || 0)) ? {
          type: 'line',
          data: { labels: Array.from({ length: 53 }, (_, i) => 'KW ' + (i + 1)), datasets: [
            { label: String(y), data: thisY, borderColor: c.accent, backgroundColor: alpha(c.accent, .1), fill: true, tension: .3, pointRadius: 0, borderWidth: 2.5 },
            { label: String(y - 1), data: lastY, borderColor: c.series[0], fill: false, tension: .3, pointRadius: 0, borderWidth: 2 }] },
          options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, position: 'bottom' }, tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtTon(fromU(ctx.parsed.y))}` } } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } }, y: { grid: { color: c.grid }, ticks: { maxTicksLimit: 5, callback: v => unit() === 'kg' ? nf(v / 1000, 0) + ' t' : nf(v / 1000, 0) + 'k' } } } }
        } : null })}
      ${cb.card({ id: 'v10', title: 'Ø Pausenzeit pro Satz', info: 'Durchschnittliche Zeit zwischen zwei abgehakten Sätzen je Workout (15 s – 10 min). Nur für live getrackte Workouts im Scope „Gesamt".',
        big: restItems.length ? fmtClock(avg(restItems.map(x => x.restAvg))) : '–', small: 'min:s',
        factory: () => restItems.length ? timeLine([lineDS('Ø Pause', restItems.map(x => ({ x: x.dn, y: Math.round(x.restAvg) })), c.accent)], { tooltipFmt: v => fmtClock(v), yFmt: v => fmtClock(v) }) : null })}
    </div>`;
  cb.mountAll();
};
Actions.volScope = el => { UI.volScope = el.dataset.v; saveUI(); App.renderCurrent(); };

/* ---------- Muskeln (detailliert): 36 Regionen statt 14 Gruppen ---------- */
/* key: [Anzeigename, übergeordnete Muskelgruppe] */
const REGIONS = {
  brust_o: ['Obere Brust (Schlüsselbein-Anteil)', 'Brust'], brust_m: ['Mittlere Brust', 'Brust'], brust_u: ['Untere Brust', 'Brust'],
  serratus: ['Sägemuskel (Serratus)', 'Brust'],
  delt_v: ['Vordere Schulter', 'Schulter'], delt_s: ['Seitliche Schulter', 'Schulter'], delt_h: ['Hintere Schulter', 'Hintere Schulter'],
  rotatoren: ['Rotatorenmanschette (Infraspinatus)', 'Hintere Schulter'],
  bizeps: ['Bizeps', 'Bizeps'], brachialis: ['Brachialis & Oberarmspeichenmuskel', 'Bizeps'],
  trizeps_l: ['Trizeps – langer Kopf', 'Trizeps'], trizeps_s: ['Trizeps – seitlicher Kopf', 'Trizeps'],
  unterarm_f: ['Unterarm-Beuger', 'Unterarme'], unterarm_e: ['Unterarm-Strecker', 'Unterarme'],
  trap_o: ['Oberer Trapez (Nacken)', 'Trapez'], trap_m: ['Mittlerer Trapez', 'Trapez'], trap_u: ['Unterer Trapez', 'Trapez'],
  rhomboiden: ['Rhomboiden', 'Rücken'], lat: ['Latissimus', 'Rücken'], teres: ['Großer Rundmuskel (Teres)', 'Rücken'],
  ruecken_u: ['Unterer Rücken (Rückenstrecker)', 'Unterer Rücken'],
  bauch_o: ['Obere Bauchmuskeln', 'Bauch'], bauch_u: ['Untere Bauchmuskeln', 'Bauch'], obliques: ['Seitliche Bauchmuskeln', 'Bauch'],
  hueftbeuger: ['Hüftbeuger', 'Bauch'],
  quad_rf: ['Gerader Schenkelmuskel (Rectus femoris)', 'Quadrizeps'], quad_vl: ['Äußerer Quadrizeps (Vastus lateralis)', 'Quadrizeps'],
  quad_vm: ['Innerer Quadrizeps (Vastus medialis)', 'Quadrizeps'],
  adduktoren: ['Adduktoren', 'Adduktoren'], abduktoren: ['Abduktoren / mittlerer Gesäßmuskel', 'Abduktoren'],
  gluteus: ['Gesäß (großer Gesäßmuskel)', 'Gesäß'],
  hamstrings_l: ['Beinbeuger außen (Biceps femoris)', 'Beinbeuger'], hamstrings_m: ['Beinbeuger innen (Semitendinosus)', 'Beinbeuger'],
  waden: ['Waden (Zwillingswadenmuskel)', 'Waden'], soleus: ['Schollenmuskel (Soleus)', 'Waden'], tibialis: ['Schienbein (Tibialis)', 'Waden']
};
/** Regionen einer Übung: Hauptmuskel zählt 1, Hilfsmuskeln 0,5 – verfeinert über Name & Aliase */
const _regCache = new Map();
function exRegions(ex) {
  if (!ex) return {};
  const key = ex.id + '|' + (ex.muscleGroups || []).join(',') + '|' + ex.name;
  if (_regCache.has(key)) return _regCache.get(key);
  const n = norm([ex.name, ...(ex.aliases || [])].join(' '));
  const has = re => re.test(n);
  const out = {};
  const add = (regs, w) => regs.forEach(r => { out[r] = Math.max(out[r] || 0, w); });
  (ex.muscleGroups || []).forEach((m, i) => {
    const w = i === 0 ? 1 : 0.5;
    switch (m) {
      case 'Brust':
        if (has(/schräg|incline|von unten|low to high|landmine/)) { add(['brust_o'], w); add(['brust_m'], w * .5); }
        else if (has(/negativ|decline|dip|von oben|high to low/)) { add(['brust_u'], w); add(['brust_m'], w * .5); }
        else { add(['brust_m'], w); add(['brust_o', 'brust_u'], w * .5); }
        if (has(/liegestütz|push.?up|pullover|plus|serratus/)) add(['serratus'], w * .5);
        break;
      case 'Schulter':
        if (has(/außenrot|aussenrot|innenrot|external rot|internal rot|rotator|cuban/)) add(['rotatoren'], w);
        else if (has(/seitheb|lateral|upright|aufrecht/)) add(['delt_s'], w);
        else if (has(/front raise|frontheb/)) add(['delt_v'], w);
        else if (has(/bank|bench|dip|liegestütz|push.?up|fly|flie|brust|chest|floor/)) add(['delt_v'], w);
        else if (has(/arnold/)) add(['delt_v', 'delt_s'], w);
        else { add(['delt_v'], w); add(['delt_s'], w * .6); add(['serratus'], w * .3); }
        if (has(/upright|aufrecht/)) add(['trap_o'], w * .5);
        break;
      case 'Hintere Schulter':
        add(['delt_h'], w); add(['rotatoren'], w * .5);
        if (has(/face|reverse|butterfly|fly|flie|pull.?apart/)) add(['trap_m', 'rhomboiden'], w * .4);
        break;
      case 'Bizeps':
        if (has(/hammer|neutral|seil|rope|cross.?body|zottman/)) { add(['brachialis'], w); add(['bizeps'], w * .6); }
        else if (has(/reverse|obergriff|overhand|pronated/)) { add(['brachialis'], w); add(['unterarm_e'], w * .5); add(['bizeps'], w * .4); }
        else { add(['bizeps'], w); add(['brachialis'], w * .4); }
        break;
      case 'Trizeps':
        if (has(/über.?kopf|overhead|french|skull|stirn|liegend|lying|katana|jm press|tate/)) { add(['trizeps_l'], w); add(['trizeps_s'], w * .6); }
        else { add(['trizeps_s'], w); add(['trizeps_l'], w * .6); }
        break;
      case 'Unterarme':
        if (has(/reverse|strecker|extension|obergriff/)) add(['unterarm_e'], w);
        else { add(['unterarm_f'], w); add(['unterarm_e'], w * .4); }
        break;
      case 'Rücken':
        if (has(/pullover|straight.?arm|überzug/)) { add(['lat'], w); add(['teres'], w * .7); add(['serratus'], w * .4); }
        else if (has(/lat|klimm|pull.?up|chin|pulldown|latzug|hang/)) { add(['lat'], w); add(['teres'], w * .8); add(['rhomboiden', 'trap_u'], w * .4); }
        else if (has(/rudern|row|face|reverse|seal|pendlay|meadows/)) { add(['rhomboiden', 'trap_m'], w); add(['lat'], w * .8); add(['teres'], w * .6); add(['trap_u', 'delt_h'], w * .4); }
        else if (has(/kreuzheb|deadlift|rack/)) { add(['trap_m', 'rhomboiden', 'lat'], w * .6); add(['trap_o'], w * .4); }
        else { add(['lat'], w); add(['rhomboiden', 'trap_m'], w * .7); add(['teres'], w * .6); }
        break;
      case 'Trapez':
        if (has(/y.?raise|y.?heb|prone y|lower trap/)) add(['trap_u'], w);
        else if (has(/shrug|schulterheb|farmer|carry|clean|snatch|umsetz|reiß|upright|aufrecht|rack/)) add(['trap_o'], w);
        else if (has(/face|reverse|rudern|row|pull.?apart|fly/)) { add(['trap_m', 'rhomboiden'], w); add(['trap_u'], w * .5); }
        else { add(['trap_o'], w); add(['trap_m'], w * .6); }
        break;
      case 'Unterer Rücken': add(['ruecken_u'], w); break;
      case 'Bauch':
        if (has(/twist|side|seit|oblique|woodchop|pallof|bicycle|copenhagen|suitcase/)) add(['obliques'], w);
        else if (has(/leg raise|beinheb|knee raise|knieheb|hanging|l.?sit|v.?up|mountain|reverse crunch|dragon/)) { add(['bauch_u'], w); add(['hueftbeuger'], w * .75); add(['bauch_o'], w * .5); }
        else if (has(/plank|stütz|hollow|ab wheel|rollout|bear/)) { add(['bauch_o', 'bauch_u'], w); add(['obliques'], w * .7); }
        else { add(['bauch_o'], w); add(['bauch_u'], w * .6); if (has(/sit.?up|situp/)) add(['hueftbeuger'], w * .5); }
        break;
      case 'Quadrizeps':
        if (has(/beinstreck|leg extension|extension|sissy/)) { add(['quad_rf'], w); add(['quad_vl', 'quad_vm'], w * .8); }
        else if (has(/eng|narrow|heel|ferse|cyclist|spanish|step/)) { add(['quad_vm'], w); add(['quad_vl'], w * .8); add(['quad_rf'], w * .6); }
        else { add(['quad_vl', 'quad_vm'], w); add(['quad_rf'], w * .6); }
        if (has(/sumo|ausfall|lunge|split|bulgarian|goblet|step/)) add(['adduktoren'], .5);
        break;
      case 'Gesäß': add(['gluteus'], w); if (has(/abduk|hip thrust|bridge|split|lunge|ausfall|bulgarian|step|kickback|monster|band walk|einbeinig|single leg|pistol/)) add(['abduktoren'], .5); break;
      case 'Beinbeuger':
        if (has(/sitzend|seated|nordic/)) { add(['hamstrings_m'], w); add(['hamstrings_l'], w * .8); }
        else add(['hamstrings_l', 'hamstrings_m'], w);
        break;
      case 'Adduktoren': add(['adduktoren'], w); break;
      case 'Abduktoren': add(['abduktoren'], w); break;
      case 'Waden':
        if (has(/tibialis|tib raise|schienbein/)) add(['tibialis'], w);
        else if (has(/sitzend|seated/)) add(['soleus'], w);
        else if (has(/stehend|standing|einbeinig|single|beinpresse|press|jump|seil|steigung|incline/)) { add(['waden'], w); add(['soleus'], w * .5); }
        else add(['waden', 'soleus'], w);
        break;
    }
  });
  _regCache.set(key, out);
  return out;
}

function bodySvg(view, valueOf, labelOf) {

/** Gewichtete Sätze pro Region in den Workouts eines Zeitraums */
function regionSets(rows) {
  const out = {};
  Object.keys(REGIONS).forEach(k => { out[k] = 0; });
  for (const w of rows) for (const [id, n] of Object.entries(w.exSets || {})) {
    const regs = exRegions(Ex.get(id));
    for (const [r, wt] of Object.entries(regs)) out[r] += n * wt;
  }
  return out;
}
/* Farbskala: 0 = Muskel grau, wenig → zarter Akzent, Zielbereich → voller Akzent, viel → leuchtend */
const regionColor = pw => {
  const k = clamp(pw / 20, 0, 1);
  if (k <= 0) return 'var(--mus-off)';
  if (k < .6) return `color-mix(in srgb, var(--accent) ${Math.round(28 + 72 * k / .6)}%, var(--mus-off))`;
  return `color-mix(in srgb, var(--mus-hi) ${Math.round((k - .6) / .4 * 65)}%, var(--accent))`;
};

Actions.muscleTap = el => {
  const k = el.dataset.m;
  const reg = REGIONS[k]; if (!reg) return;
  const r = Analytics.range();
  const rows = Analytics.rowsIn(r);
  const nWeeks = Math.max(1, r.len / 7);
  const exCount = {};
  for (const w of rows) for (const [id, n] of Object.entries(w.exSets || {})) { const wt = exRegions(Ex.get(id))[k]; if (wt) exCount[id] = (exCount[id] || 0) + n * wt; }
  const sets = sum(Object.values(exCount));
  const pw = sets / nWeeks;
  const status = pw < 10 ? ['danger', 'unter MEV – mehr Volumen hilft'] : pw <= 20 ? ['accent', 'im Zielbereich (MEV–MRV)'] : ['warn', 'über MRV – auf Erholung achten'];
  $$('.body-map .mus').forEach(p => p.classList.toggle('sel', p.dataset.m === k));
  const lib = Store.all('exercises').filter(e => exRegions(e)[k] === 1 && !exCount[e.id]).slice(0, 8);

    title: reg[0], size: 'sm',
    body: `<p class="small dim">Gehört zur Gruppe <b>${esc(reg[1])}</b></p>

async function compressImage(file, max = 900, q = .72) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden')); i.src = url; });
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * scale);
    cv.height = Math.round(img.naturalHeight * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let data = cv.toDataURL('image/jpeg', q);
    if (data.length > 850000) data = cv.toDataURL('image/jpeg', .5);
    return data;
  } finally { URL.revokeObjectURL(url); }
}

Actions.photoCompare = el => {
  const photos = Store.all('photos').filter(p => p.data).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if (!photos.length) return;
  let after = photos.find(p => p.id === el.dataset.id) || photos[photos.length - 1];
  let before = photos[0].id !== after.id ? photos[0] : (photos[1] || photos[0]);
  if (before.date > after.date) [before, after] = [after, before];
  const m = Modal.open({ title: 'Vorher / Nachher', size: 'lg' });
  const draw = () => {
    m.setBody(`
      <div class="form-grid mb-12">
        <label class="field"><span>Vorher</span><select class="select" id="pcA">${photos.map(p => `<option value="${esc(p.id)}" ${p.id === before.id ? 'selected' : ''}>${esc(fmtDate(p.date))}</option>`).join('')}</select></label>
        <label class="field"><span>Nachher</span><select class="select" id="pcB">${photos.map(p => `<option value="${esc(p.id)}" ${p.id === after.id ? 'selected' : ''}>${esc(fmtDate(p.date))}</option>`).join('')}</select></label>
      </div>
      <div class="compare" id="pcBox">
        <img src="${after.data}" alt="Nachher">
        <img src="${before.data}" alt="Vorher" id="pcTop" style="clip-path:inset(0 50% 0 0)">
        <span class="cmp-line" id="pcLine" style="left:50%"></span>
        <span class="cmp-tag" style="left:10px">${esc(fmtDate(before.date))}</span><span class="cmp-tag" style="right:10px">${esc(fmtDate(after.date))}</span>
      </div>
      <input type="range" min="0" max="100" value="50" id="pcRange" class="mt-12" style="width:100%;accent-color:var(--accent);height:32px" aria-label="Vergleichs-Regler">
      <p class="center dim small mt-8">${Math.round(dayNum(after.date) - dayNum(before.date))} Tage Unterschied</p>`);
    const set = v => { $('#pcTop', m.el).style.clipPath = `inset(0 ${100 - v}% 0 0)`; $('#pcLine', m.el).style.left = v + '%'; };
    $('#pcRange', m.el).addEventListener('input', e => set(+e.target.value));
    const box = $('#pcBox', m.el);
    const drag = e => { const rc = box.getBoundingClientRect(); const v = clamp((e.clientX - rc.left) / rc.width * 100, 0, 100); set(v); $('#pcRange', m.el).value = v; };
    box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); drag(e); box.onpointermove = drag; });
    box.addEventListener('pointerup', () => { box.onpointermove = null; });
    $('#pcA', m.el).addEventListener('change', e => { before = photos.find(p => p.id === e.target.value); draw(); });
    $('#pcB', m.el).addEventListener('change', e => { after = photos.find(p => p.id === e.target.value); draw(); });
  };
  draw();
};

/* ---------- Export: CSV ---------- */
Actions.exportCSV = () => {
  const W = Store.all('workouts').filter(w => isISO(w.date)).sort((a, b) => a.date.localeCompare(b.date) || (a.startedAt || 0) - (b.startedAt || 0));
  if (!W.length) return toast('Noch keine Workouts zum Exportieren', 'info');
  const q = v => { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const dec = v => v == null || v === '' ? '' : String(round(+v, 3)).replace('.', ',');
  const head = ['date', 'workoutName', 'exerciseName', 'setNumber', 'reps', 'weightKg', 'rpe', 'done', 'notes', 'warmup', 'durationSec', 'repsRight', 'durationSecRight', 'distanceKm', 'level'];
  const lines = [head];
  for (const w of W) for (const en of w.entries || []) (en.sets || []).forEach((s, i) => {
    lines.push([w.date, w.planDayName || w.name || '', Ex.entryName(en), i + 1, s.reps ?? '', dec(s.weightKg), dec(s.rpe), s.done === false ? 'false' : 'true', w.notes || '', s.warmup ? 'true' : 'false', s.durationSec ?? '', s.repsR ?? '', s.durationSecR ?? '', dec(s.distKm), dec(s.level)]);
  });
  download(`trainio-workouts-${isoDate()}.csv`, '﻿' + lines.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast(`${lines.length - 1} Sätze exportiert`, 'success');
};

const slug = s => String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const pdfSafe = s => String(s ?? '').replace(/[–—]/g, '-').replace(/[„“”]/g, '"').replace(/[‚‘’]/g, "'").replace(/…/g, '...').replace(/•/g, '-').replace(/≈/g, '~').replace(/[^\x00-\xFF]/g, '');
Actions.exportPDF = () => {

function pdfDoc() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const st = { doc, y: 20, page: 1 };
  st.text = (s, x, y, o) => doc.text(pdfSafe(s), x, y, o);
  st.need = h => { if (st.y + h > 282) { footer(st); doc.addPage(); st.page++; st.y = 20; } };
  return st;
}
function footer(st) {
  const d = st.doc;
  d.setFontSize(8); d.setTextColor(140);
  d.text(pdfSafe(`${APP.name} · erstellt am ${fmtDate(isoDate(), { day: '2-digit', month: '2-digit', year: 'numeric' })}`), 15, 292);
  d.text(String(st.page), 195, 292, { align: 'right' });
  d.setTextColor(20);
}
function pdfCover(st, title, sub, stats) {
  const d = st.doc;
  const user = Auth.user();
  d.setFillColor(11, 13, 16); d.rect(0, 0, 210, 297, 'F');
  d.setFillColor(57, 255, 136); d.rect(15, 60, 18, 3, 'F');
  d.setTextColor(241, 243, 245); d.setFont('helvetica', 'bold'); d.setFontSize(32);
  st.text(APP.name, 15, 52);
  d.setFontSize(20); st.text(title, 15, 80);
  d.setFont('helvetica', 'normal'); d.setFontSize(12); d.setTextColor(154, 163, 175);
  st.text(sub, 15, 90);
  st.text((S().displayName || (user && user.name) || '') + (user && user.email ? ` · ${user.email}` : ''), 15, 98);
  let y = 125;
  for (const [k, v] of stats) {
    d.setTextColor(154, 163, 175); d.setFontSize(10); st.text(k, 15, y);
    d.setTextColor(241, 243, 245); d.setFontSize(18); d.setFont('helvetica', 'bold'); st.text(v, 15, y + 8);
    d.setFont('helvetica', 'normal');
    y += 20;
  }
  d.setTextColor(20);
  d.addPage(); st.page++; st.y = 20;
}
async function pdfWorkoutLog(from) {
  const W = Store.all('workouts').filter(w => isISO(w.date) && dayNum(w.date) >= from).sort((a, b) => a.date.localeCompare(b.date) || (a.startedAt || 0) - (b.startedAt || 0));
  if (!W.length) throw new Error('Keine Workouts im Zeitraum');
  const ix = Analytics.cur();
  const rows = ix.rows.filter(r => r.dn >= from);
  const st = pdfDoc();
  const d = st.doc;
  pdfCover(st, 'Trainingsprotokoll', `${fmtDate(W[0].date)} - ${fmtDate(W[W.length - 1].date)}`, [
    ['Workouts', String(W.length)], ['Tonnage', fmtTon(sum(rows.map(r => r.ton)))], ['Sätze', nf(sum(rows.map(r => r.sets)), 0)],
    ['PRs', String(ix.prEvents.filter(p => p.dn >= from).length)], ['Trainingszeit', fmtDur(sum(rows.map(r => r.dur)))]
  ]);
  for (const w of W) {
    const row = rows.find(r => r.id === w.id);
    st.need(24);
    d.setFillColor(238, 241, 245); d.roundedRect(15, st.y - 5, 180, 9, 2, 2, 'F');
    d.setFont('helvetica', 'bold'); d.setFontSize(11);
    st.text(`${fmtDate(w.date, { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })}  ·  ${w.planDayName || w.name || 'Workout'}`, 18, st.y + 1);
    d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor(90);
    st.text(`${fmtDur(w.durationSec)} · ${row && row.cardioOnly ? 'Cardio' : `${fmtTon(row ? row.ton : 0)} · ${row ? row.sets : 0} Sätze`}${row && row.cSec && !row.cardioOnly ? ' · Cardio ' + fmtDur(row.cSec) : ''}`, 192, st.y + 1, { align: 'right' });
    d.setTextColor(20);
    st.y += 10;
    if (w.notes) { d.setFontSize(9); d.setTextColor(90); const ls = d.splitTextToSize(pdfSafe(w.notes), 175); st.need(ls.length * 4); d.text(ls, 18, st.y); st.y += ls.length * 4 + 1; d.setTextColor(20); }
    for (const en of w.entries || []) {
      const sets = (en.sets || []).filter(s => s.done !== false);
      if (!sets.length) continue;
      const isSec = Ex.type(Ex.get(en.exerciseId)) === 'sec';
      const txt = Ex.type(Ex.get(en.exerciseId)) === 'cardio' ? cardioTxt(cardioTotals(sets), cardioInfo(Ex.get(en.exerciseId))) : sets.map(s => (s.warmup ? 'W ' : '') + (isSec ? secTxt(s) : (s.weightKg ? `${wNum(s.weightKg)}×${repsTxt(s)}` : repsTxt(s))) + (s.rpe ? ` @${nf(s.rpe, 1)}` : '')).join('   ');
      d.setFontSize(9.5);
      const lines = d.splitTextToSize(pdfSafe(txt), 120);
      st.need(lines.length * 4.5 + 2);
      d.setFont('helvetica', 'bold'); st.text(Ex.entryName(en), 18, st.y);
      d.setFont('helvetica', 'normal'); d.text(lines, 75, st.y);
      st.y += lines.length * 4.5 + 1.5;
    }
    st.y += 5;
  }
  footer(st);
  d.save(`trainio-protokoll-${isoDate()}.pdf`);
  toast('PDF erstellt', 'success');
}
async function pdfExerciseReport(exId, from) {
  const ss = Analytics.sessionsOf(exId).filter(s => s.dn >= from);
  if (!ss.length) throw new Error('Keine Daten für diese Übung im Zeitraum');
  const pr = Store.raw('prs', exId);
  const st = pdfDoc();
  const d = st.doc;
  d.setFont('helvetica', 'bold'); d.setFontSize(22);
  st.text(Ex.name(exId), 15, 22);
  d.setFont('helvetica', 'normal'); d.setFontSize(10); d.setTextColor(90);
  st.text(`Übungs-Report · ${fmtDate(ss[0].date)} - ${fmtDate(ss[ss.length - 1].date)} · ${ss.length} Sessions`, 15, 29);
  d.setTextColor(20);
  const boxes = [['Bestes e1RM', pr ? fmtW(pr.best1RM) : '-'], ['Max-Gewicht', pr ? `${fmtW(pr.bestWeightKg)} × ${pr.bestReps}` : '-'], ['Bestes Volumen', pr ? fmtTon(pr.bestVolume) : '-'], ['Sessions', String(ss.length)]];
  boxes.forEach(([k, v], i) => {
    const x = 15 + i * 45.5;
    d.setFillColor(238, 241, 245); d.roundedRect(x, 35, 43, 18, 2, 2, 'F');
    d.setFontSize(8); d.setTextColor(90); st.text(k, x + 3, 41);
    d.setFontSize(12); d.setTextColor(20); d.setFont('helvetica', 'bold'); st.text(v, x + 3, 49); d.setFont('helvetica', 'normal');
  });
  // Chart offscreen rendern und als Bild einbetten
  if (await Charts.ensure()) {
    const cv = document.createElement('canvas');
    cv.width = 1000; cv.height = 460;
    const pts = ss.filter(s => s.best > 0).map(s => ({ x: s.dn, y: round(toU(s.best), 1) }));
    const vol = ss.map(s => ({ x: s.dn, y: round(toU(s.maxW), 1) }));
    const ch = new window.Chart(cv.getContext('2d'), {
      type: 'line',
      data: { datasets: [
        { label: 'e1RM', data: pts, borderColor: '#0b8f48', backgroundColor: 'rgba(11,143,72,.12)', fill: true, tension: .3, pointRadius: pts.length < 40 ? 3 : 0, borderWidth: 3 },

  });
  if (lbUsed) warnings.push('Gewichte in lb gefunden – werden automatisch in kg umgerechnet (× 0,4536).');
  if (dupes.length) warnings.push(`${dupes.length} Workout${dupes.length === 1 ? ' ist' : 's sind'} bereits vorhanden und ${dupes.length === 1 ? 'wird' : 'werden'} übersprungen (${uniq(dupes).slice(0, 6).map(d => fmtDateShort(d) + '.').join(', ')}${dupes.length > 6 ? ' …' : ''})`);
  if (maybe.length) warnings.push(`${maybe.length} Workout${maybe.length === 1 ? ' könnte ein Duplikat sein' : 's könnten Duplikate sein'} (gleicher Tag, gleiche Übungen, andere Werte: ${uniq(maybe).slice(0, 6).map(d => fmtDateShort(d) + '.').join(', ')}) – ${maybe.length === 1 ? 'wird' : 'werden'} trotzdem importiert`);
  newExercises.filter(e => e.guessed).forEach(e => warnings.push(`Übung ohne Kategorie-Info: „${e.name}" – wird als „${e.category}" angelegt${e.muscleGroups.length ? ` (Muskeln geschätzt: ${e.muscleGroups.join(', ')})` : ''}`));
  const estDur = items.filter(w => w.estDur && !w.duplicate).length;
  if (estDur) warnings.push(`${estDur} Workout${estDur === 1 ? '' : 's'} ohne Dauer – geschätzt mit 60 s pro Satz.`);
  const progDup = progress.filter(p => p.duplicate).length;
  if (progDup) warnings.push(`${progDup} Körper-Eintrag/Einträge mit bereits vorhandenem Datum – werden übersprungen.`);
  return { items, mapping, newExercises, progress, warnings, broken, progSkipped, lbUsed, uniqueEx: mapping.size };
}

function previewHtml(a) {
  const ok = a.items.filter(w => !w.duplicate);
  const dates = a.items.map(w => w.date);
  const listItem = w => `<div class="row small" style="padding:4px 0;${w.duplicate ? 'opacity:.5;text-decoration:line-through' : ''}"><span class="num dim" style="width:76px">${fmtDate(w.date)}</span><span class="grow ellipsis bold">${esc(w.name)}</span><span class="dim">${w.entries.length} Üb. · ${sum(w.entries.map(e => e.sets.length))} Sätze</span></div>`;
  const aliased = [...a.mapping.entries()].filter(([k, m]) => !m.isNew && norm(m.name) !== k);
  const first5 = a.items.slice(0, 5), last5 = a.items.length > 10 ? a.items.slice(-5) : a.items.slice(5);
  return `<div class="preview-box">
      <div>✅ JSON gültig</div>
      ${dates.length ? `<div>📅 Zeitraum: ${fmtDate(dates[0], { day: '2-digit', month: '2-digit', year: 'numeric' })} – ${fmtDate(dates[dates.length - 1], { day: '2-digit', month: '2-digit', year: 'numeric' })}</div>` : ''}
      <div>🏋️ ${a.items.length} Workouts gefunden${a.items.length !== ok.length ? ` (${ok.length} werden importiert)` : ''}</div>
      <div>📊 ${a.uniqueEx} einzigartige Übungen (${a.newExercises.length} davon neu – werden angelegt)</div>
      <div>📈 ${a.progress.length} Körper-Einträge</div>
      ${a.warnings.map(w => `<div class="warn-line">⚠️ ${esc(w)}</div>`).join('')}
      ${a.broken.length ? `<div class="danger-text">❌ ${a.broken.length} fehlerhafte${a.broken.length === 1 ? 's Workout wird' : ' Workouts werden'} übersprungen:</div>${a.broken.slice(0, 8).map(b => `<div class="danger-text small">• ${esc(b.label)}: ${esc(b.errs.slice(0, 3).join('; '))}</div>`).join('')}` : ''}
      ${a.progSkipped.map(p => `<div class="danger-text small">❌ ${esc(p)}</div>`).join('')}
    </div>
    ${a.items.length ? `<h4 class="mt-16 mb-8">Erste ${first5.length} Workouts</h4>${first5.map(listItem).join('')}${last5.length ? `<h4 class="mt-16 mb-8">Letzte ${last5.length} Workouts</h4>${last5.map(listItem).join('')}` : ''}` : ''}
    ${a.newExercises.length ? `<h4 class="mt-16 mb-8">Neue Übungen</h4><div class="chips wrap">${a.newExercises.map(e => `<span class="chip" style="cursor:default">${esc(e.name)} <span class="faint">· ${esc(e.category)}</span></span>`).join('')}</div>` : ''}
    ${aliased.length ? `<h4 class="mt-16 mb-8">Zugeordnet zu vorhandenen Übungen</h4><div class="small dim">${aliased.map(([k, m]) => `${esc(k)} → <b>${esc(m.name)}</b>`).join(' · ')}</div>` : ''}`;
}

Actions.openArrow = () => {
  let analysis = null;
  const m = Modal.open({
    title: 'Arrow-Import', size: 'full',
    body: `<p class="dim">Füge den JSON-Block aus deinem Chat hier ein. Wir zeigen dir vor dem Speichern eine Vorschau.</p>
      <div class="row wrap mt-12">
        <label class="btn btn-secondary btn-sm">${icon('upload')} .json-Datei<input type="file" accept=".json,application/json,text/plain" id="impFile" hidden></label>
        <button class="btn btn-ghost btn-sm" data-x="prompt">${icon('copy')} Prompt für Claude kopieren</button>
        <button class="btn btn-ghost btn-sm" data-x="example">${icon('file')} Beispiel einfügen</button>
      </div>
      <textarea class="textarea code mt-12 drop-zone" id="impText" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder='{ "source": "arrow", "version": 1, "workouts": [ … ] }'></textarea>
      <button class="btn btn-primary btn-block mt-12" data-x="validate">${icon('checkCircle')} Validieren & Vorschau</button>
      <div id="impOut" class="mt-16"></div>`,
    foot: `<button class="btn btn-secondary" data-x="cancel">Abbrechen</button><button class="btn btn-primary" data-x="commit" id="impCommit" disabled>Import bestätigen</button>`
  });
  const ta = $('#impText', m.el), out = $('#impOut', m.el), commitBtn = $('#impCommit', m.el);
  const invalidate = () => { analysis = null; commitBtn.disabled = true; };
  ta.addEventListener('input', invalidate);
  ta.addEventListener('dragover', e => { e.preventDefault(); ta.classList.add('over'); });
  ta.addEventListener('dragleave', () => ta.classList.remove('over'));
  ta.addEventListener('drop', async e => { e.preventDefault(); ta.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) { ta.value = await readFileText(f); invalidate(); validate(); } });
  $('#impFile', m.el).addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; ta.value = await readFileText(f); invalidate(); validate(); });
  function validate() {
    analysis = analyzeImport(ta.value);
    if (analysis.error) { out.innerHTML = `<div class="import-err">${esc(analysis.error)}</div>`; analysis = null; commitBtn.disabled = true; return; }
    out.innerHTML = previewHtml(analysis);
    const n = analysis.items.filter(w => !w.duplicate).length + analysis.progress.filter(p => !p.duplicate).length;
    commitBtn.disabled = !n;
    commitBtn.textContent = n ? 'Import bestätigen' : 'Nichts Neues zu importieren';
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]');
    if (!b) return;
    const x = b.dataset.x;
    if (x === 'cancel') return m.close();
    if (x === 'example') { ta.value = JSON.stringify(ARROW_EXAMPLE, null, 2); invalidate(); return; }
    if (x === 'prompt') {
      try { await navigator.clipboard.writeText(ARROW_PROMPT); toast('Prompt kopiert – zusammen mit den Screenshots an Claude schicken', 'success'); }
      catch (err) { Modal.open({ title: 'Prompt für Claude', body: `<textarea class="textarea code" readonly style="min-height:360px">${esc(ARROW_PROMPT)}</textarea>` }); }
      return;
    }
    if (x === 'validate') return validate();
    if (x === 'commit' && analysis) {
      commitBtn.disabled = true;
      $$('[data-x]', m.el).forEach(btn => { btn.disabled = true; });
      ta.disabled = true;
      out.innerHTML = `<div class="card"><div class="bold" id="impStatus">Starte Import …</div><div class="progress-track mt-12"><i id="impBar"></i></div></div>`;
      out.scrollIntoView({ behavior: 'smooth', block: 'start' });
      try {
        const res = await commitImport(analysis, (msg, frac) => { $('#impStatus', m.el).textContent = msg; $('#impBar', m.el).style.width = Math.round(frac * 100) + '%'; });
        m.close();
        toast(`✅ ${res.workouts} Workouts, ${res.exercises} Übungen und ${res.prs} PRs importiert`, 'success', { duration: 6000 });
        if (res.fallback) setTimeout(() => toast(`${res.fallback} Übung${res.fallback === 1 ? '' : 'en'} mit Standardwerten angelegt – bitte in der Bibliothek prüfen`, 'warn', { duration: 6000 }), 800);
        if (analysis.broken.length) setTimeout(() => toast(`${analysis.broken.length} fehlerhafte${analysis.broken.length === 1 ? 's Workout' : ' Workouts'} übersprungen`, 'warn', { duration: 6000 }), 1600);
        App.go('progress');
      } catch (err) {
        console.error(err);
        out.innerHTML = `<div class="import-err">Import abgebrochen: ${esc(err.message)}</div>`;
        $$('[data-x]', m.el).forEach(btn => { btn.disabled = false; });
        ta.disabled = false;
      }
    }
  });
};

async function commitImport(a, progress) {
  const importId = autoId();
  const created = { exercises: [], workouts: [], progress: [] };
  // 1) Neue Übungen anlegen
  const exOps = [];
  for (const ne of a.newExercises) {
    const id = autoId();
    a.mapping.get(ne.key).id = id;
    created.exercises.push(id);
    exOps.push({ type: 'put', coll: 'exercises', id, doc: { name: ne.name, category: ne.category, muscleGroups: ne.muscleGroups, equipment: ne.equipment, isCustom: true, notes: ne.notes, defaultUnit: 'kg', aliases: [], importId, createdAt: Date.now() } });
  }
  if (exOps.length) { progress(`Lege ${exOps.length} Übungen an …`, 0.02); await Store.batch(exOps); }
  // 2) Workouts in Chunks à 50 (UI bleibt flüssig, Firestore-Batches ≤ 500)
  const list = a.items.filter(w => !w.duplicate);
  for (let i = 0; i < list.length; i += 50) {
    const chunk = list.slice(i, i + 50);
    const ops = chunk.map(w => {
      const id = autoId();
      created.workouts.push(id);
      const [y, mo, d] = w.date.split('-').map(Number);
      const startedAt = new Date(y, mo - 1, d, 18, 0, 0).getTime();
      return { type: 'put', coll: 'workouts', id, replace: true, doc: {
        date: w.date, startedAt, endedAt: startedAt + w.durationSec * 1000, durationSec: w.durationSec,
        planId: null, planDayIndex: null, planDayName: w.name, name: w.name, notes: w.notes, bodyWeightKg: w.bodyWeightKg,
        entries: w.entries.map(e => { const mp = a.mapping.get(norm(e.exerciseName)); return { exerciseId: mp.id, exerciseName: e.exerciseName, sets: e.sets }; }),
        ...(w.estDur ? { durationEstimated: true } : {}),
        importId, createdAt: Date.now(), updatedAt: Date.now()
      } };
    });
    progress(`Importiere Workout ${Math.min(i + 50, list.length)}/${list.length} …`, 0.05 + 0.75 * Math.min(i + 50, list.length) / list.length);
    await Store.batch(ops);
    await sleep(0);
  }
  // 3) Körper-Einträge
  const pOps = a.progress.filter(p => !p.duplicate).map(p => {
    const id = autoId();
    created.progress.push(id);
    const { duplicate, ...rest } = p;
    return { type: 'put', coll: 'progress', id, replace: true, doc: { ...rest, photoUrl: null, importId, createdAt: Date.now() } };
  });
  if (pOps.length) { progress(`Speichere ${pOps.length} Körper-Einträge …`, 0.85); await Store.batch(pOps); }
  // 4) PRs über ALLE Workouts neu berechnen (ohne Toasts)
  progress('Berechne Personal Records …', 0.92);
  await sleep(0);
  const prs = await PR.recalcAll();
  // 5) Import-Transaktion protokollieren (für Rollback)
  Store.put('imports', importId, {
    source: 'arrow', importedAt: Date.now(), undoneAt: null,
    counts: { workouts: created.workouts.length, exercises: created.exercises.length, progress: created.progress.length, skippedDuplicates: a.items.length - list.length, broken: a.broken.length },
    docIds: created
  }, { replace: true });
  progress('Fertig ✅', 1);
  return { workouts: created.workouts.length, exercises: a.uniqueEx, prs, fallback: a.newExercises.filter(e => !e.fromBlock).length };
}

function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = sw => toast('Neue Version verfügbar', 'info', { duration: 20000, action: { label: 'Neu laden', fn: () => sw.postMessage({ type: 'SKIP_WAITING' }) } });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) offer(sw); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(e => console.warn('Service Worker:', e));
}

async function boot() {
  await Store.boot();
  applyTheme();
  const st = S().startTab;
  if (st && st !== 'last' && Views[st]) App.tab = st;
  if (Store.owner() === 'local') ensureSeeds();
  Store.subscribe('*', cs => { if (cs.includes('meta')) applyTheme(); scheduleRender(); });
  Store.onSync(() => { renderTopbar(); if (App.tab === 'more') scheduleRender(); });
  App.renderCurrent();
  updateTopH();
  // Workout-Resume nach App-Kill / Reload
  const w = Workout.cur();
  if (w) {
    toast(`„${w.name}" wiederhergestellt – weiter geht's`, 'info');
    if (!w.editingId) WakeLock.request();
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (App.tab === 'more') scheduleRender(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; toast(`${APP.name} installiert 🎉`, 'success'); });
  let wasOffline = !navigator.onLine;
  window.addEventListener('offline', () => { wasOffline = true; toast('Offline – alles wird lokal gespeichert und später synchronisiert', 'warn'); });
  window.addEventListener('online', () => { if (wasOffline) toast('Wieder online', 'success'); wasOffline = false; });
  registerSW();
  Auth.init();
}
boot();
})();
