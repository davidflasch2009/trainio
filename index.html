<!DOCTYPE html>
<html lang="de" data-theme="dark" data-design="gymlog">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainio</title>
<meta name="description" content="Trainio – Workout-Tracker, Trainingsplan-Builder und Progress-Tracker.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainio">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Darstellung vor dem ersten Paint setzen (verhindert Flackern) – Cache aus applyTheme()
  (function () {
    try {
      var d = document.documentElement, L = JSON.parse(localStorage.getItem('gymlog.look') || 'null') || {};
      var t = L.theme || localStorage.getItem('gymlog.theme') || 'dark', h = new Date().getHours();
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      else if (t === 'time') t = h >= 19 || h < 7 ? 'dark' : 'light';
      else if (t !== 'light') t = 'dark';
      d.setAttribute('data-theme', t);
      var a = L.attrs || {};
      for (var k in a) if (a[k] != null) d.setAttribute(k, a[k]);
      d.style.cssText = (L.accent ? L.accent[t] : '') + (L.extra || '');
      (L.fonts || []).forEach(function (f) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f; l.crossOrigin = 'anonymous'; document.head.appendChild(l); });
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/app.css?v=1.11.0">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <div id="sbShade" aria-hidden="true"></div>
    <div id="banner"></div>
    <main class="view" id="view">
      <section class="tab" id="tab-start"></section>
      <section class="tab" id="tab-training"></section>
      <section class="tab" id="tab-exercises"></section>
      <section class="tab" id="tab-progress"></section>
      <section class="tab" id="tab-more"></section>
    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Navigation"></nav>
<div id="restDock"></div>
<div id="fabRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<div id="popover" class="popover" hidden></div>
<noscript><div style="padding:24px">Trainio benötigt JavaScript.</div></noscript>
<!-- App-Code: Reihenfolge ist wichtig. Bei jedem Deploy ?v= anpassen (tools/release.py) -->
<script src="js/config.js?v=1.11.0"></script>

<script src="js/exercises.js?v=1.11.0"></script>
<script src="js/charts.js?v=1.11.0"></script>
<script src="js/progress.js?v=1.11.0"></script>
<script src="js/more.js?v=1.11.0"></script>
<script src="js/import.js?v=1.11.0"></script>
<script src="js/boot.js?v=1.11.0"></script>
</body>
</html>
