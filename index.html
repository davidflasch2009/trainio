/* ==========================================================================
   6. Übungs-Helfer, Analytics-Engine, PR-Berechnung
   ========================================================================== */
const e1rm = (w, r) => (w > 0 && r >= 1) ? w * (1 + r / 30) : 0;  // Epley

const Ex = {
  get: id => Store.raw('exercises', id),
  name: id => (Store.raw('exercises', id) || {}).name || (Store.raw('prs', id) || {}).exerciseName || 'Unbekannte Übung',
  /** Name für einen Workout-Eintrag: aktueller Bibliotheksname, sonst Snapshot */
  entryName: en => (Store.raw('exercises', en.exerciseId) || {}).name || en.exerciseName || 'Übung',
  type: ex => !ex ? 'kg' : ex.defaultUnit === 'sec' ? 'sec' : ex.defaultUnit === 'reps' ? 'reps' : 'kg',
  sorted: () => Store.all('exercises').slice().sort((a, b) => a.name.localeCompare(b.name, 'de')),
  /** Case-insensitiver Lookup auf Name + Aliase */
  findByName(name) {
    const n = norm(name);
    if (!n) return null;
    const all = Store.all('exercises');
    const exact = all.find(e => norm(e.name) === n) || all.find(e => (e.aliases || []).some(a => norm(a) === n));
    if (exact) return exact;
    // Fallback: gleiche Wörter in anderer Reihenfolge, Klammern/Bindestriche egal
    // („Triceps Pushdown (Rope)" = „Triceps Rope Pushdown")
    const k = wordKey(name);
    return all.find(e => [e.name, ...(e.aliases || [])].some(a => wordKey(a) === k)) || null;
  }
};
function exMeta() {
  const m = {};
  for (const e of Store.all('exercises')) m[e.id] = { category: e.category, muscleGroups: e.muscleGroups || [], defaultUnit: e.defaultUnit };
  return m;
}

/**
 * Baut den Analytics-Index aus allen Workouts. Bewusst „pure" und ohne Zugriff
 * auf äußere Variablen, damit die Funktion auch als Web Worker laufen kann.
 */
function buildIndex(W, EX) {
  const dnOf = s => { const p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); };
  const e1 = (w, r) => (w > 0 && r >= 1) ? w * (1 + r / 30) : 0;
  const ws = W.filter(w => w && typeof w.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(w.date)).slice()
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0));
  const rows = [], sessions = {}, prEvents = [], runBest = {};
  for (const w of ws) {
    const dn = dnOf(w.date);
    const row = {
      id: w.id, date: w.date, dn, name: w.planDayName || w.name || 'Freies Workout', startedAt: w.startedAt || null,
      dur: w.durationSec || 0, ton: 0, sets: 0, reps: 0, rpeSum: 0, rpeN: 0, rpeVol: 0, planned: 0, done: 0,
      muscles: {}, cats: {}, bins: [0, 0, 0, 0], restAvg: null, avgRpe: null, ex: [], exVol: {}, exSets: {}, exReps: {}, imp: !!w.importId,
      bw: w.bodyWeightKg || null, planId: w.planId || null, estDur: !!w.durationEstimated
    };
    const times = [];
    for (const en of (w.entries || [])) {
      const exId = en && en.exerciseId;
      if (!exId) continue;
      const meta = EX[exId] || {};
      let best = 0, bestSet = null, maxW = 0, repsAtMax = 0, vol = 0, n = 0, reps = 0, secs = 0;
      const list = [];
      for (const s of (en.sets || [])) {
        if (!s || s.warmup) continue;
        row.planned++;
        if (s.done === false) continue;
        row.done++;
        const r = +s.reps || 0, wt = +s.weightKg || 0, sec = +s.durationSec || 0;
        n++; reps += r; secs += sec;
        const v = r * wt;
        vol += v;
        if (s.rpe) { row.rpeSum += +s.rpe; row.rpeN++; row.rpeVol += v * (+s.rpe) / 10; }
        if (s.doneAt) times.push(s.doneAt);
        const e = e1(wt, r);
        if (e > best) { best = e; bestSet = { w: wt, r }; }
        if (r >= 1) {
          if (wt > maxW) { maxW = wt; repsAtMax = r; }
          else if (wt === maxW && r > repsAtMax) repsAtMax = r;
        }
        if (r > 0) row.bins[r <= 5 ? 0 : r <= 10 ? 1 : r <= 15 ? 2 : 3]++;
        for (const m of (meta.muscleGroups || [])) row.muscles[m] = (row.muscles[m] || 0) + 1;
        const cat = meta.category || 'Full Body';
        row.cats[cat] = (row.cats[cat] || 0) + 1;
        list.push({ r, w: wt, rpe: s.rpe || null, sec });
      }
      if (!n) continue;
      row.sets += n; row.reps += reps; row.ton += vol;
      row.exVol[exId] = (row.exVol[exId] || 0) + vol;
      row.exSets[exId] = (row.exSets[exId] || 0) + n;
      row.exReps[exId] = (row.exReps[exId] || 0) + reps;
      if (row.ex.indexOf(exId) < 0) row.ex.push(exId);
      const sess = { wid: w.id, date: w.date, dn, best, bestSet, maxW, repsAtMax, vol, sets: n, reps, secs, list };
      (sessions[exId] || (sessions[exId] = [])).push(sess);
      if (best > 0) {
        if (runBest[exId] === undefined) runBest[exId] = best;
        else if (best > runBest[exId] + 1e-9) {
          prEvents.push({ exId, wid: w.id, date: w.date, dn, e1rm: best, w: bestSet.w, r: bestSet.r, prev: runBest[exId] });
          runBest[exId] = best;
        }
      }
    }
    times.sort((a, b) => a - b);
    const gaps = [];
    for (let i = 1; i < times.length; i++) { const g = (times[i] - times[i - 1]) / 1000; if (g >= 15 && g <= 600) gaps.push(g); }
    if (gaps.length) row.restAvg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    row.avgRpe = row.rpeN ? row.rpeSum / row.rpeN : null;
    rows.push(row);
  }
  return { rows, sessions, prEvents, builtAt: Date.now() };
}

const Analytics = (() => {
  let idx = null, key = '', computing = false;
  let bw = null, bwKey = '';
  function cur() {
    const k = Store.ver('workouts') + ':' + Store.ver('exercises');
    if (idx && k === key) return idx;
    const W = Store.all('workouts');
    // Große Datenmengen (> 500 Workouts) im Web Worker neu rechnen, UI nicht blockieren
    if (idx && W.length > 500 && window.Worker && window.Blob) {
      if (!computing) runWorker(W, exMeta(), k);
      return idx;
    }
    idx = buildIndex(W, exMeta());
    key = k;
    return idx;
  }
  function runWorker(W, EX, k) {
    computing = true;
    let url;
    try {
      url = URL.createObjectURL(new Blob([`${buildIndex.toString()}\nonmessage = e => postMessage(buildIndex(e.data.W, e.data.EX));`], { type: 'text/javascript' }));
      const wk = new Worker(url);
      wk.onmessage = e => { idx = e.data; key = k; computing = false; wk.terminate(); URL.revokeObjectURL(url); scheduleRender(); };
      wk.onerror = () => { computing = false; wk.terminate(); URL.revokeObjectURL(url); idx = buildIndex(W, EX); key = k; scheduleRender(); };
      wk.postMessage({ W, EX });
    } catch (e) {
      computing = false;
      idx = buildIndex(W, EX); key = k;
    }
  }
  /** Körpergewicht-Zeitreihe aus Fortschritt + Workouts */
  function bwSeries() {
    const k = Store.ver('progress') + ':' + Store.ver('workouts');
    if (bw && k === bwKey) return bw;
    const m = new Map();
    for (const w of Store.all('workouts')) if (w.bodyWeightKg > 0 && isISO(w.date)) m.set(dayNum(w.date), +w.bodyWeightKg);
    for (const p of Store.all('progress')) if (p.bodyWeightKg > 0 && isISO(p.date)) m.set(dayNum(p.date), +p.bodyWeightKg);
    bw = [...m.entries()].map(([dn, kg]) => ({ dn, kg })).sort((a, b) => a.dn - b.dn);
    bwKey = k;
    return bw;
  }
  function bwAt(dn) {
    const s = bwSeries();
    if (!s.length) return null;
    let lo = 0, hi = s.length - 1, ans = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (s[mid].dn <= dn) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return ans >= 0 ? s[ans].kg : s[0].kg;
  }
  const sessionsOf = exId => cur().sessions[exId] || [];

  /** Zeitraum aus globalem Filter */
  function range() {
    const t = todayDN();
    const days = { '4w': 28, '3m': 91, '6m': 182, '1y': 365 }[UI.period];
    if (days) return { from: t - days + 1, to: t, len: days };
    if (UI.period === 'custom' && isISO(UI.customFrom) && isISO(UI.customTo)) {
      const a = dayNum(UI.customFrom), b = dayNum(UI.customTo);
      return { from: Math.min(a, b), to: Math.max(a, b), len: Math.abs(b - a) + 1, custom: true };
    }
    const rows = cur().rows;
    const first = rows.length ? Math.min(rows[0].dn, t) : t - 27;
    return { from: first, to: t, len: t - first + 1, all: true };
  }
  const prevRange = r => r.all ? null : { from: r.from - r.len, to: r.from - 1, len: r.len };
  const rowsIn = r => r ? cur().rows.filter(w => w.dn >= r.from && w.dn <= r.to) : [];
  function weeksOf(r) {
    const out = [];
    for (let w = weekStartDN(r.from); w <= r.to; w += 7) out.push(w);
    return out;
  }
  /** Wochen-Streak: aufeinanderfolgende Wochen mit ≥ 1 Workout */
  function streak() {
    const rows = cur().rows;
    const weeks = new Set(rows.map(w => weekStartDN(w.dn)));
    const cw = weekStartDN(todayDN());
    let curS = 0;
    let w = weeks.has(cw) ? cw : cw - 7;
    while (weeks.has(w)) { curS++; w -= 7; }
    let best = 0, run = 0, prev = null;
    for (const x of [...weeks].sort((a, b) => a - b)) { run = prev !== null && x - prev === 7 ? run + 1 : 1; best = Math.max(best, run); prev = x; }
    const thisWeekDays = new Set(rows.filter(r => r.dn >= cw).map(r => r.dn));
    return { cur: curS, best, thisWeek: rows.filter(r => r.dn >= cw).length, days: thisWeekDays };
  }
  function volumeBetween(a, b) { return sum(cur().rows.filter(w => w.dn >= a && w.dn <= b).map(w => w.ton)); }
  /** Nächster Tag im aktiven Split */
  function nextPlanDay(planId = S().activePlanId) {
    const plan = Store.raw('plans', planId);
    if (!plan || !plan.days || !plan.days.length) return null;
    const ws = Store.all('workouts').filter(w => w.planId === plan.id)
      .sort((a, b) => b.date.localeCompare(a.date) || (b.startedAt || 0) - (a.startedAt || 0));
    let i = 0;
    if (ws.length) {
      const last = ws[0];
      let li = Number.isInteger(last.planDayIndex) ? last.planDayIndex : plan.days.findIndex(d => d.name === last.planDayName);
      if (li >= 0) i = (li + 1) % plan.days.length;
    }
    return { plan, dayIndex: i, day: plan.days[i], doneToday: !!ws.length && ws[0].date === isoDate(), lastName: ws.length ? ws[0].planDayName : null };
  }
  /** Kompakter Cache für Firestore (meta/analyticsCache) */
  const persistCache = debounce(() => {
    const ix = buildIndex(Store.all('workouts'), exMeta());
    const byWeek = {}, byExerciseId = {}, byMuscle = {};
    for (const w of ix.rows) {
      const k = isoWeekKey(w.dn);
      const b = byWeek[k] || (byWeek[k] = { workouts: 0, tonnage: 0, sets: 0, reps: 0 });
      b.workouts++; b.tonnage = round(b.tonnage + w.ton, 1); b.sets += w.sets; b.reps += w.reps;
      for (const [m, c] of Object.entries(w.muscles)) byMuscle[m] = (byMuscle[m] || 0) + c;
    }
    for (const [id, ss] of Object.entries(ix.sessions)) {
      byExerciseId[id] = { sessions: ss.length, lastDate: ss[ss.length - 1].date, best1RM: round(maxOf(ss, s => s.best), 1), volume: round(sum(ss.map(s => s.vol)), 1) };
    }
    Store.put('meta', 'analyticsCache', { byWeek, byExerciseId, byMuscle, workouts: ix.rows.length, lastRecalc: Date.now() }, { replace: true });
  }, 2500);

  return { cur, bwSeries, bwAt, sessionsOf, range, prevRange, rowsIn, weeksOf, streak, volumeBetween, nextPlanDay, persistCache };
})();

/* ---------- Personal Records ---------- */
const PR = {
  /** PR-Kennzahlen aus allen Sessions einer Übung */
  compute(exId, ix) {
    const ss = ix.sessions[exId];
    if (!ss || !ss.length) return null;
    let bestW = 0, best1 = 0, bestV = 0, bestR = 0;
    for (const s of ss) { best1 = Math.max(best1, s.best); bestV = Math.max(bestV, s.vol); bestW = Math.max(bestW, s.maxW); }
    for (const s of ss) for (const x of s.list) if (x.r >= 1 && x.w === bestW && x.r > bestR) bestR = x.r;
    return { exerciseId: exId, exerciseName: Ex.name(exId), bestWeightKg: round(bestW, 2), best1RM: round(best1, 1), bestVolume: round(bestV, 1), bestReps: bestR, updatedAt: Date.now() };
  },
  /** Kennzahlen einer einzelnen Session (Workout-Eintrag) */
  ofEntry(entry) {
    let bestW = 0, best1 = 0, vol = 0, bestR = 0, bestSet = null, heavy = null;
    for (const s of entry.sets || []) {
      if (!s || s.warmup || s.done === false) continue;
      const r = +s.reps || 0, w = +s.weightKg || 0;
      vol += r * w;
      const e = e1rm(w, r);
      if (e > best1) { best1 = e; bestSet = { w, r }; }
      if (r >= 1 && (w > bestW || (w === bestW && r > bestR))) { bestW = w; bestR = r; heavy = { w, r }; }
    }
    return { bestW, best1, vol, bestR, bestSet, heavy };
  },
  /** Nach dem Workout: alte Werte vergleichen, nur Verbesserungen schreiben */
  updateAfterWorkout(workout) {
    const results = [];
    const ops = [];
    const seen = new Set();
    for (const en of workout.entries || []) {
      if (!en.exerciseId || seen.has(en.exerciseId)) continue;
      seen.add(en.exerciseId);
      const merged = { ...en, sets: workout.entries.filter(e => e.exerciseId === en.exerciseId).flatMap(e => e.sets || []) };
      const s = PR.ofEntry(merged);
      if (!s.bestR && !s.vol) continue;
      const old = Store.raw('prs', en.exerciseId);
      const name = en.exerciseName || Ex.name(en.exerciseId);
      if (!old) {
        ops.push({ type: 'put', coll: 'prs', id: en.exerciseId, doc: { exerciseId: en.exerciseId, exerciseName: name, bestWeightKg: round(s.bestW, 2), best1RM: round(s.best1, 1), bestVolume: round(s.vol, 1), bestReps: s.bestR, updatedAt: Date.now() } });
        results.push({ exId: en.exerciseId, name, first: true, s });
        continue;
      }
      const imp = {
        weight: s.bestW > (old.bestWeightKg || 0) + 1e-6,
        e1rm: s.best1 > (old.best1RM || 0) + 0.05,
        volume: s.vol > (old.bestVolume || 0) + 0.05,
        reps: Math.abs(s.bestW - (old.bestWeightKg || 0)) < 1e-6 && s.bestR > (old.bestReps || 0)
      };
      if (!imp.weight && !imp.e1rm && !imp.volume && !imp.reps) continue;
      const doc = {
        ...old,
        exerciseName: name,
        bestWeightKg: imp.weight ? round(s.bestW, 2) : old.bestWeightKg,
        bestReps: imp.weight ? s.bestR : Math.max(old.bestReps || 0, imp.reps ? s.bestR : 0),
        best1RM: imp.e1rm ? round(s.best1, 1) : old.best1RM,
        bestVolume: imp.volume ? round(s.vol, 1) : old.bestVolume,
        updatedAt: Date.now()
      };
      ops.push({ type: 'put', coll: 'prs', id: en.exerciseId, doc });
      results.push({ exId: en.exerciseId, name, imp, s, old });
    }
    if (ops.length) Store.batch(ops);
    return results;
  },
  /** Text für den PR-Toast */
  label(res) {
    const ex = Ex.get(res.exId);
    if (res.imp.weight && res.s.heavy) return `${res.name} ${fmtW(res.s.heavy.w)} × ${res.s.heavy.r}`;
    if (res.imp.e1rm && res.s.bestSet) return `${res.name} e1RM ${fmtW(res.s.best1)} (${fmtW(res.s.bestSet.w)} × ${res.s.bestSet.r})`;
    if (res.imp.reps) return `${res.name} ${Ex.type(ex) === 'reps' && !res.s.bestW ? '' : fmtW(res.s.bestW) + ' × '}${res.s.bestR} Wdh.`;
    return `${res.name} Volumen ${fmtTon(res.s.vol)}`;
  },
  /** Komplett neu berechnen (nach Import, Löschen, Bearbeiten) */
  async recalcAll() {
    const ix = buildIndex(Store.all('workouts'), exMeta());
    const ops = [];
    const ids = new Set(Object.keys(ix.sessions));
    for (const exId of ids) { const p = PR.compute(exId, ix); if (p) ops.push({ type: 'put', coll: 'prs', id: exId, doc: p, replace: true }); }
    for (const old of Store.all('prs')) if (!ids.has(old.id)) ops.push({ type: 'del', coll: 'prs', id: old.id });
    await Store.batch(ops);
    Analytics.persistCache();
    return ops.filter(o => o.type === 'put').length;
  }
};

/* ---------- Progressions-Vorschlag (Double Progression) ---------- */
function parseRange(reps) {
  const m = String(reps || '').match(/(\d+)\s*(?:[-–]\s*(\d+))?/);
  if (!m) return [null, null];
  const lo = +m[1], hi = m[2] ? +m[2] : +m[1];
  return [Math.min(lo, hi), Math.max(lo, hi)];
}
function weightStepKg(exId) {
  const ex = Ex.get(exId);
  const base = fromU(S().weightSteps);
  const heavy = ex && (ex.category === 'Legs' || /kreuzheben/.test(exId)) && ex.equipment !== 'Kurzhantel';
  return heavy ? base * 2 : base;
}
function suggestFor(exId, target) {
  const ss = Analytics.sessionsOf(exId);
  const ex = Ex.get(exId);
  if (!ss.length || Ex.type(ex) !== 'kg') return null;
  const last = ss[ss.length - 1];
  const [lo, hi] = parseRange(target && target.reps);
  const work = last.list.filter(s => s.r > 0 && s.w > 0);
  if (!work.length || !hi) return null;
  const topW = maxOf(work, s => s.w);
  const atTop = work.filter(s => s.w === topW);
  const needSets = Math.min((target && target.sets) || atTop.length, atTop.length);
  if (atTop.length >= needSets && atTop.every(s => s.r >= hi)) {
    const next = topW + weightStepKg(exId);
    return { type: 'up', weightKg: next, reps: lo, text: `Letztes Mal alle Sätze ${hi}+ Wdh. → heute ${fmtW(next)} × ${lo}` };
  }
  return { type: 'keep', weightKg: topW, reps: null, text: `Ziel: mehr Wdh. bei ${fmtW(topW)} (bis ${hi})` };
}


/* ==========================================================================
   7. Workout-Engine (aktives Workout in localStorage – überlebt Reloads)
   ========================================================================== */
const Workout = (() => {
  let w = null;
  try { w = JSON.parse(localStorage.getItem(LS.active)); } catch (e) { w = null; }
  const save = () => { try { if (w) localStorage.setItem(LS.active, JSON.stringify(w)); else localStorage.removeItem(LS.active); } catch (e) {} };

  function newSet(src = {}) {
    return { reps: src.reps ?? null, weightKg: src.weightKg ?? null, durationSec: src.durationSec ?? null, rpe: src.rpe ?? null, done: false, warmup: !!src.warmup, doneAt: null };
  }
  /** Übung als Eintrag anlegen – mit Werten vom letzten Mal bzw. Progressions-Vorschlag */
  function makeEntry(exId, target = {}) {
    const ex = Ex.get(exId);
    const nSets = target.sets || 3;
    const ss = Analytics.sessionsOf(exId);
    const last = ss.length ? ss[ss.length - 1] : null;
    const sug = target.reps ? suggestFor(exId, target) : null;
    const [lo] = parseRange(target.reps);
    const sets = [];
    for (let i = 0; i < nSets; i++) {
      const prev = last ? (last.list[i] || last.list[last.list.length - 1]) : null;
      const s = newSet();
      if (S().prefill) {
        if (Ex.type(ex) === 'sec') { s.durationSec = prev ? prev.sec || null : (lo || null); s.weightKg = prev && prev.w ? prev.w : null; }
        else if (sug && sug.type === 'up') { s.weightKg = sug.weightKg; s.reps = sug.reps; }
        else if (prev) { s.weightKg = prev.w || null; s.reps = prev.r || lo || null; }
        else if (lo) s.reps = lo;
      }
      sets.push(s);
    }
    return {
      uid: autoId().slice(0, 8), exerciseId: exId, exerciseName: ex ? ex.name : 'Übung',
      target: { sets: nSets, reps: target.reps ? String(target.reps) : '', restSec: target.restSec || S().defaultRestSec, notes: target.notes || '' },
      note: '', sets, suggestion: sug
    };
  }
  function start({ planId = null, dayIndex = null, name = 'Freies Workout', entries = [] } = {}) {
    if (w) { toast('Es läuft bereits ein Workout', 'warn'); App.go('training'); return; }
    const plan = planId ? Store.raw('plans', planId) : null;
    const day = plan && Number.isInteger(dayIndex) ? plan.days[dayIndex] : null;
    w = {
      id: autoId(), editingId: null, name: day ? day.name : name, planId: plan ? plan.id : null,
      planDayIndex: day ? dayIndex : null, planDayName: day ? day.name : null,
      date: isoDate(), startedAt: Date.now(), bodyWeightKg: null, notes: '',
      entries: day ? day.exercises.filter(x => Ex.get(x.exerciseId)).map(x => makeEntry(x.exerciseId, x)) : entries,
      rest: null, sel: { e: 0, s: 0 }
    };
    const lastBw = Analytics.bwSeries();
    if (lastBw.length && todayDN() - lastBw[lastBw.length - 1].dn < 14) w.bodyWeightKg = lastBw[lastBw.length - 1].kg;
    autoSelect();
    save();
    WakeLock.request();
    App.go('training');
    toast(`${w.name} gestartet – viel Erfolg! 💪`, 'success');
  }
  /** Vergangenes Workout bearbeiten oder wiederholen */
  function load(doc, { edit = false } = {}) {
    if (w) { toast('Bitte erst das laufende Workout beenden', 'warn'); return; }
    const entries = (doc.entries || []).map(en => {
      const ex = Ex.get(en.exerciseId);
      return {
        uid: autoId().slice(0, 8), exerciseId: en.exerciseId, exerciseName: ex ? ex.name : en.exerciseName,
        target: { sets: (en.sets || []).length, reps: '', restSec: S().defaultRestSec, notes: '' }, note: en.note || '',
        sets: (en.sets || []).map(s => edit ? { ...newSet(s), done: s.done !== false, doneAt: s.doneAt || null } : newSet({ ...s, rpe: null })),
        suggestion: null
      };
    });
    w = edit
      ? { ...doc, id: doc.id, editingId: doc.id, entries, rest: null, sel: { e: 0, s: 0 } }
      : { id: autoId(), editingId: null, name: doc.planDayName || doc.name || 'Workout', planId: doc.planId || null, planDayIndex: doc.planDayIndex ?? null, planDayName: doc.planDayName || null, date: isoDate(), startedAt: Date.now(), bodyWeightKg: null, notes: '', entries, rest: null, sel: { e: 0, s: 0 } };
    autoSelect();
    save();
    if (!edit) WakeLock.request();
    App.go('training');
  }
  function autoSelect() {
    if (!w) return;
    for (let e = 0; e < w.entries.length; e++) {
      const s = w.entries[e].sets.findIndex(x => !x.done);
      if (s >= 0) { w.sel = { e, s }; return; }
    }
    w.sel = { e: -1, s: -1 };
  }
  function discard() {
    w = null;
    save();
    RestTimer.stop();
    WakeLock.release();
  }
  /** Workout speichern → Firestore, PRs, Zusammenfassung */
  function finish() {
    if (!w) return null;
    const editing = w.editingId;
    const entries = w.entries.map(en => ({
      exerciseId: en.exerciseId,
      exerciseName: en.exerciseName,
      ...(en.note ? { note: en.note } : {}),
      sets: en.sets
        .filter(s => s.done || s.reps != null || s.weightKg != null || s.durationSec != null)
        .map(s => {
          const o = { reps: s.reps != null ? +s.reps : 0, weightKg: s.weightKg != null ? round(+s.weightKg, 3) : 0, rpe: s.rpe != null ? +s.rpe : null, done: !!s.done };
          if (s.warmup) o.warmup = true;
          if (s.durationSec != null) o.durationSec = +s.durationSec;
          if (s.doneAt) o.doneAt = s.doneAt;
          return o;
        })
    })).filter(en => en.sets.length);
    const endedAt = editing ? (w.endedAt || Date.now()) : Date.now();
    const doc = {
      date: w.date,
      startedAt: w.startedAt,
      endedAt,
      durationSec: editing ? (w.durationSec || Math.round((endedAt - w.startedAt) / 1000)) : Math.round((endedAt - w.startedAt) / 1000),
      planId: w.planId || null,
      planDayIndex: Number.isInteger(w.planDayIndex) ? w.planDayIndex : null,
      planDayName: w.planDayName || null,
      name: w.name || w.planDayName || 'Freies Workout',
      notes: w.notes || '',
      bodyWeightKg: w.bodyWeightKg ? round(+w.bodyWeightKg, 2) : null,
      entries,
      createdAt: editing ? (w.createdAt || Date.now()) : Date.now(),
      updatedAt: Date.now()
    };
    if (w.importId) doc.importId = w.importId;
    const id = editing || w.id;
    Store.put('workouts', id, doc, { replace: true });
    let prs = [];
    if (editing) PR.recalcAll();
    else prs = PR.updateAfterWorkout(doc);
    Analytics.persistCache();
    discard();
    return { id, doc, prs, editing };
  }
  return {
    cur: () => w, save, start, load, discard, finish, makeEntry, newSet, autoSelect,
    set(mut) { if (!w) return; mut(w); save(); }
  };
})();

/* ---------- Rest-Timer ---------- */
const RestTimer = (() => {
  let firedFor = null;
  function start(sec, label) {
    const w = Workout.cur();
    if (!w || !sec) return;
    w.rest = { endsAt: Date.now() + sec * 1000, total: sec, label: label || '' };
    firedFor = null;
    Workout.save();
    render();
  }
  function stop() {
    const w = Workout.cur();
    if (w) { w.rest = null; Workout.save(); }
    document.body.classList.remove('has-rest');
    const m = Modal.top();
    if (m && m.isRest) m.close();
    $('#restDock').innerHTML = '';
  }
  function adjust(d) {
    const w = Workout.cur();
    if (!w || !w.rest) return;
    w.rest.endsAt = Math.max(Date.now(), w.rest.endsAt + d * 1000);
    w.rest.total = Math.max(w.rest.total + d, 5);
    firedFor = null;
    Workout.save();
    tick();
  }
  const remaining = () => { const w = Workout.cur(); return w && w.rest ? (w.rest.endsAt - Date.now()) / 1000 : null; };
  function render() {
    const w = Workout.cur();
    const dock = $('#restDock');
    if (!w || !w.rest) { dock.innerHTML = ''; document.body.classList.remove('has-rest'); return; }
    document.body.classList.add('has-rest');
    dock.innerHTML = `<div class="rest-dock" id="restBox">
      <div class="rest-bar" id="restBar"></div>
      <div class="rest-row">
        <button class="rest-time" data-act="restBig" id="restTime" aria-label="Großer Countdown">0:00</button>
        <div class="rest-label"><b>Pause</b><br><span id="restLbl">${esc(w.rest.label)}</span></div>
        <button class="btn btn-sm btn-secondary" data-act="restAdj" data-d="-15">−15</button>
        <button class="btn btn-sm btn-secondary" data-act="restAdj" data-d="15">+15</button>
        <button class="btn-icon" data-act="restSkip" aria-label="Pause beenden">${icon('x')}</button>
      </div></div>`;
    tick();
  }
  function tick() {
    const w = Workout.cur();
    if (!w || !w.rest) return;
    const rem = remaining();
    const txt = rem > 0 ? fmtClock(Math.ceil(rem)) : '+' + fmtClock(-rem);
    const t = $('#restTime');
    if (t) t.textContent = rem > 0 ? txt : 'Los!';
    const bar = $('#restBar');
    if (bar) bar.style.transform = `scaleX(${clamp(rem / w.rest.total, 0, 1)})`;
    const box = $('#restBox');
    if (box) box.classList.toggle('done', rem <= 0);
    const big = $('#restBigTxt');
    if (big) big.textContent = rem > 0 ? fmtClock(Math.ceil(rem)) : 'Los!';
    const ring = $('#restRing');
    if (ring) ring.style.strokeDashoffset = String(ring.dataset.len * (1 - clamp(rem / w.rest.total, 0, 1)));
    if (rem <= 0 && firedFor !== w.rest.endsAt) {
      firedFor = w.rest.endsAt;
      done(w);
    }
    if (rem < -60) stop();
  }
  function done(w) {
    vibrate([220, 120, 220, 120, 400]);
    beep();
    const sel = w.sel && w.entries[w.sel.e];
    const next = sel ? `Weiter: ${sel.exerciseName} – Satz ${w.sel.s + 1}` : 'Weiter geht\'s!';
    if (document.visibilityState === 'hidden' && S().notifyRestDone) notify('Pause vorbei ⏱', next);
    else toast(`Pause vorbei – ${next.replace('Weiter: ', '')}`, 'success');
  }
  function openBig() {
    const w = Workout.cur();
    if (!w || !w.rest) return;
    const R = 120, L = 2 * Math.PI * R;
    const m = Modal.open({
      title: 'Pause', size: 'sm',
      body: `<div class="rest-big">
        <div class="rest-ring"><svg viewBox="0 0 280 280"><circle class="ring-bg" cx="140" cy="140" r="${R}" fill="none" stroke-width="14"/><circle id="restRing" class="ring-fg" cx="140" cy="140" r="${R}" fill="none" stroke-width="14" stroke-dasharray="${L}" data-len="${L}"/></svg>
          <div class="ring-txt"><b id="restBigTxt">0:00</b><span class="dim small">${esc(w.rest.label)}</span></div></div>
        <div class="row" style="width:100%">
          <button class="btn btn-secondary grow" data-act="restAdj" data-d="-15">−15 s</button>
          <button class="btn btn-secondary grow" data-act="restAdj" data-d="15">+15 s</button>
          <button class="btn btn-secondary grow" data-act="restAdj" data-d="60">+1 min</button>
        </div>
        <button class="btn btn-primary btn-block btn-lg" data-act="restSkip">${icon('skip')} Pause beenden</button>
      </div>`
    });
    m.isRest = true;
    tick();
  }
  Actions.restAdj = el => adjust(+el.dataset.d);
  Actions.restSkip = () => stop();
  Actions.restBig = () => openBig();
  return { start, stop, render, tick, remaining };
})();

            </div>
            <div class="col" style="gap:8px">
              ${d.exercises.map((x, xi) => `

                    <button class="btn-icon" data-pa="exDel" data-di="${di}" data-xi="${xi}" aria-label="Entfernen">${icon('x')}</button></div>
                  <div class="pe-fields">

                    <label><div class="mini-label">${Ex.type(Ex.get(x.exerciseId)) === 'sec' ? 'Sekunden' : 'Wdh.'}</div><input class="input" data-pe="reps" data-di="${di}" data-xi="${xi}" value="${esc(x.reps)}" placeholder="8-12"></label>
                    <label><div class="mini-label">Pause (s)</div><input class="input" inputmode="numeric" data-pe="restSec" data-di="${di}" data-xi="${xi}" value="${esc(x.restSec)}"></label>
                  </div>
                  <input class="input" data-pe="notes" data-di="${di}" data-xi="${xi}" value="${esc(x.notes || '')}" placeholder="Notiz (optional)" style="min-height:40px">
                </div>`).join('')}

            <button class="btn btn-secondary btn-block mt-12" data-pa="exAdd" data-di="${di}">${icon('plus')} Übungen hinzufügen</button>
          </div>`).join('')}
        <button class="btn btn-accent-ghost btn-block" data-pa="dayAdd">${icon('plus')} Trainingstag hinzufügen</button>
      </div>`);
  };
  render();
  m.body.addEventListener('input', e => {
    const t = e.target.closest('[data-pe]');
    if (!t) return;
    const k = t.dataset.pe, di = +t.dataset.di, xi = +t.dataset.xi;
    if (k === 'name' || k === 'description') draft[k] = t.value;
    else if (k === 'day') draft.days[di].name = t.value;
    else if (k === 'sets' || k === 'restSec') draft.days[di].exercises[xi][k] = parseInt(t.value, 10) || 0;
    else draft.days[di].exercises[xi][k] = t.value;
  });
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-pa], [data-x]');
    if (!b) return;
    const di = +b.dataset.di, xi = +b.dataset.xi;
    switch (b.dataset.pa || b.dataset.x) {
      case 'dayAdd': draft.days.push({ name: 'Tag ' + String.fromCharCode(65 + draft.days.length), exercises: [] }); break;
      case 'dayDel':
        if (draft.days[di].exercises.length && !await confirmDialog({ title: 'Tag entfernen?', text: `„${draft.days[di].name}" mit ${draft.days[di].exercises.length} Übungen entfernen?`, okLabel: 'Entfernen', danger: true })) return;
        draft.days.splice(di, 1); break;
      case 'dayUp': [draft.days[di - 1], draft.days[di]] = [draft.days[di], draft.days[di - 1]]; break;
      case 'exUp': { const a = draft.days[di].exercises; [a[xi - 1], a[xi]] = [a[xi], a[xi - 1]]; break; }
      case 'exDel': draft.days[di].exercises.splice(xi, 1); break;
      case 'exAdd': {
        const ids = await pickExercises({ multi: true, title: 'Übungen zum Tag hinzufügen' });
        if (!ids || !ids.length) return;
        ids.forEach(id => draft.days[di].exercises.push({ exerciseId: id, sets: 3, reps: Ex.type(Ex.get(id)) === 'sec' ? '60' : '8-12', restSec: S().defaultRestSec, notes: '' }));
        break;
      }
      case 'cancel': m.close(); return;
      case 'save': {
        if (!draft.name.trim()) { toast('Bitte einen Namen eingeben', 'warn'); return; }
        if (!draft.days.length) { toast('Mindestens ein Trainingstag nötig', 'warn'); return; }
        const id = plan ? plan.id : autoId();
        const doc = { name: draft.name.trim(), description: (draft.description || '').trim(), isCustom: plan ? !!plan.isCustom : true, days: draft.days.map(d => ({ name: d.name.trim() || 'Tag', exercises: d.exercises.map(x => ({ exerciseId: x.exerciseId, sets: Math.max(1, +x.sets || 1), reps: String(x.reps || ''), restSec: +x.restSec || S().defaultRestSec, notes: x.notes || '' })) })), createdAt: plan ? plan.createdAt || Date.now() : Date.now(), updatedAt: Date.now() };
        Store.put('plans', id, doc, { replace: true });
        m.close();
        toast('Plan gespeichert', 'success');
        if (!plan && !Store.raw('plans', S().activePlanId)) Store.saveSettings({ activePlanId: id });
        return;
      }
      default: return;
    }
    render();
  });
}

/* ---------- Verlauf + Kalender ---------- */
function renderHistory(el) {
  const ix = Analytics.cur();
  const rows = ix.rows.slice().reverse();
  const t = new Date();
  const [cy, cm] = (UI.calMonth || `${t.getFullYear()}-${t.getMonth()}`).split('-').map(Number);
  const first = new Date(cy, cm, 1);
  const startOff = S().weekStart === 'sunday' ? first.getDay() : (first.getDay() + 6) % 7;
  const daysInMonth = new Date(cy, cm + 1, 0).getDate();
  const byDate = {};
  for (const r of ix.rows) (byDate[r.date] || (byDate[r.date] = [])).push(r);
  const heads = S().weekStart === 'sunday' ? ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'] : ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  let cells = '';
  for (let i = 0; i < startOff; i++) cells += '<span></span>';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${cy}-${pad(cm + 1)}-${pad(d)}`;
    const has = byDate[iso];
    cells += `<button class="${has ? 'has' : ''} ${iso === isoDate() ? 'today' : ''}" ${has ? `data-act="openWorkout" data-id="${esc(has[has.length - 1].id)}"` : 'disabled'} aria-label="${d}. ${has ? has.map(x => x.name).join(', ') : 'kein Training'}">${d}</button>`;
  }
  const monthCount = Object.keys(byDate).filter(k => k.startsWith(`${cy}-${pad(cm + 1)}`)).length;
  // Gruppierung nach Monat
  const groups = [];
  for (const r of rows) {
    const k = r.date.slice(0, 7);
    if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  el.innerHTML = `
    <div class="card">
      <div class="row between mb-8">
        <button class="btn-icon" data-act="calNav" data-d="-1" aria-label="Vorheriger Monat">${icon('chevL')}</button>
        <div class="center"><b>${first.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</b><div class="tiny dim">${monthCount} Trainingstage</div></div>
        <button class="btn-icon" data-act="calNav" data-d="1" aria-label="Nächster Monat">${icon('chevR')}</button>
      </div>
      <div class="cal">${heads.map(h => `<span class="cal-h">${h}</span>`).join('')}${cells}</div>
    </div>
    ${groups.length ? groups.slice(0, UI.histMore ? 999 : 6).map(g => `
      <div class="section-head"><h4>${parseISO(g.k + '-01').toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</h4><span class="tiny dim">${g.items.length} Workouts · ${fmtTon(sum(g.items.map(x => x.ton)))}</span></div>
      <div class="col">${g.items.map(miniWorkoutCard).join('')}</div>`).join('')
      + (groups.length > 6 && !UI.histMore ? `<button class="btn btn-secondary btn-block mt-16" data-act="histMore">Ältere Monate anzeigen</button>` : '')
    : `<div class="card mt-16">${emptyState('history', 'Noch kein Verlauf', 'Abgeschlossene Workouts erscheinen hier.')}</div>`}`;
}
Actions.calNav = el => {
  const t = new Date();
  let [y, m] = (UI.calMonth || `${t.getFullYear()}-${t.getMonth()}`).split('-').map(Number);
  m += +el.dataset.d;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  UI.calMonth = `${y}-${m}`;
  saveUI();
  App.renderCurrent();
};
Actions.histMore = () => { UI.histMore = true; App.renderCurrent(); };

        Store.del('workouts', id);
        m.close();

        toast('Workout gelöscht', 'success');
      }
    } else if (b.dataset.x === 'edit') { m.close(); Workout.load(wo, { edit: true }); }
    else if (b.dataset.x === 'repeat') { m.close(); Workout.load(wo); }

function workoutText(wo) {
  const lines = [`🏋️ ${wo.planDayName || wo.name || 'Workout'} – ${fmtDate(wo.date)}`, `⏱ ${fmtDur(wo.durationSec)}`];
  let ton = 0;
  for (const en of wo.entries || []) {
    const done = (en.sets || []).filter(s => s.done !== false && !s.warmup);
    if (!done.length) continue;
    ton += sum(done.map(s => (s.reps || 0) * (s.weightKg || 0)));
    const isSec = Ex.type(Ex.get(en.exerciseId)) === 'sec';
    lines.push(`• ${Ex.entryName(en)}: ${done.map(s => isSec ? fmtClock(s.durationSec || 0) : (s.weightKg ? `${wNum(s.weightKg)}×${s.reps}` : `${s.reps}`)).join(', ')}`);
  }
  lines.splice(2, 0, `📊 ${fmtTon(ton)} Volumen`);
  lines.push('', `– getrackt mit ${APP.name}`);
  return lines.join('\n');
}
async function shareWorkout(wo) {
  const text = workoutText(wo);
  try {
    if (navigator.share) { await navigator.share({ title: APP.name, text }); return; }
    await navigator.clipboard.writeText(text);
    toast('In die Zwischenablage kopiert', 'success');
  } catch (e) { if (e.name !== 'AbortError') toast('Teilen nicht möglich', 'error'); }
}


/* ---------- Aktives Workout rendern ---------- */
function liveStats(w) {
  let total = 0, done = 0, vol = 0;
  for (const en of w.entries) for (const s of en.sets) {
    if (s.warmup) continue;
    total++;
    if (s.done) { done++; vol += (+s.reps || 0) * (+s.weightKg || 0); }
  }
  return { total, done, vol };
}
function lastSessionFor(exId, w) {
  const ss = Analytics.sessionsOf(exId).filter(s => s.wid !== w.editingId && s.wid !== w.id);
  return ss.length ? ss[ss.length - 1] : null;
}
function renderActiveWorkout(el, w) {

function exerciseCard(en, ei, w) {
  const ex = Ex.get(en.exerciseId);
  const type = Ex.type(ex);
  const last = lastSessionFor(en.exerciseId, w);
  const pr = Store.raw('prs', en.exerciseId);
  const doneN = en.sets.filter(s => s.done).length;
  const complete = en.sets.length > 0 && doneN === en.sets.length;
  const t = en.target || {};
  const targetTxt = [t.reps ? `${t.sets} × ${t.reps}${type === 'sec' ? ' s' : ''}` : `${en.sets.length} Sätze`, `Pause ${fmtClock(t.restSec || S().defaultRestSec)}`].join(' · ');
  const fmtPrev = s => !s ? '–' : type === 'sec' ? fmtClock(s.sec || 0) + (s.w ? ` +${wNum(s.w)}` : '') : (s.w ? `${wNum(s.w)}×${s.r}` : `${s.r}`);
  const lastTxt = last ? `Letztes Mal ${fmtDateShort(last.date)}: ${last.list.map(fmtPrev).join(' · ')}` : '';
  let workNo = 0;
  const rows = en.sets.map((s, si) => {
    const num = s.warmup ? 'W' : ++workNo;
    const prev = last && !s.warmup ? (last.list[num - 1] || null) : null;
    const sel = w.sel.e === ei && w.sel.s === si;
    const isPR = s.done && !s.warmup && pr && type !== 'sec' && ((+s.weightKg || 0) > (pr.bestWeightKg || 0) + 1e-6 || e1rm(+s.weightKg, +s.reps) > (pr.best1RM || 0) + 0.05);
    return setRow(ei, si, s, num, prev, type, sel, isPR, fmtPrev) + (sel ? setPanel(ei, si, s, type) : '');
  }).join('');
  return `<div class="ex-card ${complete ? 'complete' : ''}" id="ex-${en.uid}">
    <div class="ex-card-head">
      <div class="grow" style="min-width:0">
        <button class="ex-name" data-act="openExercise" data-id="${esc(en.exerciseId)}">${esc(en.exerciseName)}</button>
        <div class="ex-target">${esc(targetTxt)} · ${doneN}/${en.sets.length} ✓</div>
      </div>
      <button class="btn-icon" data-act="exMenu" data-ei="${ei}" aria-label="Übungs-Menü">${icon('dots')}</button>
    </div>
    <div class="ex-hints">
      ${lastTxt ? `<span class="hint-chip">${esc(lastTxt)}</span>` : '<span class="hint-chip">Erstes Mal – viel Spaß!</span>'}
      ${en.suggestion ? `<span class="hint-chip ${en.suggestion.type === 'up' ? 'up' : ''}">${en.suggestion.type === 'up' ? '↑ ' : ''}${esc(en.suggestion.text)}</span>` : ''}
      ${t.notes ? `<span class="hint-chip note">${esc(t.notes)}</span>` : ''}
      ${en.note ? `<span class="hint-chip note">📝 ${esc(en.note)}</span>` : ''}
    </div>
    <div class="set-head"><span>Satz</span><span>Vorher</span><span>${type === 'kg' ? unit() : '+' + unit()}</span><span>${type === 'sec' ? 'Sek.' : 'Wdh.'}</span><span class="rpe-h">RPE</span><span></span></div>
    ${rows}
    <div class="ex-foot">
      <button class="btn btn-secondary btn-sm" data-act="setAdd" data-ei="${ei}">${icon('plus')} Satz</button>
      ${type === 'kg' ? `<button class="btn btn-ghost btn-sm" data-act="warmup" data-ei="${ei}">${icon('flame')} Aufwärmen</button>` : ''}
    </div>
  </div>`;
}
function setRow(ei, si, s, num, prev, type, sel, isPR, fmtPrev) {
  const bVal = type === 'sec' ? s.durationSec : s.reps;
  const wPh = prev && prev.w ? inputW(prev.w) : '';
  const bPh = prev ? (type === 'sec' ? (prev.sec || '') : (prev.r || '')) : '';
  const d = `data-ei="${ei}" data-si="${si}"`;
  return `<div class="set-row ${s.done ? 'done' : ''} ${sel ? 'sel' : ''}" ${d}>

    <span class="set-prev" data-act="setSel" ${d}>${isPR ? '<span class="accent bold">🏆 PR</span>' : fmtPrev(prev)}</span>
    <input class="set-in" inputmode="decimal" data-in="setW" ${d} value="${inputW(s.weightKg)}" placeholder="${esc(wPh)}" aria-label="Gewicht" enterkeyhint="next">
    <input class="set-in" inputmode="numeric" data-in="setB" ${d} value="${bVal ?? ''}" placeholder="${esc(bPh)}" aria-label="${type === 'sec' ? 'Sekunden' : 'Wiederholungen'}" enterkeyhint="done">
    <select class="set-rpe" data-ch="setRpe" ${d} aria-label="RPE"><option value="">–</option>${RPE_VALUES.map(v => `<option value="${v}" ${+s.rpe === v ? 'selected' : ''}>${nf(v, 1)}</option>`).join('')}</select>

function setPanel(ei, si, s, type) {
  const d = `data-ei="${ei}" data-si="${si}"`;
  return `<div class="set-panel" ${d}>
    <div><div class="stepper-label">${type === 'kg' ? 'Gewicht' : 'Zusatzgewicht'} (${unit()})</div>

      <button data-act="step" data-f="w" data-d="1" ${d} aria-label="Mehr Gewicht">${icon('plus')}</button></div></div>
    <div><div class="stepper-label">${type === 'sec' ? 'Sekunden' : 'Wiederholungen'}</div>
      <div class="stepper"><button data-act="step" data-f="b" data-d="-1" ${d} aria-label="Weniger">${icon('minus')}</button>
      <input inputmode="numeric" data-in="setB" ${d} value="${(type === 'sec' ? s.durationSec : s.reps) ?? ''}" placeholder="0" aria-label="${type === 'sec' ? 'Sekunden' : 'Wiederholungen'}">
      <button data-act="step" data-f="b" data-d="1" ${d} aria-label="Mehr">${icon('plus')}</button></div></div>
    ${S().showRPE ? `<div class="rpe-chips"><span class="tiny dim bold" style="width:30px">RPE</span>${[6, 7, 8, 9, 10].map(v => `<button data-act="rpePick" data-v="${v}" ${d} class="${+s.rpe === v ? 'active' : ''}">${v}</button>`).join('')}</div>` : ''}
    <div class="panel-actions">
      ${type === 'kg' ? `<button class="btn btn-ghost btn-sm" data-act="plates" ${d}>${icon('plate')} Scheiben</button>` : ''}
      <span class="grow"></span>
      <button class="btn ${s.done ? 'btn-secondary' : 'btn-primary'}" data-act="setDone" ${d}>${icon(s.done ? 'undo' : 'check')} ${s.done ? 'Rückgängig' : 'Satz erledigt'}</button>
    </div>

}
function updateTopH() {
  const tb = $('#topbar');
  if (tb) document.documentElement.style.setProperty('--top-h', tb.offsetHeight + 'px');
}
window.addEventListener('resize', debounce(updateTopH, 150));

/* ---------- Interaktionen im Workout ---------- */
const entryAt = el => { const w = Workout.cur(); return w ? w.entries[+el.dataset.ei] : null; };
const setAt = el => { const en = entryAt(el); return en ? en.sets[+el.dataset.si] : null; };
function syncInputs(el, field, value) {
  $$(`[data-in="${field}"][data-ei="${el.dataset.ei}"][data-si="${el.dataset.si}"]`).forEach(i => { if (i !== el) i.value = value; });
}
Inputs.setW = el => {
  const s = setAt(el); if (!s) return;
  const v = parseNum(el.value);
  s.weightKg = v == null ? null : Math.max(0, fromU(v));
  Workout.save();
  syncInputs(el, 'setW', el.value);
};
Inputs.setB = el => {
  const s = setAt(el); const en = entryAt(el); if (!s) return;
  const v = parseNum(el.value);
  const val = v == null ? null : Math.max(0, Math.round(v));
  if (Ex.type(Ex.get(en.exerciseId)) === 'sec') s.durationSec = val; else s.reps = val;
  Workout.save();
  syncInputs(el, 'setB', el.value);
};
Changes.setRpe = el => { const s = setAt(el); if (!s) return; s.rpe = el.value ? +el.value : null; Workout.save(); };
Inputs.woBw = el => Workout.set(w => { const v = parseNum(el.value); w.bodyWeightKg = v ? fromU(v) : null; });
Inputs.woNotes = el => Workout.set(w => { w.notes = el.value; });
Changes.woDate = el => { if (isISO(el.value)) Workout.set(w => { w.date = el.value; }); };

/* Satz auswählen → Stepper-Panel unter die Zeile schieben (ohne kompletten Re-Render) */
function selectSet(ei, si, { rerender = false } = {}) {
  const w = Workout.cur(); if (!w) return;
  if (w.sel.e === ei && w.sel.s === si && !rerender) return;
  w.sel = { e: ei, s: si };
  Workout.save();
  if (rerender) return App.renderCurrent();
  $$('.set-row.sel').forEach(r => r.classList.remove('sel'));
  $$('.set-panel').forEach(p => p.remove());
  const row = $(`.set-row[data-ei="${ei}"][data-si="${si}"]`);
  if (!row) return;
  row.classList.add('sel');
  const en = w.entries[ei];
  row.insertAdjacentHTML('afterend', setPanel(ei, si, en.sets[si], Ex.type(Ex.get(en.exerciseId))));
}
Actions.setSel = el => selectSet(+el.dataset.ei, +el.dataset.si);
document.addEventListener('focusin', e => {
  const i = e.target.closest('.set-row .set-in, .set-row .set-rpe');
  if (i) selectSet(+i.dataset.ei, +i.dataset.si);
});
Actions.step = el => {
  const s = setAt(el), en = entryAt(el); if (!s) return;
  const type = Ex.type(Ex.get(en.exerciseId));
  const d = +el.dataset.d;
  const w = Workout.cur();
  const last = lastSessionFor(en.exerciseId, w);
  const workNo = en.sets.slice(0, +el.dataset.si + 1).filter(x => !x.warmup).length;
  const prev = last && !s.warmup ? last.list[workNo - 1] : null;
  if (el.dataset.f === 'w') {
    const cur = s.weightKg != null ? toU(s.weightKg) : (prev && prev.w ? toU(prev.w) : 0);
    // Krumme Werte (z. B. aus lb umgerechnet) zuerst aufs Inkrement-Raster ziehen
    const st = S().weightSteps, k = cur / st;
    const onGrid = Math.abs(k - Math.round(k)) < 1e-6;
    const next = Math.max(0, round(onGrid ? cur + d * st : (d > 0 ? Math.ceil(k) : Math.floor(k)) * st, 2));
    s.weightKg = fromU(next);
    $$(`[data-in="setW"][data-ei="${el.dataset.ei}"][data-si="${el.dataset.si}"]`).forEach(i => { i.value = inputW(s.weightKg); });
  } else {
    const key = type === 'sec' ? 'durationSec' : 'reps';
    const step = type === 'sec' ? 5 : 1;
    const cur = s[key] != null ? s[key] : (prev ? (type === 'sec' ? prev.sec : prev.r) || 0 : 0);
    s[key] = Math.max(0, cur + d * step);
    $$(`[data-in="setB"][data-ei="${el.dataset.ei}"][data-si="${el.dataset.si}"]`).forEach(i => { i.value = s[key]; });
  }
  vibrate(8);
  Workout.save();
};
Actions.rpePick = el => {
  const s = setAt(el); if (!s) return;
  s.rpe = +s.rpe === +el.dataset.v ? null : +el.dataset.v;
  Workout.save();
  $$(`.rpe-chips button[data-ei="${el.dataset.ei}"][data-si="${el.dataset.si}"]`).forEach(b => b.classList.toggle('active', +b.dataset.v === +s.rpe));
  const sel = $(`.set-rpe[data-ei="${el.dataset.ei}"][data-si="${el.dataset.si}"]`);
  if (sel) sel.value = s.rpe ? String(s.rpe) : '';
};
Actions.setDone = el => {
  const w = Workout.cur();
  const ei = +el.dataset.ei, si = +el.dataset.si;
  const en = w.entries[ei], s = en.sets[si];
  if (!s) return;
  if (s.done) {
    s.done = false; s.doneAt = null;
    w.sel = { e: ei, s: si };
    Workout.save();
    return App.renderCurrent();
  }
  const type = Ex.type(Ex.get(en.exerciseId));
  // Leere Felder mit den Werten vom letzten Mal (Placeholder) füllen
  const row = $(`.set-row[data-ei="${ei}"][data-si="${si}"]`);
  if (row) {
    const [wi, bi] = $$('.set-in', row);
    if (s.weightKg == null && wi && wi.placeholder) s.weightKg = fromU(parseNum(wi.placeholder));
    if (type === 'sec') { if (s.durationSec == null && bi && bi.placeholder) s.durationSec = parseNum(bi.placeholder); }
    else if (s.reps == null && bi && bi.placeholder) s.reps = parseNum(bi.placeholder);
  }
  if (type === 'kg' && s.weightKg == null) {
    toast('Bitte Gewicht eintragen (0 für ohne Gewicht)', 'warn');
    selectSet(ei, si);
    const wi = $('.set-panel [data-in="setW"]') || (row && $$('.set-in', row)[0]);
    if (wi) wi.focus();
    return;
  }
  const count = type === 'sec' ? s.durationSec : s.reps;
  if (!count || count < 1) {
    toast(type === 'sec' ? 'Bitte Dauer in Sekunden eintragen' : 'Bitte Wiederholungen eintragen', 'warn');
    selectSet(ei, si);
    const inp = $(`.set-panel [data-in="setB"]`) || (row && $$('.set-in', row)[1]);
    if (inp) inp.focus();
    return;
  }
  s.done = true;
  s.doneAt = Date.now();
  vibrate(25);
  const wasLast = w.entries.every(e => e.sets.every(x => x.done));
  Workout.autoSelect();
  // Nächsten Satz mit gleichem Gewicht vorbelegen, falls leer
  const nx = en.sets[si + 1];
  if (nx && !nx.done && nx.weightKg == null && !nx.warmup && !s.warmup) nx.weightKg = s.weightKg;
  Workout.save();
  if (!wasLast && !w.editingId) {
    const rest = s.warmup ? Math.min(60, en.target.restSec || S().defaultRestSec) : (en.target.restSec || S().defaultRestSec);
    const nxt = w.sel.e >= 0 ? w.entries[w.sel.e] : null;
    RestTimer.start(rest, nxt ? `Als Nächstes: ${nxt.exerciseName} · Satz ${w.sel.s + 1}` : '');
  }
  if (wasLast) toast('Alle Sätze erledigt – stark! Jetzt „Beenden" tippen.', 'success');
  App.renderCurrent();
};
Actions.setAdd = el => {
  const w = Workout.cur(); const en = w.entries[+el.dataset.ei];
  const lastSet = [...en.sets].reverse().find(s => !s.warmup);
  const ns = Workout.newSet(lastSet ? { reps: lastSet.reps, weightKg: lastSet.weightKg, durationSec: lastSet.durationSec } : {});
  en.sets.push(ns);
  w.sel = { e: +el.dataset.ei, s: en.sets.length - 1 };
  Workout.save();
  App.renderCurrent();
};
Actions.setMenu = async el => {
  const w = Workout.cur(); const ei = +el.dataset.ei, si = +el.dataset.si;
  const en = w.entries[ei], s = en.sets[si];
  const k = await actionMenu(`${en.exerciseName} – Satz`, [
    { key: 'warm', label: s.warmup ? 'Als Arbeitssatz markieren' : 'Als Aufwärmsatz markieren', sub: 'Aufwärmsätze zählen nicht für Volumen & PRs', icon: 'flame' },
    { key: 'dup', label: 'Satz duplizieren', icon: 'copy' },
    { key: 'del', label: 'Satz löschen', icon: 'trash', danger: true }
  ]);
  if (!k) return;
  if (k === 'warm') s.warmup = !s.warmup;
  if (k === 'dup') en.sets.splice(si + 1, 0, { ...s, done: false, doneAt: null });
  if (k === 'del') { en.sets.splice(si, 1); Workout.autoSelect(); }
  Workout.save();
  App.renderCurrent();
};
Actions.exMenu = async el => {
  const w = Workout.cur(); const ei = +el.dataset.ei; const en = w.entries[ei];
  const k = await actionMenu(en.exerciseName, [
    { key: 'note', label: en.note ? 'Notiz bearbeiten' : 'Notiz hinzufügen', icon: 'note' },
    { key: 'rest', label: 'Pausenzeit ändern', sub: `aktuell ${fmtClock(en.target.restSec || S().defaultRestSec)}`, icon: 'timer' },
    { key: 'swap', label: 'Übung ersetzen', icon: 'swap' },
    ei > 0 && { key: 'up', label: 'Nach oben', icon: 'arrowUp' },
    ei < w.entries.length - 1 && { key: 'down', label: 'Nach unten', icon: 'arrowDown' },
    { key: 'info', label: 'Übungs-Details & Verlauf', icon: 'chart' },
    { key: 'del', label: 'Übung entfernen', icon: 'trash', danger: true }
  ]);
  if (!k) return;
  if (k === 'note') {
    const v = await promptDialog({ title: 'Notiz', label: en.exerciseName, value: en.note || '', placeholder: 'z. B. Sitzhöhe 4, enger Griff' });
    if (v != null) en.note = v.trim();
  } else if (k === 'rest') {
    const v = await promptDialog({ title: 'Pausenzeit', label: 'Sekunden', value: String(en.target.restSec || S().defaultRestSec), inputmode: 'numeric' });
    if (v != null && parseNum(v) > 0) en.target.restSec = Math.round(parseNum(v));
  } else if (k === 'swap') {
    const ids = await pickExercises({ multi: false, title: 'Übung ersetzen' });
    if (!ids || !ids[0]) return;
    const fresh = Workout.makeEntry(ids[0], { ...en.target, sets: en.sets.length });
    w.entries[ei] = { ...fresh, target: { ...en.target }, note: en.note };
  } else if (k === 'up' || k === 'down') {
    const j = k === 'up' ? ei - 1 : ei + 1;
    [w.entries[ei], w.entries[j]] = [w.entries[j], w.entries[ei]];
  } else if (k === 'info') { openExerciseDetail(en.exerciseId); return; }
  else if (k === 'del') {
    if (en.sets.some(s => s.done) && !await confirmDialog({ title: 'Übung entfernen?', text: `${en.exerciseName} hat bereits erledigte Sätze. Trotzdem entfernen?`, okLabel: 'Entfernen', danger: true })) return;
    w.entries.splice(ei, 1);
  }
  Workout.autoSelect();
  Workout.save();
  App.renderCurrent();
};
Actions.warmup = el => {
  const w = Workout.cur(); const en = w.entries[+el.dataset.ei];
  const first = en.sets.find(s => !s.warmup);
  const ex = Ex.get(en.exerciseId);
  let target = first && first.weightKg;
  if (!target) { const l = lastSessionFor(en.exerciseId, w); target = l ? l.maxW : null; }
  if (!target) return toast('Erst ein Arbeitsgewicht eintragen', 'warn');
  if (en.sets.some(s => s.warmup) && en.sets.filter(s => s.warmup).every(s => !s.done)) en.sets = en.sets.filter(s => !s.warmup);
  const bar = ex && ex.equipment === 'Langhantel' ? S().barKg : 0;
  const step = fromU(S().weightSteps);
  const scheme = bar ? [[0, 10], [0.4, 5], [0.6, 3], [0.8, 2]] : [[0.5, 8], [0.75, 4]];
  const sets = [];
  for (const [p, r] of scheme) {
    let kg = p === 0 ? bar : Math.max(bar, Math.round(target * p / step) * step);
    if (kg >= target || sets.some(s => s.weightKg === kg)) continue;
    if (p === 0 && target - bar < 20) continue;
    sets.push(Workout.newSet({ weightKg: kg, reps: r, warmup: true }));
  }
  if (!sets.length) return toast('Gewicht zu leicht für Aufwärmsätze', 'info');
  en.sets.unshift(...sets);
  Workout.autoSelect();
  Workout.save();
  App.renderCurrent();
  toast(`${sets.length} Aufwärmsätze hinzugefügt`, 'success');
};
Actions.woAddEx = async () => {
  const ids = await pickExercises({ multi: true, title: 'Übungen hinzufügen' });
  if (!ids || !ids.length) return;
  const w = Workout.cur();
  if (!w) return;
  ids.forEach(id => w.entries.push(Workout.makeEntry(id, { sets: 3 })));
  Workout.autoSelect();
  Workout.save();
  App.renderCurrent();
  setTimeout(() => { const last = w.entries[w.entries.length - ids.length]; const c = last && $('#ex-' + last.uid); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
};
Actions.woRename = async () => {
  const w = Workout.cur();
  const v = await promptDialog({ title: 'Workout umbenennen', label: 'Name', value: w.name });
  if (v && v.trim()) { Workout.set(x => { x.name = v.trim(); }); App.renderCurrent(); }
};
Actions.woCancel = async () => {
  const w = Workout.cur();
  const ok = await confirmDialog({
    title: w.editingId ? 'Änderungen verwerfen?' : 'Workout abbrechen?',
    text: w.editingId ? 'Das gespeicherte Workout bleibt unverändert.' : 'Alle Sätze dieses Workouts gehen verloren. Das kann nicht rückgängig gemacht werden.',
    okLabel: w.editingId ? 'Verwerfen' : 'Abbrechen & löschen', cancelLabel: 'Weiter trainieren', danger: true
  });
  if (!ok) return;
  Workout.discard();
  App.renderCurrent();
  toast(w.editingId ? 'Änderungen verworfen' : 'Workout verworfen', 'info');
};
Actions.woFinish = async () => {
  const w = Workout.cur();
  if (!w) return;
  const st = liveStats(w);
  const open = st.total - st.done;
  if (!st.done) {
    if (!await confirmDialog({ title: 'Noch kein Satz erledigt', text: 'Es wurde noch kein Satz abgehakt. Trotzdem speichern?', okLabel: 'Speichern' })) return;
  } else if (!await confirmDialog({
    title: w.editingId ? 'Änderungen speichern?' : 'Workout beenden?',
    text: open ? `${open} ${open === 1 ? 'Satz ist' : 'Sätze sind'} noch offen und ${open === 1 ? 'wird' : 'werden'} als „nicht erledigt" gespeichert.` : 'Alle Sätze erledigt – sauber!',
    okLabel: w.editingId ? 'Speichern' : 'Beenden & speichern'
  })) return;
  const res = Workout.finish();
  if (!res) return;
  App.go('start');
  if (res.editing) { toast('Workout aktualisiert', 'success'); return; }
  showSummary(res);
};

/* ---------- Session-Zusammenfassung ---------- */
function showSummary({ id, doc, prs }) {
  const done = doc.entries.flatMap(e => e.sets.filter(s => s.done && !s.warmup));
  const vol = sum(done.map(s => s.reps * s.weightKg));
  const rpes = done.filter(s => s.rpe).map(s => s.rpe);
  const real = prs.filter(p => !p.first);
  const firsts = prs.filter(p => p.first);
  // Vergleich mit dem letzten gleichen Plan-Tag
  const prevSame = Analytics.cur().rows.filter(r => r.id !== id && ((doc.planId && r.planId === doc.planId && r.name === doc.planDayName) || (!doc.planId && r.name === doc.name))).pop();
  const m = Modal.open({
    title: 'Workout gespeichert',
    body: `<div class="center" style="padding:6px 0 4px">
        <div style="font-size:52px;line-height:1">${real.length ? '🏆' : '💪'}</div>
        <h2 class="mt-8">${esc(doc.planDayName || doc.name)}</h2>
        <p class="dim">${esc(fmtDateLong(doc.date))}</p>
      </div>
      <div class="pr-grid mt-16">
        <div class="pr-box"><span>Dauer</span><b>${fmtDur(doc.durationSec)}</b></div>
        <div class="pr-box"><span>Volumen</span><b>${fmtTon(vol)}</b>${prevSame ? `<em>${deltaHtml(vol, prevSame.ton)} vs. ${fmtDateShort(prevSame.date)}</em>` : ''}</div>
        <div class="pr-box"><span>Sätze</span><b>${done.length}</b></div>
        <div class="pr-box"><span>Ø RPE</span><b>${rpes.length ? nf(avg(rpes), 1) : '–'}</b></div>
      </div>
      ${real.length ? `<h4 class="mt-24 mb-8">Neue PRs</h4><div class="list">${real.map(p => `<div class="list-item"><span class="li-icon" style="color:var(--accent-text)">${icon('trophy')}</span><span class="li-main"><span class="li-title">${esc(PR.label(p))}</span><div class="li-sub">${[p.imp.weight && 'Gewicht', p.imp.e1rm && 'e1RM', p.imp.volume && 'Volumen', p.imp.reps && 'Wiederholungen'].filter(Boolean).join(' · ')}</div></span></div>`).join('')}</div>` : ''}
      ${firsts.length ? `<p class="dim small mt-16">Erste Bestwerte gesetzt für: ${firsts.map(p => esc(p.name)).join(', ')}</p>` : ''}`,
    foot: `<button class="btn btn-secondary" data-x="share">${icon('share')} Teilen</button><button class="btn btn-primary" data-x="ok">Fertig</button>`
  });
  m.el.addEventListener('click', e => {
    const b = e.target.closest('[data-x]');
    if (!b) return;
    if (b.dataset.x === 'share') shareWorkout({ ...doc, id });
    else m.close();
  });
  if (real.length) {
    confetti();
    real.slice(0, 4).forEach((p, i) => setTimeout(() => toast(`🏆 Neuer PR: ${PR.label(p)}!`, 'pr'), 500 + i * 900));
  }
}

/* ==========================================================================
   10. Übungs-Picker (Single/Multi)
   ========================================================================== */
function pickExercises({ multi = true, title = 'Übung wählen' } = {}) {
  return new Promise(resolve => {
    const picked = [];
    let q = '', cat = 'all';
    let result = null;
    const m = Modal.open({
      title, size: 'full',
      body: `<div class="search"><input class="input" id="pkQ" placeholder="Übung suchen …" autocomplete="off">${icon('search')}</div>
        <div class="chips mt-12" id="pkCats"></div>
        <div class="col mt-12" id="pkList" style="gap:8px"></div>`,
      foot: multi ? `<button class="btn btn-secondary" data-x="new">${icon('plus')} Neue Übung</button><button class="btn btn-primary" data-x="ok" id="pkOk" disabled>Hinzufügen</button>` : `<button class="btn btn-secondary" data-x="new">${icon('plus')} Neue Übung</button>`,
      onClose: () => resolve(result)
    });
    const usage = {};
    for (const r of Analytics.cur().rows) for (const id of r.ex) usage[id] = (usage[id] || 0) + 1;
    const renderList = () => {
      $('#pkCats', m.el).innerHTML = ['all', ...CATEGORIES].map(c => `<button class="chip ${cat === c ? 'active' : ''}" data-c="${c}">${c === 'all' ? 'Alle' : c}</button>`).join('');
      const nq = norm(q);
      let list = Ex.sorted().filter(e => (cat === 'all' || e.category === cat) && (!nq || norm(e.name).includes(nq) || (e.aliases || []).some(a => norm(a).includes(nq)) || (e.muscleGroups || []).some(mg => norm(mg).includes(nq))));
      if (!nq && cat === 'all') list = list.sort((a, b) => (usage[b.id] || 0) - (usage[a.id] || 0) || a.name.localeCompare(b.name, 'de'));
      $('#pkList', m.el).innerHTML = list.length ? list.map(e => `<button class="ex-item ${picked.includes(e.id) ? 'picked' : ''}" data-pick="${esc(e.id)}">
          <span class="cat-dot ${catCls(e.category)}">${catShort(e.category)}</span>
          <span class="grow" style="min-width:0"><div class="bold ellipsis">${esc(e.name)}</div><div class="ex-meta ellipsis">${esc((e.muscleGroups || []).join(', '))} · ${esc(e.equipment)}</div></span>
          ${picked.includes(e.id) ? `<span class="badge accent">${picked.indexOf(e.id) + 1}</span>` : (usage[e.id] ? `<span class="tiny dim">${usage[e.id]}×</span>` : '')}
        </button>`).join('') : emptyState('search', 'Nichts gefunden', 'Lege die Übung einfach neu an.');
      const ok = $('#pkOk', m.el);
      if (ok) { ok.disabled = !picked.length; ok.textContent = picked.length ? `Hinzufügen (${picked.length})` : 'Hinzufügen'; }
    };
    renderList();
    $('#pkQ', m.el).addEventListener('input', debounce(e => { q = e.target.value; renderList(); }, 150));
    m.el.addEventListener('click', async e => {
      const c = e.target.closest('[data-c]');
      if (c) { cat = c.dataset.c; renderList(); return; }
      const p = e.target.closest('[data-pick]');
      if (p) {
        const id = p.dataset.pick;
        if (!multi) { result = [id]; m.close(); return; }
        const i = picked.indexOf(id);
        if (i >= 0) picked.splice(i, 1); else picked.push(id);
        renderList();
        return;
      }
      const x = e.target.closest('[data-x]');
      if (!x) return;
      if (x.dataset.x === 'ok') { result = picked.slice(); m.close(); }
      if (x.dataset.x === 'new') {
        const id = await openExerciseForm(null, { name: q });
        if (id) { if (!multi) { result = [id]; m.close(); return; } picked.push(id); renderList(); }
      }
    });
  });
}

   11. Tools: Scheibenrechner & 1RM-Rechner

const PLATE_COLORS = { 25: '#e5484d', 20: '#3987e5', 15: '#eda100', 10: '#1baf7a', 5: '#e8e8e8', 2.5: '#3a3f4a', 1.25: '#9aa3af', 0.5: '#c3c2b7', 45: '#3987e5', 35: '#eda100' };
function platesFor(totalU, barU, plates) {
  let per = (totalU - barU) / 2;
  const out = [];
  if (per < 0) return { out, rest: per * 2 };
  for (const p of plates) { while (per >= p - 1e-9) { out.push(p); per = round(per - p, 4); } }
  return { out, rest: round(per * 2, 3) };
}
function openPlates(kg) {
  const lb = unit() === 'lb';
  const plates = lb ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25, 0.5];
  let total = kg ? round(toU(kg), 2) : (lb ? 135 : 60);
  let bar = round(toU(S().barKg), 1);
  const m = Modal.open({ title: 'Scheibenrechner', size: 'sm', body: '' });
  const draw = () => {
    const { out, rest } = platesFor(total, bar, plates);
    const maxP = plates[0];
    m.setBody(`
      <div class="form-grid">
        <label class="field"><span>Zielgewicht (${unit()})</span><input class="input num-input" id="plT" inputmode="decimal" value="${String(total).replace('.', ',')}"></label>
        <label class="field"><span>Stange (${unit()})</span><input class="input num-input" id="plB" inputmode="decimal" value="${String(bar).replace('.', ',')}"></label>
      </div>
      <div class="plates-vis" aria-hidden="true">
        <span class="bar-end"></span><span class="sleeve"></span>
        ${out.map(p => `<span class="plate" style="height:${40 + p / maxP * 80}px;background:${PLATE_COLORS[p] || '#888'}"></span>`).join('')}
      </div>
      <div class="center">
        ${total < bar ? '<p class="warn-text">Ziel ist leichter als die Stange.</p>' : out.length ? `<p class="dim small">Pro Seite</p><h2 class="mt-8">${out.map(p => nf(p, 2)).join(' + ')}</h2>` : '<p class="dim">Nur die Stange 🙂</p>'}
        ${rest > 0 ? `<p class="warn-text small mt-8">${nf(rest, 2)} ${unit()} lassen sich mit den Scheiben nicht exakt darstellen.</p>` : ''}
      </div>`);
    const t = $('#plT', m.el), b = $('#plB', m.el);
    const upd = () => { total = parseNum(t.value) || 0; bar = parseNum(b.value) || 0; draw(); };
    t.addEventListener('change', upd); b.addEventListener('change', upd);
  };
  draw();
}
Actions.plates = el => { const s = el.dataset.ei != null ? setAt(el) : null; openPlates(s ? (s.weightKg || null) : null); };
function open1RM() {
  const m = Modal.open({ title: '1RM-Rechner', size: 'sm', body: '' });
  let w = 80, r = 5;
  const draw = () => {
    const one = e1rm(w, r) || w;
    const rows = [100, 95, 90, 85, 80, 75, 70, 65, 60, 50].map(p => {
      const load = one * p / 100;
      const reps = p === 100 ? 1 : Math.max(1, Math.round(30 * (100 / p - 1)));
      return `<tr><td>${p} %</td><td class="r bold">${nf(load, 1)} ${unit()}</td><td class="r dim">≈ ${reps} Wdh.</td></tr>`;
    }).join('');
    m.setBody(`<div class="form-grid">
        <label class="field"><span>Gewicht (${unit()})</span><input class="input num-input" id="rmW" inputmode="decimal" value="${String(w).replace('.', ',')}"></label>
        <label class="field"><span>Wiederholungen</span><input class="input num-input" id="rmR" inputmode="numeric" value="${r}"></label>
      </div>
      <div class="center mt-16"><p class="dim small">Geschätztes 1RM (Epley)</p><div style="font-size:42px;font-weight:800">${nf(one, 1)} <small class="dim" style="font-size:18px">${unit()}</small></div></div>
      <table class="tbl mt-12"><tbody>${rows}</tbody></table>`);
    $('#rmW', m.el).addEventListener('change', e => { w = parseNum(e.target.value) || 0; draw(); });
    $('#rmR', m.el).addEventListener('change', e => { r = Math.max(1, Math.round(parseNum(e.target.value) || 1)); draw(); });
  };
  draw();
}

function exChartKey(t) {

/** 1RM-, Volumen- und Max-Gewicht-Verlauf einer Übung (§8.3) */
function exerciseChart(id, key) {
  const ss = Analytics.sessionsOf(id);
  if (ss.length < 1) return null;
  const t = Ex.type(Ex.get(id));
  const map = {
    e1rm: ['Geschätztes 1RM', s => toU(s.best), v => fmtW(fromU(v))],
    vol: ['Volumen', s => toU(s.vol), v => fmtTon(fromU(v))],
    maxw: ['Max-Gewicht', s => toU(s.maxW), v => fmtW(fromU(v))],
    reps: [t === 'sec' ? 'Längster Satz (s)' : 'Max Wdh.', s => t === 'sec' ? maxOf(s.list, x => x.sec) : maxOf(s.list, x => x.r), v => t === 'sec' ? fmtClock(v) : nf(v, 0)],
    sets: ['Sätze', s => s.sets, v => nf(v, 0)]
  };
  const [label, f, fmt] = map[key] || map.e1rm;
  const data = ss.map(s => ({ x: s.dn, y: f(s) })).filter(p => p.y > 0);
  if (!data.length) return null;
  return timeLine([lineDS(label, data, chartColors().accent)], { tooltipFmt: v => fmt(v) });
}

        <div class="field"><span>Muskelgruppen</span>
          <div class="muscle-pick">${[...MUSCLES, 'Ausdauer'].map(mg => `<button class="chip soft ${d.muscleGroups.includes(mg) ? 'active' : ''}" data-m="${esc(mg)}">${esc(mg)}</button>`).join('')}</div></div>

/* ==========================================================================
   13. Charts (Chart.js v4, lazy geladen)
   ========================================================================== */
function chartColors() {
  return {
    accent: cssVar('--accent'), text: cssVar('--text'), dim: cssVar('--text-dim'), faint: cssVar('--text-faint'),
    grid: cssVar('--grid'), surface: cssVar('--surface'), danger: cssVar('--danger'), warning: cssVar('--warning'),
    success: cssVar('--success'), series: [1, 2, 3, 4, 5, 6, 7, 8].map(i => cssVar('--c' + i))
  };
}
const Charts = (() => {
  const inst = new Map();
  let loading = null;
  function ensure() {
    if (window.Chart) return Promise.resolve(true);
    if (!loading) loading = loadScript(CDN.chart).then(() => { applyDefaults(); return true; }).catch(() => { loading = null; return false; });
    return loading;
  }
  function applyDefaults() {
    const C = window.Chart;
    if (!C) return;
    const c = chartColors();
    C.defaults.font.family = getComputedStyle(document.body).fontFamily;
    C.defaults.font.size = 11.5;
    C.defaults.color = c.dim;
    C.defaults.borderColor = c.grid;
    C.defaults.maintainAspectRatio = false;
    C.defaults.responsive = true;
    C.defaults.animation.duration = 350;
    const tt = C.defaults.plugins.tooltip;
    Object.assign(tt, { backgroundColor: cssVar('--surface-3'), titleColor: c.text, bodyColor: c.text, borderColor: cssVar('--border-strong'), borderWidth: 1, padding: 10, cornerRadius: 10, boxPadding: 4, usePointStyle: true });
    Object.assign(C.defaults.plugins.legend.labels, { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 14, color: c.dim });
    Object.assign(C.defaults.elements.point, { radius: 0, hoverRadius: 6, hitRadius: 14 });
    C.defaults.elements.line.borderWidth = 2;
    C.defaults.elements.bar.borderRadius = 4;
    // Re-Theme laufender Charts
    for (const [id, x] of inst) if (x.chart) mount(id, x.factory);
  }
  function mount(id, factory) {
    const cv = document.getElementById('cv-' + id);
    if (!cv) return;
    destroy(id);
    const box = cv.parentElement;
    $$('.chart-empty', box).forEach(n => n.remove());
    if (!window.Chart) {
      box.insertAdjacentHTML('beforeend', `<div class="chart-empty">Diagramme brauchen beim ersten Mal eine Internetverbindung.</div>`);
      return;
    }
    let cfg = null;
    try { cfg = factory(); } catch (e) { console.error('Chart', id, e); }
    if (!cfg) {
      cv.style.display = 'none';
      box.insertAdjacentHTML('beforeend', `<div class="chart-empty">Noch nicht genug Daten im gewählten Zeitraum</div>`);
      inst.set(id, { factory, canvas: cv });
      return;
    }
    cv.style.display = '';
    const chart = new window.Chart(cv.getContext('2d'), cfg);
    inst.set(id, { chart, canvas: cv, factory });
  }
  function destroy(id) { const x = inst.get(id); if (x && x.chart) x.chart.destroy(); inst.delete(id); }
  function destroyIn(root) {
    for (const [id, x] of [...inst]) if (!x.canvas || !x.canvas.isConnected || (root && root.contains(x.canvas))) destroy(id);
  }
  function get(id) { return inst.get(id); }
  return { ensure, applyDefaults, mount, destroy, destroyIn, get };
})();

/* Hilfslinien (MEV/MAV/MRV, Benchmarks) als kleines Inline-Plugin */
const thresholdPlugin = {
  id: 'thresholds',
  afterDatasetsDraw(chart, args, opts) {
    const lines = (opts && opts.lines) || [];
    if (!lines.length) return;
    const { ctx, chartArea: a, scales } = chart;
    const ax = opts.axis === 'x' ? scales.x : scales.y;
    ctx.save();
    ctx.font = '600 10.5px ' + getComputedStyle(document.body).fontFamily;
    for (const l of lines) {
      const p = ax.getPixelForValue(l.value);
      if (!Number.isFinite(p) || (opts.axis === 'x' ? p < a.left || p > a.right : p < a.top || p > a.bottom)) continue;
      ctx.strokeStyle = l.color; ctx.fillStyle = l.color; ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      if (opts.axis === 'x') { ctx.moveTo(p, a.top); ctx.lineTo(p, a.bottom); } else { ctx.moveTo(a.left, p); ctx.lineTo(a.right, p); }
      ctx.stroke();
      ctx.setLineDash([]);
      if (opts.axis === 'x') { ctx.textAlign = 'center'; ctx.fillText(l.label, p, a.top - 5); }
      else { ctx.textAlign = 'left'; ctx.fillText(l.label, a.left + 4, p - 4); }
    }
    ctx.restore();
  }
};

const dnTick = function (v) {
  const span = (this.max - this.min) || 0;
  return span > 420 ? fmtDN(v, { month: 'short', year: '2-digit' }) : fmtDN(v, { day: '2-digit', month: '2-digit' });
};
function lineDS(label, data, color, opts = {}) {
  const c = chartColors();
  return {
    label, data, borderColor: color, backgroundColor: alpha(color, .12), fill: true, tension: .3,
    pointRadius: data.length <= 40 ? 4 : 0, pointHoverRadius: 6, pointBackgroundColor: color,
    pointBorderColor: c.surface, pointBorderWidth: 2, borderWidth: 2, spanGaps: true, ...opts
  };
}
/** Achsen-Ticks mit so vielen Nachkommastellen wie die Schrittweite braucht (82,5 statt 83/83/83) */
const yAuto = (suffix = '') => function (v, i, ticks) {
  const step = ticks && ticks.length > 1 ? Math.abs(ticks[1].value - ticks[0].value) : 1;
  return nf(v, step >= 1 ? 0 : step >= 0.1 ? 1 : 2) + suffix;
};
/** Zeitreihe mit linearer X-Achse (Tag-Nummern) – kein Datums-Adapter nötig */
function timeLine(datasets, { tooltipFmt = v => nf(v, 1), yFmt = yAuto(), legend = false, yMin, yMax, thresholds, xMax } = {}) {
  return {
    type: 'line',
    data: { datasets },
    plugins: thresholds ? [thresholdPlugin] : [],
    options: {
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: { type: 'linear', bounds: 'data', grid: { display: false }, border: { display: false }, max: xMax, ticks: { maxTicksLimit: 5, maxRotation: 0, callback: dnTick } },
        y: { grid: { color: chartColors().grid }, border: { display: false }, min: yMin, max: yMax, ticks: { maxTicksLimit: 5, callback: yFmt } }
      },
      plugins: {
        legend: { display: legend, position: 'bottom' },
        thresholds: thresholds || {},
        tooltip: {
          callbacks: {
            title: items => items.length ? fmtDN(Math.round(items[0].parsed.x), { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' }) : '',
            label: ctx => `${ctx.dataset.label}: ${ctx.raw && ctx.raw.label ? ctx.raw.label : tooltipFmt(ctx.parsed.y, ctx)}`
          }
        }
      }
    }
  };
}
function barChart(labels, datasets, { yFmt = v => nf(v, 0), tooltipFmt, horizontal = false, stacked = false, legend = false, thresholds, xMax } = {}) {
  const valAxis = horizontal ? 'x' : 'y';
  const catAxis = horizontal ? 'y' : 'x';
  return {
    type: 'bar',
    data: { labels, datasets },
    plugins: thresholds ? [thresholdPlugin] : [],
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      layout: { padding: { top: thresholds && thresholds.axis === 'x' ? 16 : 0 } },
      interaction: { mode: 'index', intersect: false },
      scales: {
        [catAxis]: { stacked, grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: horizontal ? 20 : 8 } },
        [valAxis]: { stacked, beginAtZero: true, max: xMax, grid: { color: chartColors().grid }, border: { display: false }, ticks: { maxTicksLimit: 5, callback: yFmt } }
      },
      plugins: {
        legend: { display: legend, position: 'bottom' },
        thresholds: thresholds || {},
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${tooltipFmt ? tooltipFmt(ctx.parsed[valAxis], ctx) : nf(ctx.parsed[valAxis], 1)}` } }
      }
    }
  };
}
const barDS = (label, data, color, opts = {}) => ({ label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 26, categoryPercentage: .8, barPercentage: .9, ...opts });
function donut(labels, data, colors, { tooltipFmt = v => nf(v, 0) } = {}) {
  const total = sum(data);
  return {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: chartColors().surface, borderWidth: 2, hoverOffset: 6 }] },
    options: {
      cutout: '62%',
      plugins: {
        legend: { position: 'right', labels: { padding: 10 } },
        tooltip: { callbacks: { label: ctx => `${ctx.label}: ${tooltipFmt(ctx.parsed)} (${nf(total ? ctx.parsed / total * 100 : 0, 0)} %)` } }
      }
    }
  };
}

/* Karten-Builder: HTML sammeln, Charts nach dem Einfügen mounten */
function chartBuilder() {
  const pending = [];
  return {
    card({ id, title, info, big, small, delta, sub, size = '', wide = false, factory, extra = '', top = '' }) {
      if (factory) pending.push([id, factory]);
      return `<div class="chart-card ${wide ? 'wide' : ''}">
        <div class="cc-head"><span class="cc-title">${esc(title)}</span>${info ? infoBtn(info) : ''}${factory ? `<button class="btn-icon" style="width:36px;height:36px" data-act="chartExpand" data-id="${id}" data-title="${esc(title)}" aria-label="Vollbild">${icon('expand')}</button>` : ''}</div>
        ${top}
        ${big != null ? `<div class="cc-big"><b>${big}</b>${small ? `<small>${small}</small>` : ''}${delta || ''}</div>` : ''}
        ${sub ? `<div class="cc-sub">${sub}</div>` : ''}
        ${factory ? `<div class="chart-box ${size}"><canvas id="cv-${id}" role="img" aria-label="${esc(title)}"></canvas></div>` : ''}
        ${extra}
      </div>`;
    },
    mountAll() {
      if (!pending.length) return;
      Charts.ensure().then(() => pending.forEach(([id, f]) => Charts.mount(id, f)));
    }
  };
}
/* Vollbild + Tabellenansicht (jeder Chart hat eine Tabelle als Zwilling) */
Actions.chartExpand = el => {

function chartTable(cfg) {
  if (!cfg) return '<p class="dim">Keine Daten</p>';
  const ds = cfg.data.datasets;
  const fmtV = v => v == null ? '–' : typeof v === 'object' ? nf(v.y, 1) : nf(v, 1);
  if (cfg.data.labels) {
    return `<table class="tbl"><thead><tr><th></th>${ds.map(d => `<th class="r">${esc(d.label || '')}</th>`).join('')}</tr></thead><tbody>${cfg.data.labels.map((l, i) => `<tr><td>${esc(Array.isArray(l) ? l.join(' ') : l)}</td>${ds.map(d => `<td class="r">${fmtV(d.data[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  const xs = uniq(ds.flatMap(d => d.data.map(p => p.x))).sort((a, b) => b - a);
  return `<table class="tbl"><thead><tr><th>Datum</th>${ds.map(d => `<th class="r">${esc(d.label || '')}</th>`).join('')}</tr></thead><tbody>${xs.slice(0, 400).map(x => `<tr><td>${fmtDN(Math.round(x))}</td>${ds.map(d => { const p = d.data.find(q => q.x === x); return `<td class="r">${p ? fmtV(p) : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
}

/* Mini-Visualisierungen ohne Chart.js (Sparkline, Mini-Bars, Ring) */
function sparkline(vals, color) {
  if (vals.length < 2) return '<svg class="spark"></svg>';
  const mn = Math.min(...vals), mx = Math.max(...vals), span = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(28 - (v - mn) / span * 24).toFixed(2)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function scoreRing(v, color) {
  const R = 36, L = 2 * Math.PI * R;
  return `<div class="score-ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="8"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L * (1 - clamp(v, 0, 100) / 100)}"/></svg><b>${Math.round(v)}</b></div>`;
}
const heatColor = lv => lv <= 0 ? 'var(--surface-2)' : `color-mix(in srgb, var(--accent) ${[0, 28, 50, 75, 100][clamp(lv, 0, 4)]}%, var(--surface-2))`;
