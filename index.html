<script>
  // Darstellung vor dem ersten Paint setzen (verhindert Flackern) – Cache aus applyTheme()
  (function () {
    var P = 'gymlog.';   // wie LS_PREFIX in js/core.js
    try {
      var d = document.documentElement, L = JSON.parse(localStorage.getItem(P + 'look') || 'null') || {};
      var t = L.theme || localStorage.getItem(P + 'theme') || 'dark', h = new Date().getHours();
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      else if (t === 'time') t = h >= 19 || h < 7 ? 'dark' : 'light';
      else if (t !== 'light') t = 'dark';
      var a = L.attrs || {}, ph = null;
      if (a['data-design'] && !/^(gymlog|glass|pure|plakat|fokus|sky)$/.test(a['data-design'])) a['data-design'] = 'gymlog';
      // Tag & Nacht: Phase aus den Sonnenzeiten des letzten Starts (Minuten ab Mitternacht) – Hell/Dunkel folgt der Phase
      if (a['data-design'] === 'sky') {
        var b = L.sky, mm = h * 60 + new Date().getMinutes();
        ph = b ? (mm < b[0] ? 'night' : mm < b[1] ? 'dawn' : mm < b[2] ? 'day' : mm < b[3] ? 'dusk' : 'night') : (a['data-phase'] || 'day');
        a['data-phase'] = ph; t = ph === 'dawn' || ph === 'day' ? 'light' : 'dark';
      } else a['data-phase'] = null;
      d.setAttribute('data-theme', t);
      for (var k in a) if (a[k] != null) d.setAttribute(k, a[k]);
      var lc = L.launch && L.launch[ph || t];   // Farben des Designs für den Ladebildschirm (applyTheme)
      d.style.cssText = (L.accent ? L.accent[ph || t] || '' : '') + (L.extra || '') + (lc ? '--launch-bg:' + lc[0] + ';--launch-fg:' + lc[1] + ';' : '');
    } catch (e) {}
    // App-Icon: ?icon=N (aus „Auf dem Home-Bildschirm übernehmen") oder gespeicherte Wahl – vor „Zum Home-Bildschirm"
    try {
      var m = location.search.match(/[?&]icon=(\d+)/), ic = m && m[1];
      if (ic) { localStorage.setItem(P + 'icon', ic); window.__iconFromUrl = ic; history.replaceState(null, '', location.pathname + location.hash); }
      ic = ic || localStorage.getItem(P + 'icon');
      if (ic && /^[2-6]$/.test(ic)) {   // gültige Icons wie APP_ICONS in js/core.js
        var g = function (id) { return document.getElementById(id); }, p = 'icons/' + ic + '/';
        g('lnkTouch').href = p + 'apple-touch-icon.png';
        g('lnkPng').href = p + 'icon-192.png';
        g('lnkSvg').type = 'image/png'; g('lnkSvg').href = p + 'icon-192.png';
        g('lnkManifest').href = p + 'manifest.json';
      }
    } catch (e) {}
  })();
</script>

<div id="launchScreen" role="status" aria-label="Trainio wird geöffnet">
  <svg aria-hidden="true" viewBox="0 0 54 60" fill="none" stroke="currentColor" stroke-width="1.23" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 13h44"/>
    <path class="launch-arms" d="M17 13L20 21L27 28L34 21L37 13"/>
    <g class="launch-body"><circle cx="27" cy="22" r="3.6"/><path d="M27 26v12m0 0-4 13m4-13 4 13"/></g>
  </svg>
</div>
<noscript><style>#launchScreen { display: none }</style><p>Trainio benötigt JavaScript.</p></noscript>
<script>
  // Ohne externe Dateien zeichnen, damit die Figur schon während des Downloads läuft.
  const LaunchScreen = (() => {
    const screen = document.getElementById('launchScreen');
    const arms = screen.querySelector('.launch-arms'), body = screen.querySelector('.launch-body');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const start = performance.now();
    let frame, failed = false;
    function draw(time) {
      const still = reduced.matches || document.documentElement.hasAttribute('data-motion');
      const lift = still ? 10 : 7 * (1 - Math.cos((time - start) * 2 * Math.PI / 1600));
      // Hände bleiben auf der Stange. Die beiden gleich langen Armsegmente treffen sich am Ellbogen.
      const shoulder = 28 - lift, dy = shoulder - 13, distance = Math.hypot(10, dy);
      const bend = Math.sqrt(9.5 ** 2 - distance ** 2 / 4);
      const x = 22 - dy * bend / distance, y = (13 + shoulder) / 2 + 10 * bend / distance;
      arms.setAttribute('d', `M17 13L${x} ${y}L27 ${shoulder}L${54 - x} ${y}L37 13`);
      body.setAttribute('transform', `translate(0 ${-lift})`);
      if (!still) frame = requestAnimationFrame(draw);
    }
    function fail() {
      if (failed || !screen.isConnected) return;
      failed = true;
      cancelAnimationFrame(frame);
      screen.removeAttribute('aria-label');
      screen.innerHTML = '<p>Trainio konnte nicht vollständig geladen werden.<button type="button">Erneut versuchen</button></p>';
      screen.querySelector('button').onclick = () => location.reload();
    }
    function assetError(e) {
      const el = e.target;
      if (el.matches?.('link[href^="css/"], script[src^="js/"]')) fail();
    }
    document.addEventListener('error', assetError, true);
    draw(start);
    return {
      async stylesReady() {
        const links = [...document.querySelectorAll('link[rel="stylesheet"][href^="css/"]')];
        await Promise.all(links.map(link => link.sheet || failed ? null : new Promise(resolve => {
          link.addEventListener('load', resolve, { once: true });
          link.addEventListener('error', resolve, { once: true });
        })));
        if (failed) throw new Error('Startdateien fehlen');
        links.forEach(link => { link.media = 'all'; });
      },
      finish() {
        cancelAnimationFrame(frame);
        document.removeEventListener('error', assetError, true);
        screen.remove();
      },
      fail
    };
  })();
</script>
