<!DOCTYPE html>
<html lang="de" data-theme="dark" data-design="gymlog">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainio</title>
<meta name="description" content="Trainio – Workout-Tracker, Trainingsplan-Builder und Progress-Tracker.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainio">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json" id="lnkManifest">
<link rel="apple-touch-icon" href="icons/1/apple-touch-icon.png" id="lnkTouch">
<link rel="icon" type="image/svg+xml" href="icon.svg" id="lnkSvg">
<link rel="icon" type="image/png" href="icons/1/icon-192.png" id="lnkPng">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Darstellung vor dem ersten Paint setzen (verhindert Flackern) – Cache aus applyTheme()
  (function () {
    try {
      var d = document.documentElement, L = JSON.parse(localStorage.getItem('gymlog.look') || 'null') || {};
      var t = L.theme || localStorage.getItem('gymlog.theme') || 'dark', h = new Date().getHours();
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      else if (t === 'time') t = h >= 19 || h < 7 ? 'dark' : 'light';
      else if (t !== 'light') t = 'dark';
      var a = L.attrs || {}, ph = null;
      if (a['data-design'] && !/^(gymlog|glass|iron|pure|carbon|paper|plakat|sky)$/.test(a['data-design'])) { a['data-design'] = 'gymlog'; L.fonts = []; }
      // Tag & Nacht: Phase aus den Sonnenzeiten des letzten Starts (Minuten ab Mitternacht) – Hell/Dunkel folgt der Phase
      if (a['data-design'] === 'sky') {
        var b = L.sky, mm = h * 60 + new Date().getMinutes();
        ph = b ? (mm < b[0] ? 'night' : mm < b[1] ? 'dawn' : mm < b[2] ? 'day' : mm < b[3] ? 'dusk' : 'night') : (a['data-phase'] || 'day');
        a['data-phase'] = ph; t = ph === 'dawn' || ph === 'day' ? 'light' : 'dark';
      } else a['data-phase'] = null;
      d.setAttribute('data-theme', t);
      for (var k in a) if (a[k] != null) d.setAttribute(k, a[k]);
      d.style.cssText = (L.accent ? L.accent[ph || t] || '' : '') + (L.extra || '');
      (L.fonts || []).forEach(function (f) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f; l.crossOrigin = 'anonymous'; document.head.appendChild(l); });
    } catch (e) {}
    // App-Icon: ?icon=N (aus „Auf dem Home-Bildschirm übernehmen") oder gespeicherte Wahl – vor „Zum Home-Bildschirm"
    try {
      var m = location.search.match(/[?&]icon=(\d+)/), ic = m && m[1];
      if (ic) { localStorage.setItem('gymlog.icon', ic); window.__iconFromUrl = ic; history.replaceState(null, '', location.pathname + location.hash); }
      ic = ic || localStorage.getItem('gymlog.icon');
      if (ic && /^[2-6]$/.test(ic)) {   // gültige Icons wie APP_ICONS in js/core.js
        var g = function (id) { return document.getElementById(id); }, p = 'icons/' + ic + '/';
        g('lnkTouch').href = p + 'apple-touch-icon.png';
        g('lnkPng').href = p + 'icon-192.png';
        g('lnkSvg').type = 'image/png'; g('lnkSvg').href = p + 'icon-192.png';
        g('lnkManifest').href = p + 'manifest.json';
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/app.css?v=1.32.0">
</head>
<body>
<!-- Himmel für das Design „Tag & Nacht" (js/sky.js malt Farben, Sonne, Mond; sonst ausgeblendet). Berge wie Sky-HILLS -->
<div id="sky" aria-hidden="true">
  <div class="sky-grad"></div>
  <div class="sky-glow"></div>
  <div class="sky-stars"><i></i><i></i><i></i><b class="sky-shoot"></b><b class="sky-shoot two"></b></div>
  <svg class="sky-moon" viewBox="-22 -22 44 44"><circle class="dark" r="18"/><path class="lit"/></svg>
  <div class="sky-sun"></div>
  <div class="sky-clouds"><i></i><i></i><i></i></div>
  <svg class="sky-hills" viewBox="0 0 1200 300" preserveAspectRatio="none"><path class="far" d="M0 300V170C60 160 110 120 170 112S260 140 320 128 420 70 500 78 600 132 680 126 780 88 860 96 980 140 1050 130 1150 104 1200 112V300Z"/><path class="near" d="M0 300V226C80 214 150 196 240 200S400 236 500 228 650 190 760 194 900 230 1000 222 1130 196 1200 204V300Z"/></svg>
</div>
<div id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <div id="sbShade" aria-hidden="true"></div>
    <div id="banner"></div>
    <main class="view" id="view">
      <section class="tab" id="tab-start"></section>
      <section class="tab" id="tab-training"></section>
      <section class="tab" id="tab-exercises"></section>
      <section class="tab" id="tab-progress"></section>
      <section class="tab" id="tab-more"></section>
    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Navigation"></nav>
<div id="restDock"></div>
<div id="fabRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<div id="popover" class="popover" hidden></div>
<noscript><div style="padding:24px">Trainio benötigt JavaScript.</div></noscript>

<script src="js/boot.js?v=1.32.0"></script>
</body>
</html>
